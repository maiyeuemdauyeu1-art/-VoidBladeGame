<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DDTH Đám Mây</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
body{background:#000;color:#fff}
#phone{
width:100vw;height:100vh;position:relative;overflow:hidden;
background:linear-gradient(145deg,#17243b,#07101e 55%,#101827)
}
#status{
height:34px;display:flex;justify-content:space-between;align-items:center;
padding:0 17px;font-size:13px;position:absolute;top:0;left:0;right:0;z-index:100
}
#home{
position:absolute;top:34px;bottom:60px;left:0;right:0;
padding:22px 17px;overflow:auto
}
.logo{
text-align:center;font-size:30px;font-weight:bold;margin:10px 0 7px
}
.cloud{text-align:center;font-size:13px;color:#aebbd0;margin-bottom:28px}
.apps{
display:grid;grid-template-columns:repeat(4,1fr);
gap:25px 12px
}
.app{text-align:center;cursor:pointer}
.icon{
width:64px;height:64px;margin:auto;border-radius:18px;
display:flex;align-items:center;justify-content:center;
font-size:30px;background:#202b3d;
box-shadow:0 7px 18px #0008
}
.app span{font-size:12px;display:block;margin-top:7px;color:#eee}
#dock{
position:absolute;bottom:0;left:0;right:0;height:60px;
display:flex;align-items:center;justify-content:center;
background:#111827dd;z-index:100
}
.homebtn{
width:42px;height:42px;border:2px solid #aaa;border-radius:50%;
background:transparent
}
.page{
display:none;position:absolute;top:34px;bottom:60px;left:0;right:0;
background:#0b0f16;z-index:50
}
.page.active{display:block}
.top{
height:55px;background:#171e2a;border-bottom:1px solid #303846;
display:flex;align-items:center;gap:10px;padding:8px 12px
}
.back{font-size:30px;width:35px;cursor:pointer}
.top b{font-size:17px}
.body{height:calc(100% - 55px);overflow:auto}
input{
outline:none
}

/* Tìm kiếm */
#searchBody{padding:18px}
.google{
font-size:42px;text-align:center;margin:35px 0 25px
}
.searchbox{
height:48px;border-radius:25px;background:#202124;
border:1px solid #555;display:flex;align-items:center;padding:4px
}
.searchbox input{
flex:1;background:none;border:0;color:white;font-size:16px;padding:10px
}
.searchbox button{
border:0;border-radius:22px;background:#4285f4;color:#fff;
height:40px;padding:0 18px
}
.result{
margin-top:18px;background:#1b2029;border-radius:12px;padding:16px
}
.result .url{font-size:12px;color:#aaa}
.result h3{font-size:18px;color:#8ab4f8;margin:7px 0}
.result button{
background:#4285f4;color:#fff;border:0;border-radius:8px;padding:9px 12px
}

/* Trình duyệt */
.browserbar{
height:55px;background:#171e2a;display:flex;gap:7px;padding:7px
}
.browserbar input{
flex:1;border:0;border-radius:20px;background:#293241;
color:#fff;padding:0 14px
}
.browserbar button{
border:0;border-radius:20px;background:#4285f4;color:#fff;padding:0 14px
}
iframe{
width:100%;height:calc(100% - 55px);border:0;background:white
}

/* Tệp */
.file{
margin:12px;background:#1b222e;border-radius:12px;
padding:17px;display:flex;justify-content:space-between;align-items:center
}
.download{
background:#4285f4;border:0;color:#fff;border-radius:8px;padding:9px 13px
}

/* Ghi chú */
#note{
width:calc(100% - 24px);height:calc(100% - 24px);margin:12px;
background:#151b25;border:1px solid #333;border-radius:12px;
color:white;padding:15px;font-size:16px;resize:none
}

/* Máy tính */
#calculator{padding:12px}
#display{
width:100%;height:70px;background:#151a22;border:0;border-radius:10px;
color:#fff;text-align:right;font-size:32px;padding:10px
}
.keys{
display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px
}
.keys button{
height:60px;border:0;border-radius:12px;background:#27303d;
color:#fff;font-size:20px
}

/* Game */
#gameCanvas{width:100%;height:100%;display:block}
.gamebuttons{
position:absolute;bottom:20px;left:0;right:0;
display:flex;justify-content:space-around
}
.gamebuttons button{
width:65px;height:65px;border-radius:50%;
border:1px solid #aaa;background:#ffffff22;color:#fff;font-size:25px
}
</style>
</head>

<body>

<div id="phone">

<div id="status">
<span id="clock">00:00</span>
<span>☁ 100%　▰</span>
</div>

<!-- MÀN HÌNH DDTH ĐÁM MÂY -->
<div id="home">
<div class="logo">☁ DDTH Đám Mây</div>
<div class="cloud">Điện thoại mô phỏng trên trình duyệt</div>

<div class="apps">

<div class="app" onclick="openPage('search')">
<div class="icon">🔎</div><span>Google</span>
</div>

<div class="app" onclick="openPage('browser')">
<div class="icon">🌐</div><span>Web</span>
</div>

<div class="app" onclick="openPage('game')">
<div class="icon">🎮</div><span>Game</span>
</div>

<div class="app" onclick="openPage('files')">
<div class="icon">📁</div><span>Tệp</span>
</div>

<div class="app" onclick="openPage('calculator')">
<div class="icon">🧮</div><span>Máy tính</span>
</div>

<div class="app" onclick="openPage('notes')">
<div class="icon">📝</div><span>Ghi chú</span>
</div>

<div class="app" onclick="alert('Cửa hàng ứng dụng DDTH Đám Mây')">
<div class="icon">🛍️</div><span>Cửa hàng</span>
</div>

<div class="app" onclick="alert('DDTH Đám Mây đang hoạt động')">
<div class="icon">☁️</div><span>Đám mây</span>
</div>

</div>
</div>

<!-- GOOGLE TỰ LÀM -->
<div class="page" id="search">
<div class="top">
<div class="back" onclick="home()">‹</div>
<b>Google</b>
</div>

<div class="body" id="searchBody">
<div class="google">Google</div>

<div class="searchbox">
<input id="query" placeholder="Tìm kiếm trên Google"
onkeydown="if(event.key==='Enter')search()">
<button onclick="search()">Tìm</button>
</div>

<div id="results"></div>
</div>
</div>

<!-- TRÌNH DUYỆT -->
<div class="page" id="browser">
<div class="browserbar">
<input id="url" placeholder="Nhập địa chỉ trang web"
onkeydown="if(event.key==='Enter')go()">
<button onclick="go()">Đi</button>
</div>
<iframe id="webview"></iframe>
</div>

<!-- TỆP -->
<div class="page" id="files">
<div class="top">
<div class="back" onclick="home()">‹</div>
<b>Tệp</b>
</div>

<div class="body">
<div class="file">
<span>📦 ung-dung-ddth.apk</span>
<button class="download" onclick="downloadAPK()">Tải</button>
</div>

<div class="file">
<span>🎮 ddth-game.html</span>
<button class="download" onclick="downloadGame()">Tải</button>
</div>
</div>
</div>

<!-- MÁY TÍNH -->
<div class="page" id="calculator">
<div class="top">
<div class="back" onclick="home()">‹</div>
<b>Máy tính</b>
</div>

<div class="body" style="padding:12px">
<input id="display" readonly>
<div class="keys">
<button onclick="clearCalc()">C</button>
<button onclick="put('/')">÷</button>
<button onclick="put('*')">×</button>
<button onclick="put('-')">−</button>

<button onclick="put('7')">7</button>
<button onclick="put('8')">8</button>
<button onclick="put('9')">9</button>
<button onclick="put('+')">+</button>

<button onclick="put('4')">4</button>
<button onclick="put('5')">5</button>
<button onclick="put('6')">6</button>
<button onclick="equal()">=</button>

<button onclick="put('1')">1</button>
<button onclick="put('2')">2</button>
<button onclick="put('3')">3</button>
<button onclick="put('0')">0</button>
</div>
</div>
</div>

<!-- GHI CHÚ -->
<div class="page" id="notes">
<div class="top">
<div class="back" onclick="home()">‹</div>
<b>Ghi chú</b>
</div>
<div class="body">
<textarea id="note" placeholder="Viết ghi chú..."></textarea>
</div>
</div>

<!-- GAME TỰ TẠO -->
<div class="page" id="game">
<canvas id="gameCanvas"></canvas>

<div class="gamebuttons">
<button id="left">←</button>
<button id="jump">↑</button>
<button id="right">→</button>
<button id="hit">⚔</button>
</div>
</div>

<div id="dock">
<button class="homebtn" onclick="home()"></button>
</div>

</div>

<script>
/* Đồng hồ */
function clock(){
let d=new Date();
document.getElementById("clock").textContent=
d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
}
setInterval(clock,1000);
clock();

/* Chuyển ứng dụng */
function openPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
if(id==="game")startGame();
}

function home(){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
}

/* Tìm kiếm Google mô phỏng */
function search(){
let q=document.getElementById("query").value.trim();
if(!q)return;

let e=encodeURIComponent(q);

document.getElementById("results").innerHTML=`
<div class="result">
<div class="url">Google</div>
<h3>Kết quả tìm kiếm: ${escapeHTML(q)}</h3>
<p>Các kết quả được tạo bởi DDTH Đám Mây.</p>
<button onclick="openGoogle('${e}')">Mở Google</button>
</div>

<div class="result">
<div class="url">Trang web</div>
<h3>Tìm "${escapeHTML(q)}" trên web</h3>
<button onclick="browseSearch('${e}')">Mở tìm kiếm</button>
</div>`;
}

function openGoogle(q){
document.getElementById("url").value=
"https://www.google.com/search?q="+q;
openPage("browser");
document.getElementById("webview").src=
"https://www.google.com/search?q="+q;
}

function browseSearch(q){
openGoogle(q);
}

function escapeHTML(s){
return s.replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#039;"
}[m]));
}

/* Trình duyệt */
function go(){
let u=document.getElementById("url").value.trim();
if(!u)return;
if(!/^https?:\/\//i.test(u))u="https://"+u;
document.getElementById("webview").src=u;
}

/* Máy tính */
function put(x){
document.getElementById("display").value+=x;
}
function clearCalc(){
document.getElementById("display").value="";
}
function equal(){
let x=document.getElementById("display").value;
if(!/^[0-9+\-*/.() ]+$/.test(x))return;
try{
document.getElementById("display").value=
Function('"use strict";return('+x+')')();
}catch{
document.getElementById("display").value="Lỗi";
}
}

/* Tải tệp APK mẫu.
   Đây là tệp mẫu để tải xuống, không phải ứng dụng Android thật. */
function downloadAPK(){
let data="DDTH Đám Mây - tệp APK mẫu";
let blob=new Blob([data],{type:"application/vnd.android.package-archive"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="DDTH-Dam-May.apk";
a.click();
URL.revokeObjectURL(a.href);
}

/* Tải trò chơi HTML */
function downloadGame(){
let html=`
<!DOCTYPE html>
<html lang="vi">
<body style="background:#111;color:white;text-align:center">
<h1>DDTH Game</h1>
<p>Trò chơi DDTH Đám Mây</p>
<button onclick="alert('Bạn đã bắt đầu trò chơi!')">
Bắt đầu
</button>
</body>
</html>`;
let blob=new Blob([html],{type:"text/html"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="DDTH-Game.html";
a.click();
URL.revokeObjectURL(a.href);
}

/* Trò chơi 2D tự tạo */
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let p={x:100,y:0,w:45,h:55,vy:0};
let enemy={x:500,y:0,w:50,h:60,hp:100};
let running=false;
let direction=0;

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
addEventListener("resize",resize);

function startGame(){
resize();
if(running)return;
running=true;
requestAnimationFrame(loop);
}

function hit(){
if(Math.abs(p.x-enemy.x)<100){
enemy.hp-=20;
if(enemy.hp<=0){
enemy.hp=100;
enemy.x=100+Math.random()*(canvas.width-160);
}
}
}

document.getElementById("left").onpointerdown=()=>direction=-1;
document.getElementById("right").onpointerdown=()=>direction=1;
document.getElementById("left").onpointerup=()=>direction=0;
document.getElementById("right").onpointerup=()=>direction=0;

document.getElementById("jump").onclick=()=>{
if(p.y>=canvas.height-130)p.vy=-13;
};
document.getElementById("hit").onclick=hit;

function loop(){
let ground=canvas.height-130;

p.x+=direction*5;
p.vy+=0.6;
p.y+=p.vy;

if(p.y>ground){
p.y=ground;
p.vy=0;
}

p.x=Math.max(0,Math.min(canvas.width-p.w,p.x));

ctx.fillStyle="#10151d";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#293241";
ctx.fillRect(0,ground+55,canvas.width,100);

ctx.fillStyle="#42a5ff";
ctx.fillRect(p.x,p.y,p.w,p.h);

ctx.fillStyle="#ff4855";
ctx.fillRect(enemy.x,ground,enemy.w,enemy.h);

ctx.fillStyle="#333";
ctx.fillRect(enemy.x,ground-15,60,7);

ctx.fillStyle="#45e66b";
ctx.fillRect(enemy.x,ground-15,60*enemy.hp/100,7);

ctx.fillStyle="#fff";
ctx.font="16px Arial";
ctx.fillText("DDTH Game",15,75);

requestAnimationFrame(loop);
}
</script>

</body>
</html>
