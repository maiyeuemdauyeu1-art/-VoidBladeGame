<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Pro Ultimate - Customizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #090d16;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
    }
    .phone-preview {
      width: 100%;
      height: 180px;
      border-radius: 16px;
      margin: 16px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      transition: all 0.4s ease;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    /* Dynamic Phone Colors */
    .color-titanium { background: linear-gradient(135deg, #475569, #1e293b); color: #cbd5e1; border: 2px solid #94a3b8; }
    .color-cyberpunk { background: linear-gradient(135deg, #7c3aed, #db2777); color: #f472b6; border: 2px solid #ec4899; }
    .color-emerald { background: linear-gradient(135deg, #059669, #022c22); color: #6ee7b7; border: 2px solid #10b981; }

    .title { font-size: 26px; font-weight: 800; color: #fff; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
    
    .section-label { font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 700; margin: 12px 0 6px; }
    
    .options { display: flex; gap: 8px; }
    .btn-opt {
      flex: 1;
      padding: 8px;
      background: #334155;
      border: 1px solid transparent;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-opt.active { background: #0284c7; border-color: #38bdf8; font-weight: bold; }
    
    .price-box { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #334155; }
    .price { font-size: 24px; font-weight: 800; color: #4ade80; }
    .btn-buy {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">APEX PRO AI</h1>
    <p class="subtitle">Thế hệ Điện thoại Trí tuệ Nhân tạo Tự học</p>

    <!-- Visual Mockup -->
    <div id="phoneDisplay" class="phone-preview color-titanium">
      APEX 24GB AI
    </div>

    <!-- Storage Option -->
    <div class="section-label">Dung lượng bộ nhớ</div>
    <div class="options">
      <button class="btn-opt active" onclick="setStorage(512, 1699, this)">512GB</button>
      <button class="btn-opt" onclick="setStorage(1024, 1999, this)">1TB</button>
      <button class="btn-opt" onclick="setStorage(2048, 2399, this)">2TB</button>
    </div>

    <!-- Color Option -->
    <div class="section-label">Màu sắc Titanium</div>
    <div class="options">
      <button class="btn-opt active" onclick="setColor('color-titanium', this)">Xám Titan</button>
      <button class="btn-opt" onclick="setColor('color-cyberpunk', this)">Neon Neon</button>
      <button class="btn-opt" onclick="setColor('color-emerald', this)">Lục Bảo</button>
    </div>

    <!-- Checkout -->
    <div class="price-box">
      <div>
        <div style="font-size:10px; color:#94a3b8;">Giá dự kiến</div>
        <div class="price" id="priceDisplay">$1,699</div>
      </div>
      <button class="btn-buy" onclick="checkout()">Tùy chỉnh ngay</button>
    </div>
  </div>

  <script>
    let basePrice = 1699;
    
    function setStorage(size, price, el) {
      document.querySelectorAll('.options')[0].querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      basePrice = price;
      document.getElementById('priceDisplay').innerText = '$' + price.toLocaleString();
    }

    function setColor(colorClass, el) {
      document.querySelectorAll('.options')[1].querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      const phone = document.getElementById('phoneDisplay');
      phone.className = 'phone-preview ' + colorClass;
    }

    function checkout() {
      alert(`Đã lưu cấu hình APEX PRO AI với giá ${document.getElementById('priceDisplay').innerText}!`);
    }
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Pro AI - Virtual Smartphone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: #090d16;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Khung điện thoại ảo */
    .phone-container {
      width: 360px;
      height: 720px;
      background: #000;
      border-radius: 48px;
      padding: 12px;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.2), 0 25px 50px -12px rgba(0, 0, 0, 0.9);
      border: 4px solid #334155;
      position: relative;
    }

    /* Màn hình điện thoại */
    .screen {
      width: 100%;
      height: 100%;
      background: #0f172a;
      border-radius: 36px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Dynamic Island / Camera ẩn */
    .notch {
      width: 120px;
      height: 25px;
      background: #000;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
    }
    .camera-dot { width: 10px; height: 10px; background: #1e293b; border-radius: 50%; border: 1px solid #334155; }

    /* Thanh trạng thái Status Bar */
    .status-bar {
      height: 40px;
      padding: 10px 24px 0 24px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      z-index: 90;
    }

    /* Thanh địa chỉ URL (Browser Bar) */
    .browser-bar {
      padding: 8px 12px;
      background: #1e293b;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .url-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      outline: none;
    }

    .btn-go {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Quick Bookmarks */
    .quick-links {
      display: flex;
      gap: 6px;
      padding: 6px 12px;
      background: #1e293b;
      overflow-x: auto;
    }
    .chip {
      background: #334155;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:hover { background: #0284c7; color: #fff; }

    /* Khung hiển thị Trang Web (Iframe) */
    .web-viewport {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    /* Màn hình chờ khi chưa tải trang */
    .home-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);
    }

    .home-title { font-size: 20px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
    .home-desc { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }

    /* Navigation Bar phía dưới */
    .nav-bar {
      height: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    .home-indicator {
      width: 120px;
      height: 4px;
      background: #fff;
      border-radius: 2px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="screen">
      
      <!-- Dynamic Island -->
      <div class="notch">
        <div class="camera-dot"></div>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <span>09:41</span>
        <span>5G ⚡ 100%</span>
      </div>

      <!-- Thanh nhập địa chỉ Web -->
      <div class="browser-bar">
        <input type="text" id="urlInput" class="url-input" placeholder="Nhập địa chỉ URL (https://...)" value="https://wikipedia.org">
        <button class="btn-go" onclick="loadWeb()">Duyệt</button>
      </div>

      <!-- Bookmark nhanh -->
      <div class="quick-links">
        <span class="chip" onclick="openPreset('https://wikipedia.org')">Wikipedia</span>
        <span class="chip" onclick="openPreset('https://bing.com')">Bing Search</span>
        <span class="chip" onclick="openPreset('https://example.com')">Example.com</span>
      </div>

      <!-- Màn hình hiển thị Web -->
      <iframe id="webFrame" class="web-viewport" src="https://wikipedia.org" title="Virtual Browser"></iframe>

      <!-- Thanh Home Indicator -->
      <div class="nav-bar">
        <div class="home-indicator"></div>
      </div>

    </div>
  </div>

  <script>
    function loadWeb() {
      let url = document.getElementById('urlInput').value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      document.getElementById('webFrame').src = url;
    }

    function openPreset(url) {
      document.getElementById('urlInput').value = url;
      document.getElementById('webFrame').src = url;
    }
  </script>

</body>
</html>
