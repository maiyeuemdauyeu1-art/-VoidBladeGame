<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MUGEN Fighter</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:Arial;touch-action:manipulation}
        
        #selectScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0a0015,#1a0030);z-index:10;overflow-y:auto;padding:15px}
        #selectScreen.hidden{display:none}
        .title{text-align:center;color:#ffcc00;font-size:1.8em;font-weight:bold;text-shadow:0 0 20px #ffcc00;margin-bottom:3px}
        .subtitle{text-align:center;color:#aaa;font-size:0.8em;margin-bottom:10px}
        .section-title{color:#00ff88;text-align:center;font-size:1em;font-weight:bold;padding:6px;border:2px solid #00ff8833;border-radius:8px;margin:10px 0;background:#00ff8811}
        .roster{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
        .char-slot{background:#111133;border:2px solid #333366;border-radius:10px;padding:8px;text-align:center;cursor:pointer;transition:0.3s}
        .char-slot.selected{border-color:#00ff88!important;background:#003322!important;box-shadow:0 0 15px #00ff8888}
        .char-slot .portrait{font-size:2.5em;margin-bottom:5px}
        .char-slot .cname{color:#fff;font-weight:bold;font-size:0.8em}
        .char-slot .cfrom{color:#888;font-size:0.65em}
        .skin-row{display:flex;gap:3px;justify-content:center;margin-top:5px}
        .skin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #555;cursor:pointer;transition:0.3s}
        .skin-dot.active{border-color:#fff;box-shadow:0 0 8px #fff;transform:scale(1.3)}
        
        .vs-box{display:flex;align-items:center;justify-content:center;gap:15px;margin:10px 0;color:#fff;font-size:0.9em}
        .vs-box .plyr{color:#00ff88;font-weight:bold}
        .vs-box .enmy{color:#ff4444;font-weight:bold}
        .vs-text{font-size:2em;color:#ffcc00;font-weight:bold}
        
        .fight-btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#ff4400,#ffaa00);color:#fff;border:none;border-radius:25px;font-size:1.3em;font-weight:bold;cursor:pointer;letter-spacing:2px;margin-top:10px}
        .fight-btn:active{transform:scale(0.95)}
        .fight-btn:disabled{background:#444;color:#888}
        
        #gameScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:5}
        #gameScreen.hidden{display:none}
        
        #gameHUD{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:6;pointer-events:none}
        .hud-side{width:35%}
        .hud-side.right{text-align:right}
        .hud-name{color:#fff;font-weight:bold;font-size:0.8em}
        .hp-bar{height:18px;background:#333;border-radius:9px;overflow:hidden;border:1px solid #555;margin:2px 0}
        .hp-fill{height:100%;transition:0.3s}
        .hp-fill.p1{background:linear-gradient(90deg,#00ff88,#00aa44)}
        .hp-fill.p2{background:linear-gradient(90deg,#ff4444,#aa0000)}
        .pw-bar{height:8px;background:#222;border-radius:4px;overflow:hidden;border:1px solid #444}
        .pw-fill{height:100%;background:linear-gradient(90deg,#ffcc00,#ff8800);transition:0.3s}
        .hud-center{text-align:center;color:#fff}
        .hud-timer{font-size:1.5em;font-weight:bold;color:#ffcc00}
        .hud-round{font-size:0.7em;color:#aaa}
        
        canvas{display:block;width:100%;height:100%}
        
        #touchControls{position:absolute;bottom:8px;left:8px;right:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;z-index:6}
        #touchControls button{padding:10px 3px;border:2px solid #ffffff44;border-radius:8px;background:#000000aa;color:#fff;font-size:0.7em;font-weight:bold;cursor:pointer}
        #touchControls button:active{background:#ffffff44;transform:scale(0.95)}
        #touchControls .atk{border-color:#ff4444;background:#44000088}
        #touchControls .sp{border-color:#ffcc00;background:#44330088}
        
        #winOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#000000dd;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center}
        #winOverlay.hidden{display:none}
        .win-text{font-size:2.5em;font-weight:bold;margin-bottom:10px}
        .win-message{color:#ccc;font-size:0.9em;margin-bottom:15px;text-align:center}
        .win-buttons{display:flex;gap:8px}
        .win-buttons button{background:#667eea;color:#fff;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;font-size:0.9em}
    </style>
</head>
<body>

<div id="selectScreen">
    <div class="title">⚔️ ANIME MUGEN ⚔️</div>
    <div class="subtitle">Rick & Morty × Anime Universe</div>
    
    <div class="section-title">👤 CHỌN CHIẾN BINH</div>
    <div class="roster" id="playerRoster"></div>
    
    <div class="section-title">🤖 ĐỐI THỦ</div>
    <div class="roster" id="enemyRoster"></div>
    
    <div class="vs-box">
        <span>Bạn: <span class="plyr" id="pName">-</span></span>
        <span class="vs-text">VS</span>
        <span>Đối thủ: <span class="enmy" id="eName">-</span></span>
    </div>
    
    <button class="fight-btn" id="fightBtn" disabled onclick="startFight()">⚡ CHIẾN ĐẤU ⚡</button>
</div>

<div id="gameScreen" class="hidden">
    <div id="gameHUD">
        <div class="hud-side">
            <div class="hud-name" id="hudP1">P1</div>
            <div class="hp-bar"><div class="hp-fill p1" id="hp1" style="width:100%"></div></div>
            <div class="pw-bar"><div class="pw-fill" id="pw1" style="width:0%"></div></div>
        </div>
        <div class="hud-center">
            <div class="hud-timer" id="timer">99</div>
            <div class="hud-round" id="round">Round 1</div>
        </div>
        <div class="hud-side right">
            <div class="hud-name" id="hudP2">P2</div>
            <div class="hp-bar"><div class="hp-fill p2" id="hp2" style="width:100%"></div></div>
            <div class="pw-bar"><div class="pw-fill" id="pw2" style="width:0%"></div></div>
        </div>
    </div>
    <canvas id="gc"></canvas>
    <div id="touchControls">
        <button id="bL">◄</button>
        <button id="bU">▲</button>
        <button id="bR">►</button>
        <button class="atk" id="bP">👊</button>
        <button class="atk" id="bK">🦶</button>
        <button class="sp" id="bS1">💥</button>
        <button class="sp" id="bS2">⚡</button>
        <button class="sp" id="bUL" style="grid-column:span 4;">🌀 ULTIMATE</button>
    </div>
</div>

<div id="winOverlay" class="hidden">
    <div class="win-text" id="winText"></div>
    <div class="win-message" id="winMsg"></div>
    <div class="win-buttons">
        <button onclick="rematch()">🔄 TÁI ĐẤU</button>
        <button onclick="backToSelect()">👥 CHỌN LẠI</button>
    </div>
</div>

<script>
const ROSTER=[
    {id:'rick',n:'Rick Sanchez',u:'Rick & Morty',e:'🧪',sk:[{n:'Blue Trắng',b:'#87CEEB',h:'#B0C4DE',ef:'#4488ff'},{n:'Pickle Rick',b:'#4CAF50',h:'#2E7D32',ef:'#44ff44'},{n:'Evil Rick',b:'#FF4444',h:'#880000',ef:'#ff4444'}],st:{hp:1000,sp:6,jp:13},mv:{p:{n:'Portal Punch',d:80,c:0},k:{n:'Gravity Kick',d:120,c:0},s1:{n:'PORTAL GUN',d:200,c:30},s2:{n:'LASER CANNON',d:280,c:50},ul:{n:'MULTIVERSE COLLAPSE',d:500,c:100}}},
    {id:'morty',n:'Morty Smith',u:'Rick & Morty',e:'😰',sk:[{n:'Classic',b:'#FFD700',h:'#8B4513',ef:'#ffaa00'},{n:'Evil Morty',b:'#FF0000',h:'#8B0000',ef:'#ff0000'},{n:'Robot Morty',b:'#808080',h:'#C0C0C0',ef:'#cccccc'}],st:{hp:900,sp:6.5,jp:14},mv:{p:{n:'Nervous Punch',d:60,c:0},k:{n:'Panic Kick',d:100,c:0},s1:{n:'LASER PISTOL',d:180,c:25},s2:{n:'ARMOTHY STRIKE',d:250,c:45},ul:{n:'PURGE SUIT',d:450,c:100}}},
    {id:'naruto',n:'Naruto Uzumaki',u:'Naruto',e:'🍥',sk:[{n:'Classic',b:'#FF8C00',h:'#FFD700',ef:'#ff8800'},{n:'Sage Mode',b:'#FF4500',h:'#FFD700',ef:'#ff4400'},{n:'Hokage',b:'#FFFFFF',h:'#FFD700',ef:'#ffffff'}],st:{hp:1100,sp:7,jp:14},mv:{p:{n:'Uzumaki Punch',d:90,c:0},k:{n:'Konoha Kick',d:130,c:0},s1:{n:'RASENGAN!',d:220,c:30},s2:{n:'CLONE STORM',d:300,c:50},ul:{n:'RASENSHURIKEN',d:550,c:100}}},
    {id:'goku',n:'Son Goku',u:'Dragon Ball',e:'⚡',sk:[{n:'Classic',b:'#FF6600',h:'#000000',ef:'#ff6600'},{n:'Super Saiyan',b:'#FF6600',h:'#FFD700',ef:'#ffdd00'},{n:'Ultra Instinct',b:'#FF6600',h:'#C0C0C0',ef:'#ffffff'}],st:{hp:1200,sp:7.5,jp:16},mv:{p:{n:'Dragon Fist',d:100,c:0},k:{n:'Meteor Kick',d:140,c:0},s1:{n:'KAMEHAMEHA!',d:250,c:30},s2:{n:'SPIRIT BOMB',d:350,c:55},ul:{n:'ULTRA INSTINCT',d:600,c:100}}},
    {id:'saitama',n:'Saitama',u:'One Punch Man',e:'👊',sk:[{n:'Hero',b:'#FFD700',h:'#FFD700',ef:'#ffdd00'},{n:'Casual',b:'#FFFFFF',h:'#FFD700',ef:'#ffffff'},{n:'Serious',b:'#FF0000',h:'#FFD700',ef:'#ff0000'}],st:{hp:1500,sp:8,jp:15},mv:{p:{n:'Normal Punch',d:120,c:0},k:{n:'Normal Kick',d:160,c:0},s1:{n:'CONSECUTIVE PUNCH',d:280,c:30},s2:{n:'SERIOUS PUNCH',d:400,c:55},ul:{n:'ONE PUUUUNCH!',d:999,c:100}}},
    {id:'tanjiro',n:'Tanjiro',u:'Demon Slayer',e:'⚔️',sk:[{n:'Slayer',b:'#2F4F4F',h:'#8B0000',ef:'#2F4F4F'},{n:'Hinokami',b:'#2F4F4F',h:'#FF4500',ef:'#ff4500'},{n:'Demon King',b:'#4A0000',h:'#FF0000',ef:'#ff0000'}],st:{hp:1000,sp:6.5,jp:13},mv:{p:{n:'Water Slash',d:85,c:0},k:{n:'Whirlpool',d:115,c:0},s1:{n:'HINOKAMI KAGURA',d:210,c:30},s2:{n:'SUN BREATHING',d:290,c:50},ul:{n:'13TH FORM',d:520,c:100}}}
];

let pI=null,pS=0,eI=null,eS=0;
let p1,p2,run=false,timer=99,rnd=1,pw=0,ew=0;
let pEn=0,eEn=0,pts=[],fxs=[],sh=0,keys={},tid=null;
const cv=document.getElementById('gc'),cx=cv.getContext('2d');

// BUILD SELECT
function buildSelect(){
    const pr=document.getElementById('playerRoster'),er=document.getElementById('enemyRoster');
    pr.innerHTML='';er.innerHTML='';
    ROSTER.forEach((c,i)=>{
        const slot=(t)=>{
            const d=document.createElement('div');d.className='char-slot';d.id=t+'-'+i;
            d.innerHTML=`<div class="portrait">${c.e}</div><div class="cname">${c.n}</div><div class="cfrom">${c.u}</div><div class="skin-row">${c.sk.map((s,si)=>`<div class="skin-dot" style="background:${s.b}" id="sk-${t}-${i}-${si}"></div>`).join('')}</div>`;
            d.addEventListener('click',(e)=>{
                if(e.target.classList.contains('skin-dot')){e.stopPropagation();const si=+e.target.id.split('-')[3];if(t==='p'&&pI===i)pS=si;if(t==='e'&&eI===i)eS=si;upd();return}
                if(t==='p'){pI=i;pS=0}else{eI=i;eS=0}upd();
            });
            return d;
        };
        pr.appendChild(slot('p'));er.appendChild(slot('e'));
    });
}

function upd(){
    document.querySelectorAll('.char-slot').forEach(s=>s.classList.remove('selected'));
    if(pI!=null)document.getElementById('p-'+pI).classList.add('selected');
    if(eI!=null)document.getElementById('e-'+eI).classList.add('selected');
    document.querySelectorAll('.skin-dot').forEach(s=>s.classList.remove('active'));
    if(pI!=null)document.getElementById('sk-p-'+pI+'-'+pS).classList.add('active');
    if(eI!=null)document.getElementById('sk-e-'+eI+'-'+eS).classList.add('active');
    document.getElementById('pName').textContent=pI!=null?ROSTER[pI].n:'-';
    document.getElementById('eName').textContent=eI!=null?ROSTER[eI].n:'-';
    document.getElementById('fightBtn').disabled=(pI==null||eI==null);
}

// RESIZE
function rsz(){cv.width=window.innerWidth;cv.height=window.innerHeight}

// START
function startFight(){
    if(pI==null||eI==null)return;
    document.getElementById('selectScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    document.getElementById('winOverlay').classList.add('hidden');
    rsz();newRound();run=true;timer=99;rnd=1;pw=0;ew=0;
    document.getElementById('hudP1').textContent=ROSTER[pI].n;
    document.getElementById('hudP2').textContent=ROSTER[eI].n;
    document.getElementById('timer').textContent=timer;
    document.getElementById('round').textContent='Round 1';
    if(tid)clearInterval(tid);
    tid=setInterval(()=>{if(run){timer--;document.getElementById('timer').textContent=timer;if(timer<=0)end('time')}},1000);
    loop();
}

function newRound(){
    const pc=ROSTER[pI],ec=ROSTER[eI],ps=pc.sk[pS],es=ec.sk[eS];
    const gy=cv.height*0.78;
    pEn=0;eEn=0;p1={x:cv.width*0.2,y:gy-90,w:50,h:80,vx:0,vy:0,hp:pc.st.hp,mhp:pc.st.hp,b:ps.b,h:ps.h,ef:ps.ef,sp:pc.st.sp,jp:pc.st.jp,face:1,atk:false,cd:0,mv:pc.mv};
    p2={x:cv.width*0.7,y:gy-90,w:50,h:80,vx:0,vy:0,hp:ec.st.hp,mhp:ec.st.hp,b:es.b,h:es.h,ef:es.ef,sp:ec.st.sp,jp:ec.st.jp,face:-1,atk:false,cd:0,mv:ec.mv};
    pts=[];fxs=[];sh=0;
}

function updHUD(){
    document.getElementById('hp1').style.width=Math.max(0,p1.hp/p1.mhp*100)+'%';
    document.getElementById('hp2').style.width=Math.max(0,p2.hp/p2.mhp*100)+'%';
    document.getElementById('pw1').style.width=pEn+'%';
    document.getElementById('pw2').style.width=eEn+'%';
}

// INPUT
['bL','bU','bR','bP','bK','bS1','bS2','bUL'].forEach(id=>{
    const b=document.getElementById(id);if(!b)return;
    b.addEventListener('touchstart',e=>{e.preventDefault();keys[id]=true});
    b.addEventListener('touchend',e=>{keys[id]=false});
    b.addEventListener('mousedown',e=>{keys[id]=true});
    b.addEventListener('mouseup',e=>{keys[id]=false});
});
document.addEventListener('keydown',e=>{
    if(e.key==='a')keys['bL']=true;if(e.key==='d')keys['bR']=true;if(e.key==='w')keys['bU']=true;
    if(e.key==='j')keys['bP']=true;if(e.key==='k')keys['bK']=true;
    if(e.key==='u')keys['bS1']=true;if(e.key==='i')keys['bS2']=true;if(e.key==='o')keys['bUL']=true;
});
document.addEventListener('keyup',e=>{
    if(e.key==='a')keys['bL']=false;if(e.key==='d')keys['bR']=false;if(e.key==='w')keys['bU']=false;
    if(e.key==='j')keys['bP']=false;if(e.key==='k')keys['bK']=false;
    if(e.key==='u')keys['bS1']=false;if(e.key==='i')keys['bS2']=false;if(e.key==='o')keys['bUL']=false;
});

// SKILL
function sk(a,d,k,pl){
    if(a.atk||a.cd>0)return;
    const mv=a.mv[k],en=pl?pEn:eEn;
    if(en<mv.c)return;
    const dist=Math.abs(a.x-d.x),rng=(k==='s2'||k==='ul')?250:90;
    if(dist>rng||a.face!==(d.x>a.x?1:-1))return;
    if(pl)pEn-=mv.c;else eEn-=mv.c;
    d.hp-=mv.d;d.vy=-(k==='ul'?18:10);d.vx=d.face*-(k==='ul'?10:6);
    a.atk=true;a.cd=(k==='ul'?45:20);
    sh=(k==='ul'?20:k==='s2'?10:4);
    fxs.push({x:d.x+25,y:d.y-20,t:mv.n+' -'+mv.d,l:40,c:k==='ul'?'#ff0':'#fff',s:k==='ul'?16:12});
    const n=k==='ul'?40:k==='s2'?20:8;
    for(let i=0;i<n;i++)pts.push({x:d.x+25,y:d.y+40,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,l:25+Math.random()*20,c:a.ef});
    updHUD();if(d.hp<=0){d.hp=0;updHUD();end(pl?'p1':'p2')}
}

function end(w){
    run=false;
    if(w==='p1')pw++;else if(w==='p2')ew++;
    if(pw>=2||ew>=2){
        if(tid)clearInterval(tid);
        document.getElementById('winOverlay').classList.remove('hidden');
        document.getElementById('winText').textContent=pw>=2?'🏆 CHIẾN THẮNG!':'💀 THẤT BẠI';
        document.getElementById('winText').style.color=pw>=2?'#00ff88':'#ff4444';
        document.getElementById('winMsg').textContent=pw>=2?ROSTER[pI].n+' thắng!':ROSTER[eI].n+' thắng!';
    }else{setTimeout(()=>{timer=99;newRound();run=true;rnd++;updHUD();document.getElementById('timer').textContent=timer;document.getElementById('round').textContent='Round '+rnd},2000)}
}

function rematch(){
    document.getElementById('winOverlay').classList.add('hidden');
    timer=99;rnd=1;pw=0;ew=0;newRound();run=true;updHUD();
    document.getElementById('timer').textContent=timer;document.getElementById('round').textContent='Round 1';
    if(tid)clearInterval(tid);
    tid=setInterval(()=>{if(run){timer--;document.getElementById('timer').textContent=timer;if(timer<=0)end('time')}},1000);
    loop();
}

function backToSelect(){
    document.getElementById('winOverlay').classList.add('hidden');
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('selectScreen').classList.remove('hidden');
    if(tid)clearInterval(tid);run=false;
}

// AI
function ai(){
    if(!run||p2.atk||p2.cd>0)return;
    const dx=p1.x-p2.x,ad=Math.abs(dx),gy=cv.height*0.78;
    if(ad>200)p2.vx=dx>0?p2.sp*0.5:-p2.sp*0.5;
    else if(ad<70){p2.vx=dx>0?-p2.sp*0.5:p2.sp*0.5;if(Math.random()<0.03){if(eEn>=100)sk(p2,p1,'ul',false);else if(eEn>=50)sk(p2,p1,'s2',false);else if(eEn>=30)sk(p2,p1,'s1',false);else sk(p2,p1,Math.random()<0.5?'p':'k',false)}}
    else{p2.vx*=0.9;if(Math.random()<0.02){if(eEn>=30)sk(p2,p1,'s1',false);else sk(p2,p1,Math.random()<0.5?'p':'k',false)}}
    if(p1.y<p2.y-40&&p2.y>=gy-p2.h&&Math.random()<0.03){p2.vy=-p2.jp}
}

// LOOP
function loop(){
    if(!run){requestAnimationFrame(loop);return}
    const gy=cv.height*0.78;
    p1.vx=0;
    if(keys['bL'])p1.vx=-p1.sp;if(keys['bR'])p1.vx=p1.sp;
    if(keys['bU']&&p1.y>=gy-p1.h){p1.vy=-p1.jp}
    if(keys['bP'])sk(p1,p2,'p',true);if(keys['bK'])sk(p1,p2,'k',true);
    if(keys['bS1'])sk(p1,p2,'s1',true);if(keys['bS2'])sk(p1,p2,'s2',true);if(keys['bUL'])sk(p1,p2,'ul',true);

    [p1,p2].forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.7;if(p.y>=gy-p.h){p.y=gy-p.h;p.vy=0}if(p.x<0)p.x=0;if(p.x>cv.width-p.w)p.x=cv.width-p.w;if(p.cd>0)p.cd--;if(p.cd===0)p.atk=false});
    pEn=Math.min(100,pEn+0.1);eEn=Math.min(100,eEn+0.1);
    p1.face=p1.x<p2.x?1:-1;p2.face=p2.x<p1.x?1:-1;
    ai();
    pts=pts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.l--;return p.l>0});
    fxs=fxs.filter(f=>{f.l--;return f.l>0});
    if(sh>0)sh--;

    const sx=sh?(Math.random()-.5)*sh:0,sy=sh?(Math.random()-.5)*sh:0;
    cx.save();cx.translate(sx,sy);
    cx.clearRect(0,0,cv.width,cv.height);
    cx.fillStyle='#1a1a2e';cx.fillRect(0,0,cv.width,gy);
    cx.fillStyle='#333';cx.fillRect(0,gy,cv.width,cv.height-gy);
    [{p:p1},{p:p2}].forEach(({p})=>{
        cx.fillStyle=p.b;cx.fillRect(p.x,p.y,p.w,p.h);
        cx.fillStyle=p.h;cx.beginPath();cx.arc(p.x+p.w/2,p.y-15,16,0,Math.PI*2);cx.fill();
        cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x+p.w/2-5,p.y-19,4,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(p.x+p.w/2+5,p.y-19,4,0,Math.PI*2);cx.fill();
        cx.fillStyle='#000';cx.beginPath();cx.arc(p.x+p.w/2-5+p.face*2,p.y-19,2,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(p.x+p.w/2+5+p.face*2,p.y-19,2,0,Math.PI*2);cx.fill();
        if(p.atk){cx.fillStyle='#ff0';cx.fillRect(p.x+p.face*p.w,p.y+p.h/2-5,25,10)}
    });
    pts.forEach(p=>{cx.fillStyle=p.c;cx.globalAlpha=p.l/40;cx.beginPath();cx.arc(p.x,p.y,3,0,Math.PI*2);cx.fill()});cx.globalAlpha=1;
    fxs.forEach(f=>{cx.fillStyle=f.c;cx.globalAlpha=f.l/40;cx.font='bold '+f.s+'px Arial';cx.fillText(f.t,f.x,f.y)});cx.globalAlpha=1;
    cx.restore();
    updHUD();
    requestAnimationFrame(loop);
}

buildSelect();rsz();loop();
</script>
