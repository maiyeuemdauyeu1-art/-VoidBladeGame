<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô phỏng iOS Interactive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }
    
    /* Khung iPhone */
    #phone {
      width: 360px;
      height: 740px;
      background: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000') center/cover;
      border-radius: 50px;
      border: 12px solid #2d2d2d;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Tai thỏ & Thanh trạng thái */
    .notch {
      width: 130px;
      height: 28px;
      background: #000;
      margin: 0 auto;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }
    .status-bar {
      position: absolute;
      top: 6px; width: 100%;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      z-index: 90;
    }

    /* Màn hình chính */
    .home-screen {
      padding-top: 60px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 20px;
    }
    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .app-icon {
      width: 58px;
      height: 58px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(15px);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    .app-icon:active { transform: scale(0.9); }
    .app-name {
      color: #fff;
      font-size: 11px;
      margin-top: 5px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* Dock bên dưới */
    .dock {
      margin: 20px 15px;
      height: 78px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
    }

    /* Cửa sổ ứng dụng (Modal) */
    .app-window {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #fff;
      z-index: 80;
      display: none;
      flex-direction: column;
      padding-top: 40px;
      animation: openApp 0.3s ease-out forwards;
    }
    .app-window.active { display: flex; }

    @keyframes openApp {
      from { transform: scale(0.7); opacity: 0; border-radius: 40px; }
      to { transform: scale(1); opacity: 1; border-radius: 0; }
    }

    /* Thanh Gạch Home dưới cùng */
    .home-bar {
      position: absolute;
      bottom: 8px; left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 5px;
      background: #fff;
      border-radius: 10px;
      z-index: 200;
      cursor: pointer;
    }

    /* Giao diện từng App */
    /* 1. Calculator */
    .calc-screen {
      background: #000; height: 100%; color: #fff;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
    }
    .calc-display { font-size: 48px; text-align: right; margin-bottom: 20px; }
    .calc-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .calc-btn {
      height: 60px; border-radius: 50%; border: none; font-size: 20px; color: #fff;
      background: #333; cursor: pointer;
    }
    .calc-btn.orange { background: #ff9f0a; }
    .calc-btn.gray { background: #a5a5a5; color: #000; }

    /* 2. Safari */
    .safari-body { height: 100%; display: flex; flex-direction: column; }
    .safari-bar { padding: 10px; background: #f1f1f1; display: flex; gap: 5px; }
    .safari-bar input {
      flex: 1; padding: 8px 12px; border-radius: 10px; border: 1px solid #ccc; outline: none;
    }
    .safari-content { flex: 1; border: none; }

    /* 3. Settings */
    .settings-list { padding: 20px; background: #f2f2f7; height: 100%; }
    .settings-item {
      background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 10px;
      display: flex; justify-content: space-between; font-weight: 500;
    }
  </style>
</head>
<body>

  <div id="phone">
    <div class="notch"></div>
    <div class="status-bar">
      <span id="clock">09:41</span>
      <span>📶 🔋</span>
    </div>

    <!-- Màn hình chính -->
    <div class="home-screen">
      <div class="grid">
        <div class="app-item" onclick="openApp('calculator')">
          <div class="app-icon" style="background:#ff9f0a">🧮</div>
          <span class="app-name">Máy tính</span>
        </div>
        <div class="app-item" onclick="openApp('safari')">
          <div class="app-icon" style="background:#007aff">🌐</div>
          <span class="app-name">Safari</span>
        </div>
        <div class="app-item" onclick="openApp('settings')">
          <div class="app-icon" style="background:#8e8e93">⚙️</div>
          <span class="app-name">Cài đặt</span>
        </div>
        <div class="app-item" onclick="openApp('camera')">
          <div class="app-icon" style="background:#34c759">📷</div>
          <span class="app-name">Camera</span>
        </div>
      </div>

      <div class="dock">
        <div class="app-icon">📞</div>
        <div class="app-icon">💬</div>
        <div class="app-icon">✉️</div>
        <div class="app-icon">🎵</div>
      </div>
    </div>

    <!-- Cửa sổ App: Máy tính -->
    <div id="app-calculator" class="app-window">
      <div class="calc-screen">
        <div class="calc-display" id="calc-val">0</div>
        <div class="calc-btns">
          <button class="calc-btn gray" onclick="calcReset()">C</button>
          <button class="calc-btn gray">±</button>
          <button class="calc-btn gray">%</button>
          <button class="calc-btn orange">÷</button>
          <button class="calc-btn" onclick="calcNum('7')">7</button>
          <button class="calc-btn" onclick="calcNum('8')">8</button>
          <button class="calc-btn" onclick="calcNum('9')">9</button>
          <button class="calc-btn orange">×</button>
          <button class="calc-btn" onclick="calcNum('4')">4</button>
          <button class="calc-btn" onclick="calcNum('5')">5</button>
          <button class="calc-btn" onclick="calcNum('6')">6</button>
          <button class="calc-btn orange">-</button>
          <button class="calc-btn" onclick="calcNum('1')">1</button>
          <button class="calc-btn" onclick="calcNum('2')">2</button>
          <button class="calc-btn" onclick="calcNum('3')">3</button>
          <button class="calc-btn orange">+</button>
        </div>
      </div>
    </div>

    <!-- Cửa sổ App: Safari -->
    <div id="app-safari" class="app-window">
      <div class="safari-body">
        <div class="safari-bar">
          <input type="text" id="web-url" value="https://bing.com" placeholder="Nhập địa chỉ web...">
          <button onclick="loadWeb()" style="padding:0 10px; border-radius:8px;">Đi</button>
        </div>
        <iframe id="web-frame" class="safari-content" src="https://bing.com"></iframe>
      </div>
    </div>

    <!-- Cửa sổ App: Cài đặt -->
    <div id="app-settings" class="app-window">
      <div class="settings-list">
        <h2>Cài đặt</h2><br>
        <div class="settings-item"><span>Wi-Fi</span><span>Bật 🔵</span></div>
        <div class="settings-item"><span>Bluetooth</span><span>Tắt ⚪</span></div>
        <div class="settings-item"><span>Chế độ máy bay</span><span>OFF</span></div>
        <div class="settings-item"><span>Dung lượng</span><span>128 GB</span></div>
      </div>
    </div>

    <!-- Cửa sổ App: Camera -->
    <div id="app-camera" class="app-window" style="background:#000;">
      <video id="webcam" autoplay playsinline style="width:100%; height:80%; object-fit:cover; margin-top:auto;"></video>
    </div>

    <!-- Thanh gạch Home (Nhấn để thoát app về Màn hình chính) -->
    <div class="home-bar" onclick="closeAllApps()"></div>
  </div>

  <script>
    // Đồng hồ thời gian thực
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Mở và Đóng App
    function openApp(appName) {
      closeAllApps();
      const appWin = document.getElementById(`app-${appName}`);
      if (appWin) {
        appWin.classList.add('active');
        if(appName === 'camera') startCamera();
      }
    }

    function closeAllApps() {
      document.querySelectorAll('.app-window').forEach(win => win.classList.remove('active'));
      stopCamera();
    }

    // Logic Máy tính đơn giản
    let calcVal = '0';
    function calcNum(num) {
      calcVal = calcVal === '0' ? num : calcVal + num;
      document.getElementById('calc-val').innerText = calcVal;
    }
    function calcReset() {
      calcVal = '0';
      document.getElementById('calc-val').innerText = calcVal;
    }

    // Logic Safari
    function loadWeb() {
      let url = document.getElementById('web-url').value;
      if (!url.startsWith('http')) url = 'https://' + url;
      document.getElementById('web-frame').src = url;
    }

    // Logic Camera
    let streamRef = null;
    async function startCamera() {
      try {
        streamRef = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('webcam').srcObject = streamRef;
      } catch (err) {
        alert("Không thể truy cập Camera hoặc trình duyệt chặn quyền.");
      }
    }
    function stopCamera() {
      if (streamRef) {
        streamRef.getTracks().forEach(track => track.stop());
        streamRef = null;
      }
    }
  </script>
</body>
</html>
