<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>AndzOS Browser</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;
    background:#eef4ff;
}

.browser{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#fff;
}

/* THANH TRÊN */

.top{
    height:72px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 18px;
    background:#f5f5f7;
    border-bottom:1px solid #ddd;
}

.navBtn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:transparent;
    font-size:27px;
    color:#777;
}

.navBtn:active{
    background:#ddd;
}

.address{
    flex:1;
    height:48px;
    border:0;
    outline:none;
    border-radius:25px;
    background:#e8e8ed;
    padding:0 20px;
    font-size:17px;
    text-align:center;
}

.go{
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#007aff;
    color:white;
    font-size:20px;
}

/* TRANG CHỦ */

.home{
    flex:1;
    overflow:auto;
    background:#edf4ff;
    text-align:center;
    padding-top:80px;
}

.googleLogo{
    font-size:58px;
    font-weight:700;
    letter-spacing:-4px;
    margin-bottom:35px;
}

.searchBox{
    width:min(720px,85%);
    height:62px;
    margin:auto;
    display:flex;
    align-items:center;
    background:white;
    border-radius:32px;
    padding:0 22px;
    box-shadow:0 3px 15px #0001;
}

.searchIcon{
    font-size:25px;
    margin-right:14px;
}

.homeSearch{
    flex:1;
    border:0;
    outline:none;
    font-size:20px;
    background:transparent;
}

.homeSearchBtn{
    border:0;
    background:transparent;
    font-size:25px;
}

/* TRANG WEB */

.webPage{
    flex:1;
    display:none;
    background:white;
    position:relative;
}

.webFrame{
    width:100%;
    height:100%;
    border:0;
    background:white;
}

/* MÀN HÌNH LỖI */

.error{
    display:none;
    position:absolute;
    inset:0;
    background:white;
    text-align:center;
    padding:80px 25px;
}

.error h2{
    font-size:28px;
}

.error p{
    color:#777;
}

.openReal{
    border:0;
    background:#007aff;
    color:white;
    padding:14px 22px;
    border-radius:14px;
    font-size:17px;
}

/* TẢI FILE */

.downloadArea{
    display:none;
    position:absolute;
    left:20px;
    right:20px;
    bottom:25px;
    background:white;
    border-radius:20px;
    padding:18px;
    box-shadow:0 5px 30px #0003;
}

.downloadArea button{
    width:100%;
    border:0;
    background:#007aff;
    color:white;
    padding:14px;
    border-radius:13px;
    font-size:17px;
}

/* MOBILE */

@media(max-width:700px){

    .top{
        height:62px;
        padding:7px;
    }

    .navBtn{
        width:38px;
        height:38px;
        font-size:22px;
    }

    .address{
        height:42px;
        font-size:14px;
    }

    .go{
        width:42px;
        height:42px;
    }

    .home{
        padding-top:60px;
    }

    .googleLogo{
        font-size:45px;
    }

    .searchBox{
        height:55px;
    }

    .homeSearch{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="browser">

    <!-- THANH ĐỊA CHỈ -->

    <div class="top">

        <button class="navBtn" onclick="goBack()">‹</button>

        <button class="navBtn" onclick="goForward()">›</button>

        <button class="navBtn" onclick="reloadPage()">↻</button>

        <input
            id="address"
            class="address"
            type="text"
            placeholder="Tìm trên Google hoặc nhập URL"
            autocomplete="off"
            spellcheck="false"
            onkeydown="addressEnter(event)"
        >

        <button class="go" onclick="navigate()">➜</button>

    </div>


    <!-- TRANG CHỦ -->

    <div id="home" class="home">

        <div class="googleLogo">
            <span style="color:#4285f4">G</span>
            <span style="color:#ea4335">o</span>
            <span style="color:#fbbc05">o</span>
            <span style="color:#4285f4">g</span>
            <span style="color:#34a853">l</span>
            <span style="color:#ea4335">e</span>
        </div>

        <div class="searchBox">

            <span class="searchIcon">⌕</span>

            <input
                id="homeSearch"
                class="homeSearch"
                type="search"
                placeholder="Tìm trên Google hoặc nhập URL"
                onkeydown="homeEnter(event)"
            >

            <button
                class="homeSearchBtn"
                onclick="homeSearch()">
                🔍
            </button>

        </div>

    </div>


    <!-- TRANG WEB -->

    <div id="webPage" class="webPage">

        <iframe
            id="webFrame"
            class="webFrame"
            allow="fullscreen; autoplay"
        ></iframe>


        <div id="error" class="error">

            <h2>Không thể hiển thị trang này</h2>

            <p>
                Website có thể chặn việc nhúng trong iframe.
            </p>

            <button
                class="openReal"
                onclick="openRealWebsite()">
                Mở website thật
            </button>

        </div>


        <div id="downloadArea" class="downloadArea">

            <b>📦 File có thể tải xuống</b>

            <br><br>

            <button onclick="downloadCurrent()">
                ⬇️ Tải file
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   BIẾN
========================= */

let currentURL = "";
let historyList = [];
let historyIndex = -1;


/* =========================
   CHUẨN HÓA URL
========================= */

function makeURL(text){

    text = text.trim();

    if(!text){
        return null;
    }

    /*
       Nếu người dùng nhập URL
       thì mở trực tiếp.
    */

    if(
        text.startsWith("http://") ||
        text.startsWith("https://")
    ){
        return text;
    }

    /*
       Nếu giống domain
       */

    if(
        text.includes(".") &&
        !text.includes(" ")
    ){
        return "https://" + text;
    }

    /*
       Còn lại -> Google
       */

    return "https://www.google.com/search?q="
        + encodeURIComponent(text);
}


/* =========================
   TÌM KIẾM
========================= */

function homeSearch(){

    let text =
        document.getElementById("homeSearch").value;

    navigateTo(text);
}


function homeEnter(event){

    if(event.key === "Enter"){
        homeSearch();
    }
}


function addressEnter(event){

    if(event.key === "Enter"){
        navigate();
    }
}


/* =========================
   THANH ĐỊA CHỈ
========================= */

function navigate(){

    let text =
        document.getElementById("address").value;

    navigateTo(text);
}


/* =========================
   MỞ WEB
========================= */

function navigateTo(text){

    let url = makeURL(text);

    if(!url){
        return;
    }

    currentURL = url;

    /*
       Lưu lịch sử
    */

    historyList =
        historyList.slice(0,historyIndex + 1);

    historyList.push(url);

    historyIndex =
        historyList.length - 1;

    document.getElementById("address").value = url;

    document.getElementById("home").style.display =
        "none";

    document.getElementById("webPage").style.display =
        "block";

    document.getElementById("error").style.display =
        "none";

    document.getElementById("downloadArea").style.display =
        "none";

    let frame =
        document.getElementById("webFrame");

    frame.src = url;

    /*
       Một số trang chặn iframe.
       Sau thời gian chờ sẽ hiện nút
       mở website thật.
    */

    setTimeout(function(){

        document.getElementById("error").style.display =
            "block";

    },3500);
}


/* =========================
   MỞ WEBSITE THẬT
========================= */

function openRealWebsite(){

    if(!currentURL){
        return;
    }

    window.open(
        currentURL,
        "_blank"
    );
}


/* =========================
   QUAY LẠI
========================= */

function goBack(){

    if(historyIndex > 0){

        historyIndex--;

        let url =
            historyList[historyIndex];

        currentURL = url;

        document.getElementById("address").value =
            url;

        document.getElementById("webFrame").src =
            url;
    }
}


/* =========================
   TIẾN
========================= */

function goForward(){

    if(
        historyIndex <
        historyList.length - 1
    ){

        historyIndex++;

        let url =
            historyList[historyIndex];

        currentURL = url;

        document.getElementById("address").value =
            url;

        document.getElementById("webFrame").src =
            url;
    }
}


/* =========================
   RELOAD
========================= */

function reloadPage(){

    if(!currentURL){
        return;
    }

    document.getElementById("webFrame").src =
        currentURL;
}


/* =========================
   TẢI FILE
========================= */

function downloadFile(url,filename){

    const a =
        document.createElement("a");

    a.href = url;

    a.download = filename || "";

    document.body.appendChild(a);

    a.click();

    a.remove();
}


/*
   Nếu đang mở trực tiếp file APK,
   trình duyệt sẽ yêu cầu tải file
   thay vì chạy nó.
*/

function downloadCurrent(){

    if(!currentURL){
        return;
    }

    let filename =
        currentURL.split("/").pop();

    if(!filename){
        filename = "download";
    }

    downloadFile(
        currentURL,
        filename
    );
}


/* =========================
   NHẬN FILE APK TỪ URL
========================= */

function downloadAPK(url){

    if(!url){
        return;
    }

    if(
        !url.toLowerCase().includes(".apk")
    ){

        alert(
            "URL này không phải file APK trực tiếp."
        );

        return;
    }

    downloadFile(
        url,
        "application.apk"
    );
}


/* =========================
   PHÍM TẮT
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "/" &&
            document.activeElement.tagName !== "INPUT"
        ){

            event.preventDefault();

            document
                .getElementById("address")
                .focus();
        }

        if(
            event.key === "Escape"
        ){

            document
                .getElementById("home")
                .style.display = "block";

            document
                .getElementById("webPage")
                .style.display = "none";
        }

    }
);

</script>

</body>
</html>
