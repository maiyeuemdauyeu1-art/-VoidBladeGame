<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rick & Morty Fighter</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; display:flex; justify-content:center; align-items:center; height:100vh; touch-action:manipulation; }
        #game { width:400px; height:600px; position:relative; overflow:hidden; }
        canvas { display:block; background:#1a1a3a; }
        #ui { position:absolute; top:0; left:0; width:100%; padding:10px; color:#fff; display:flex; justify-content:space-between; font-size:12px; pointer-events:none; }
        #ui .hp-bar { width:150px; height:15px; background:#333; border-radius:7px; overflow:hidden; }
        #ui .hp-fill { height:100%; transition:0.3s; }
        #ui .p1-hp { background:#0f0; } #ui .p2-hp { background:#f44; }
        #controls { position:absolute; bottom:10px; left:0; width:100%; display:flex; justify-content:space-between; padding:0 10px; }
        #controls button { width:70px; height:70px; border-radius:50%; border:3px solid #fff; background:rgba(255,255,255,0.2); color:#fff; font-weight:bold; font-size:14px; cursor:pointer; }
        #controls button:active { background:rgba(255,255,255,0.5); }
        #dpad { display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; }
        #dpad button { width:50px; height:50px; font-size:20px; }
    </style>
</head>
<body>

<div id="game">
    <canvas id="gc" width="400" height="600"></canvas>
    
    <div id="ui">
        <div>
            <div id="p1name">RICK</div>
            <div class="hp-bar"><div class="hp-fill p1-hp" id="p1hp" style="width:100%"></div></div>
        </div>
        <div style="text-align:right">
            <div id="p2name">ENEMY</div>
            <div class="hp-bar"><div class="hp-fill p2-hp" id="p2hp" style="width:100%"></div></div>
        </div>
    </div>

    <div id="controls">
        <div id="dpad">
            <div></div><button>▲</button><div></div>
            <button>◄</button><div></div><button>►</button>
            <div></div><button>▼</button><div></div>
        </div>
        <button style="background:rgba(255,0,0,0.3)">👊</button>
        <button style="background:rgba(255,255,0,0.3)">💥</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

// Characters
const rick = {
    name: 'Rick Sanchez',
    x: 100, y: 400, w: 40, h: 80,
    hp: 100, maxHp: 100,
    vx: 0, vy: 0,
    color: '#87CEEB',
    hairColor: '#B0C4DE',
    facing: 1,
    attacking: false,
    attackCooldown: 0
};

const enemy = {
    name: 'Evil Morty',
    x: 260, y: 400, w: 35, h: 70,
    hp: 100, maxHp: 100,
    vx: 0, vy: 0,
    color: '#FFD700',
    hairColor: '#8B4513',
    facing: -1,
    attacking: false,
    attackCooldown: 0
};

const GROUND = 480;
const GRAVITY = 0.8;

// Input
const keys = {};

// Control buttons
document.querySelectorAll('#dpad button').forEach((btn, i) => {
    const dirs = ['up', 'left', 'down', 'right'];
    if (i === 0) { // up
        btn.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowUp'] = true; });
        btn.addEventListener('touchend', e => { keys['ArrowUp'] = false; });
    } else if (i === 1) { // left
        btn.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft'] = true; });
        btn.addEventListener('touchend', e => { keys['ArrowLeft'] = false; });
    } else if (i === 2) { // down
        btn.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowDown'] = true; });
        btn.addEventListener('touchend', e => { keys['ArrowDown'] = false; });
    } else if (i === 3) { // right
        btn.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight'] = true; });
        btn.addEventListener('touchend', e => { keys['ArrowRight'] = false; });
    }
});

// Punch button
const punchBtn = document.querySelectorAll('#controls button')[4];
punchBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!rick.attacking) {
        rick.attacking = true;
        rick.attackCooldown = 15;
        // Check hit
        const dist = Math.abs(rick.x - enemy.x);
        if (dist < 60 && rick.facing === (enemy.x > rick.x ? 1 : -1)) {
            enemy.hp -= 10;
            enemy.vy = -8;
            enemy.vx = enemy.facing * -5;
            updateHP();
        }
    }
});

// Special button
const specialBtn = document.querySelectorAll('#controls button')[5];
specialBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!rick.attacking) {
        rick.attacking = true;
        rick.attackCooldown = 25;
        const dist = Math.abs(rick.x - enemy.x);
        if (dist < 100 && rick.facing === (enemy.x > rick.x ? 1 : -1)) {
            enemy.hp -= 25;
            enemy.vy = -12;
            enemy.vx = enemy.facing * -8;
            updateHP();
        }
    }
});

// Keyboard controls
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

function updateHP() {
    document.getElementById('p1hp').style.width = Math.max(0, rick.hp/rick.maxHp*100) + '%';
    document.getElementById('p2hp').style.width = Math.max(0, enemy.hp/enemy.maxHp*100) + '%';
}

function drawCharacter(char, isRick = true) {
    // Body
    ctx.fillStyle = char.color;
    ctx.fillRect(char.x, char.y, char.w, char.h);
    
    // Head
    ctx.fillStyle = char.hairColor;
    ctx.beginPath();
    ctx.arc(char.x + char.w/2, char.y - 20, 20, 0, Math.PI*2);
    ctx.fill();
    
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(char.x + char.w/2 - 6, char.y - 25, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(char.x + char.w/2 + 6, char.y - 25, 5, 0, Math.PI*2);
    ctx.fill();
    
    // Pupils
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(char.x + char.w/2 - 6 + char.facing*2, char.y - 25, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(char.x + char.w/2 + 6 + char.facing*2, char.y - 25, 2.5, 0, Math.PI*2);
    ctx.fill();
    
    // Attack effect
    if (char.attacking) {
        ctx.fillStyle = isRick ? '#00ff88' : '#ff4444';
        ctx.fillRect(char.x + char.facing*char.w, char.y + char.h/2 - 10, 30, 20);
    }
    
    // Name tag
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(char.name, char.x + char.w/2, char.y - 40);
}

function draw() {
    ctx.clearRect(0, 0, 400, 600);
    
    // Background
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(0, 0, 400, GROUND);
    ctx.fillStyle = '#333';
    ctx.fillRect(0, GROUND, 400, 120);
    ctx.strokeStyle = '#555';
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    ctx.lineTo(400, GROUND);
    ctx.stroke();
    
    drawCharacter(enemy, false);
    drawCharacter(rick, true);
}

function update() {
    // Rick movement
    rick.vx = 0;
    if (keys['ArrowLeft']) rick.vx = -5;
    if (keys['ArrowRight']) rick.vx = 5;
    if (keys['ArrowUp'] && rick.y >= GROUND - rick.h) {
        rick.vy = -15;
    }
    
    // Apply physics
    rick.x += rick.vx;
    rick.y += rick.vy;
    rick.vy += GRAVITY;
    
    if (rick.y >= GROUND - rick.h) {
        rick.y = GROUND - rick.h;
        rick.vy = 0;
    }
    
    // Attack cooldown
    if (rick.attackCooldown > 0) {
        rick.attackCooldown--;
        if (rick.attackCooldown === 0) rick.attacking = false;
    }
    
    // Simple AI for enemy
    const dist = rick.x - enemy.x;
    if (Math.abs(dist) > 150) {
        enemy.vx = dist > 0 ? 2 : -2;
    } else if (Math.abs(dist) < 50) {
        enemy.vx = dist > 0 ? -3 : 3;
        // Random attack
        if (Math.random() < 0.02 && !enemy.attacking) {
            enemy.attacking = true;
            enemy.attackCooldown = 20;
            if (Math.abs(dist) < 70) {
                rick.hp -= 8;
                rick.vy = -6;
                rick.vx = rick.facing * -4;
                updateHP();
            }
        }
    } else {
        enemy.vx *= 0.9;
    }
    
    enemy.x += enemy.vx;
    enemy.y += enemy.vy;
    enemy.vy += GRAVITY;
    
    if (enemy.y >= GROUND - enemy.h) {
        enemy.y = GROUND - enemy.h;
        enemy.vy = 0;
    }
    
    if (enemy.attackCooldown > 0) {
        enemy.attackCooldown--;
        if (enemy.attackCooldown === 0) enemy.attacking = false;
    }
    
    // Boundaries
    rick.x = Math.max(0, Math.min(400 - rick.w, rick.x));
    enemy.x = Math.max(0, Math.min(400 - enemy.w, enemy.x));
    
    // Facing directions
    rick.facing = rick.x < enemy.x ? 1 : -1;
    enemy.facing = enemy.x < rick.x ? 1 : -1;
    
    // Check win/lose
    if (enemy.hp <= 0) {
        alert('Bạn thắng! Refresh để chơi lại.');
        enemy.hp = 100;
        rick.hp = 100;
    }
    if (rick.hp <= 0) {
        alert('Bạn thua! Refresh để chơi lại.');
        enemy.hp = 100;
        rick.hp = 100;
    }
}

function gameLoop() {
    update();
    draw();
    updateHP();
    requestAnimationFrame(gameLoop);
}

// Initialize
document.getElementById('p1name').textContent = 'RICK';
document.getElementById('p2name').textContent = 'EVIL MORTY';
gameLoop();
</script>
</body>
</html>
