<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Anime Fighter Mobile - Rick & Morty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Arial', sans-serif;
            touch-action: manipulation;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-wrapper {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Selection Screen */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .screen.hidden {
            display: none;
        }

        .selection-screen {
            background: linear-gradient(180deg, rgba(15,12,41,0.98) 0%, rgba(48,43,99,0.98) 100%);
            padding: 15px;
            overflow-y: auto;
        }

        .title {
            font-size: 2em;
            color: #e94560;
            text-align: center;
            margin: 15px 0;
            text-shadow: 0 0 20px rgba(233,69,96,0.5);
            font-weight: bold;
        }

        .subtitle {
            color: #aaa;
            text-align: center;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .character-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            padding: 0 10px;
            margin-bottom: 15px;
        }

        .character-card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid #0f3460;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .character-card:active {
            transform: scale(0.98);
        }

        .character-card.selected {
            border-color: #00ff88;
            background: linear-gradient(145deg, #0a3d2e, #0d5e3a);
            box-shadow: 0 0 20px rgba(0,255,136,0.4);
        }

        .char-emoji {
            font-size: 2.5em;
            width: 50px;
            text-align: center;
        }

        .char-info {
            flex: 1;
            color: white;
        }

        .char-name {
            font-weight: bold;
            font-size: 1em;
        }

        .char-universe {
            font-size: 0.75em;
            color: #888;
        }

        .char-stats {
            font-size: 0.7em;
            color: #aaa;
            margin-top: 3px;
        }

        .skin-tabs {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .skin-tab {
            padding: 5px 10px;
            border: 1px solid #555;
            background: #222;
            color: #ccc;
            border-radius: 15px;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .skin-tab:active {
            background: #444;
        }

        .skin-tab.active {
            border-color: #00ff88;
            background: #0a3d2e;
            color: #00ff88;
        }

        .selected-info {
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            padding: 10px;
            width: 90%;
            margin: 10px 0;
            color: white;
            text-align: center;
        }

        .fight-btn {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(233,69,96,0.4);
            transition: all 0.3s;
            margin: 10px 0;
            width: 80%;
            max-width: 300px;
        }

        .fight-btn:active {
            transform: scale(0.95);
        }

        .fight-btn:disabled {
            background: #555;
            box-shadow: none;
            color: #999;
        }

        /* Game Screen */
        .game-screen {
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: auto;
        }

        /* HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            color: white;
            font-size: 0.85em;
            background: rgba(0,0,0,0.7);
            gap: 10px;
        }

        .hud-player, .hud-enemy {
            flex: 1;
        }

        .hud-name {
            font-weight: bold;
            font-size: 0.8em;
            margin-bottom: 3px;
        }

        .health-outer {
            height: 18px;
            background: #333;
            border-radius: 9px;
            overflow: hidden;
            border: 1px solid #555;
            margin-bottom: 3px;
        }

        .health-inner {
            height: 100%;
            border-radius: 8px;
            transition: width 0.3s;
        }

        .health-inner.player {
            background: linear-gradient(90deg, #00ff88, #00cc6a);
        }

        .health-inner.enemy {
            background: linear-gradient(90deg, #e94560, #c23152);
        }

        .energy-outer {
            height: 10px;
            background: #222;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #444;
        }

        .energy-inner {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            border-radius: 5px;
            transition: width 0.3s;
        }

        .hud-center {
            text-align: center;
            min-width: 60px;
        }

        .hud-timer {
            font-size: 1.2em;
            font-weight: bold;
            color: #ffd700;
        }

        .hud-round {
            font-size: 0.7em;
            color: #aaa;
        }

        /* Touch Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.8);
        }

        .ctrl-btn {
            padding: 12px 8px;
            border: 2px solid #555;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 0.8em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }

        .ctrl-btn:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
            border-color: #fff;
        }

        .ctrl-btn.special {
            background: rgba(233,69,96,0.3);
            border-color: #e94560;
            grid-column: span 2;
        }

        .ctrl-btn.ultimate {
            background: rgba(255,215,0,0.3);
            border-color: #ffd700;
            grid-column: span 1;
            animation: glow 1.5s infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(255,215,0,0.3); }
            50% { box-shadow: 0 0 20px rgba(255,215,0,0.6); }
        }

        .dpad {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 3px;
            padding: 5px;
        }

        .dpad-btn {
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 0.9em;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }

        .dpad-btn:active {
            background: rgba(255,255,255,0.3);
        }

        .dpad-center {
            background: transparent;
            border: none;
        }

        /* Win Screen */
        .win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            color: white;
        }

        .win-overlay.hidden {
            display: none;
        }

        .win-text {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .win-text.win {
            color: #00ff88;
            text-shadow: 0 0 30px rgba(0,255,136,0.5);
        }

        .win-text.lose {
            color: #e94560;
            text-shadow: 0 0 30px rgba(233,69,96,0.5);
        }

        .win-detail {
            color: #ccc;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9em;
        }

        .rematch-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
        }

        .rematch-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="game-wrapper" id="gameWrapper">
        <!-- SELECTION SCREEN -->
        <div class="screen selection-screen" id="selectionScreen">
            <div class="title">⚔️ ANIME FIGHTER ⚔️</div>
            <div class="subtitle">Rick & Morty × Anime</div>
            
            <div class="character-list" id="characterList"></div>
            
            <div class="selected-info">
                <div>👤 <strong>Bạn:</strong> <span id="playerPick">Chưa chọn</span></div>
                <div>🤖 <strong>Đối thủ:</strong> <span id="enemyPick">Ngẫu nhiên</span></div>
            </div>
            
            <button class="fight-btn" id="fightBtn" disabled>⚡ CHIẾN ĐẤU! ⚡</button>
        </div>

        <!-- GAME SCREEN -->
        <div class="screen game-screen hidden" id="gameScreen">
            <!-- HUD -->
            <div class="hud">
                <div class="hud-player">
                    <div class="hud-name" id="pName">Player</div>
                    <div class="health-outer">
                        <div class="health-inner player" id="pHealth" style="width:100%"></div>
                    </div>
                    <div class="energy-outer">
                        <div class="energy-inner" id="pEnergy" style="width:0%"></div>
                    </div>
                </div>
                <div class="hud-center">
                    <div class="hud-timer" id="hudTimer">60</div>
                    <div class="hud-round" id="hudRound">Round 1</div>
                </div>
                <div class="hud-enemy">
                    <div class="hud-name" id="eName" style="text-align:right">Enemy</div>
                    <div class="health-outer">
                        <div class="health-inner enemy" id="eHealth" style="width:100%"></div>
                    </div>
                    <div class="energy-outer">
                        <div class="energy-inner" id="eEnergy" style="width:0%"></div>
                    </div>
                </div>
            </div>

            <!-- Canvas -->
            <canvas id="gameCanvas"></canvas>

            <!-- Controls -->
            <div class="controls">
                <div class="dpad">
                    <div></div>
                    <button class="dpad-btn" id="btnUp">▲</button>
                    <div></div>
                    <button class="dpad-btn" id="btnLeft">◄</button>
                    <div class="dpad-center"></div>
                    <button class="dpad-btn" id="btnRight">►</button>
                    <div></div>
                    <button class="dpad-btn" id="btnDown">▼</button>
                    <div></div>
                </div>
                <div style="display:flex;flex-direction:column;gap:5px;">
                    <button class="ctrl-btn" id="btnPunch">👊 Đấm</button>
                    <button class="ctrl-btn" id="btnKick">🦶 Đá</button>
                </div>
                <div style="display:flex;flex-direction:column;gap:5px;">
                    <button class="ctrl-btn special" id="btnSpecial">💥 Chiêu</button>
                    <button class="ctrl-btn ultimate" id="btnUltimate">⭐ TUYỆT CHIÊU</button>
                </div>
            </div>
        </div>

        <!-- WIN SCREEN -->
        <div class="win-overlay hidden" id="winScreen">
            <div class="win-text" id="winText"></div>
            <div class="win-detail" id="winDetail"></div>
            <button class="rematch-btn" onclick="rematch()">🔄 ĐẤU LẠI</button>
            <button class="rematch-btn" onclick="backToSelect()">👥 CHỌN LẠI</button>
        </div>
    </div>

    <script>
        // ==================== CHARACTER DATABASE ====================
        const characters = [
            {
                id: 'rick',
                name: 'Rick Sanchez',
                universe: 'Rick & Morty',
                emoji: '🧪',
                skins: [
                    { name: 'Áo Blue Trắng', bodyColor: '#87CEEB', hairColor: '#B0C4DE', desc: 'Rick cổ điển' },
                    { name: 'Pickle Rick', bodyColor: '#4CAF50', hairColor: '#2E7D32', desc: 'Dưa chuột!' },
                    { name: 'Evil Rick', bodyColor: '#FF4444', hairColor: '#880000', desc: 'Rick ác' }
                ],
                stats: { hp: 100, speed: 3, jump: 10, atkMult: 1.1 },
                moves: { punch: 'Portal Punch', kick: 'Gravity Kick', special: 'Portal Gun', ultimate: 'MULTIVERSE COLLAPSE' }
            },
            {
                id: 'morty',
                name: 'Morty Smith',
                universe: 'Rick & Morty',
                emoji: '😰',
                skins: [
                    { name: 'Classic Yellow', bodyColor: '#FFD700', hairColor: '#8B4513', desc: 'Morty thường' },
                    { name: 'Evil Morty', bodyColor: '#FF0000', hairColor: '#8B0000', desc: 'President Morty' },
                    { name: 'Mecha Morty', bodyColor: '#808080', hairColor: '#C0C0C0', desc: 'Robot Morty' }
                ],
                stats: { hp: 90, speed: 3.5, jump: 11, atkMult: 0.9 },
                moves: { punch: 'Nervous Punch', kick: 'Panic Kick', special: 'Laser Gun', ultimate: 'PURGE SUIT' }
            },
            {
                id: 'naruto',
                name: 'Naruto Uzumaki',
                universe: 'Naruto',
                emoji: '🍥',
                skins: [
                    { name: 'Classic Orange', bodyColor: '#FF8C00', hairColor: '#FFD700', desc: 'Ninja làng Lá' },
                    { name: 'Sage Mode', bodyColor: '#FF4500', hairColor: '#FFD700', desc: 'Tiên nhân' },
                    { name: 'Hokage', bodyColor: '#FFFFFF', hairColor: '#FFD700', desc: 'Đệ thất' }
                ],
                stats: { hp: 110, speed: 3.5, jump: 11, atkMult: 1.1 },
                moves: { punch: 'Uppercut', kick: 'Konoha Kick', special: 'RASENGAN!', ultimate: 'RASENSHURIKEN' }
            },
            {
                id: 'goku',
                name: 'Son Goku',
                universe: 'Dragon Ball',
                emoji: '⚡',
                skins: [
                    { name: 'Gi Orange', bodyColor: '#FF6600', hairColor: '#000000', desc: 'Goku thường' },
                    { name: 'Super Saiyan', bodyColor: '#FF6600', hairColor: '#FFD700', desc: 'Siêu Xayda' },
                    { name: 'Ultra Instinct', bodyColor: '#FF6600', hairColor: '#C0C0C0', desc: 'Vô cực' }
                ],
                stats: { hp: 120, speed: 4, jump: 13, atkMult: 1.2 },
                moves: { punch: 'Dragon Fist', kick: 'Super Kick', special: 'KAMEHAMEHA!', ultimate: 'ULTRA INSTINCT' }
            },
            {
                id: 'tanjiro',
                name: 'Tanjiro Kamado',
                universe: 'Demon Slayer',
                emoji: '⚔️',
                skins: [
                    { name: 'Demon Slayer', bodyColor: '#2F4F4F', hairColor: '#8B0000', desc: 'Kiếm sĩ diệt quỷ' },
                    { name: 'Hinokami', bodyColor: '#2F4F4F', hairColor: '#FF4500', desc: 'Vũ điệu lửa' },
                    { name: 'Final Form', bodyColor: '#000000', hairColor: '#FF0000', desc: 'Hình thái cuối' }
                ],
                stats: { hp: 100, speed: 3.5, jump: 10, atkMult: 1.0 },
                moves: { punch: 'Water Slash', kick: 'Whirlpool', special: 'HINOKAMI KAGURA', ultimate: 'SUN BREATHING' }
            },
            {
                id: 'levi',
                name: 'Levi Ackerman',
                universe: 'Attack on Titan',
                emoji: '🗡️',
                skins: [
                    { name: 'Survey Corps', bodyColor: '#8B7355', hairColor: '#000000', desc: 'Đội trinh sát' },
                    { name: 'Cleaning Levi', bodyColor: '#FFFFFF', hairColor: '#000000', desc: 'Levi lau dọn' },
                    { name: 'Wounded', bodyColor: '#8B7355', hairColor: '#000000', desc: 'Levi bị thương' }
                ],
                stats: { hp: 95, speed: 4.5, jump: 14, atkMult: 1.15 },
                moves: { punch: 'Spinning Slash', kick: '3D Strike', special: 'BEYBLADE', ultimate: 'HUMANITY\'S STRONGEST' }
            }
        ];

        // ==================== GAME STATE ====================
        let selectedCharacter = null;
        let selectedSkin = 0;
        let enemyCharacter = null;
        let enemySkin = 0;
        
        // Players in game
        let player = { x: 150, y: 300, width: 40, height: 70, vx: 0, vy: 0, hp: 100, maxHp: 100, energy: 0, maxEnergy: 100, 
                       facing: 1, onGround: true, attacking: false, attackTimer: 0, attackType: '', invincible: 0,
                       comboCount: 0, lastHitTime: 0 };
        let enemy = { x: 550, y: 300, width: 40, height: 70, vx: 0, vy: 0, hp: 100, maxHp: 100, energy: 0, maxEnergy: 100,
                      facing: -1, onGround: true, attacking: false, attackTimer: 0, attackType: '', invincible: 0,
                      aiTimer: 0, aiAction: 'idle', aiCooldown: 0 };
        
        let gameTimer = 60;
        let roundNumber = 1;
        let playerWins = 0;
        let enemyWins = 0;
        let gameActive = false;
        let particles = [];
        let screenShake = 0;
        let hitEffects = [];
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GROUND_Y = 360;
        const GRAVITY = 0.6;
        
        // ==================== INITIALIZATION ====================
        function initSelectionScreen() {
            const list = document.getElementById('characterList');
            list.innerHTML = '';
            
            characters.forEach((char, index) => {
                const card = document.createElement('div');
                card.className = 'character-card';
                card.innerHTML = `
                    <div class="char-emoji">${char.emoji}</div>
                    <div class="char-info">
                        <div class="char-name">${char.name}</div>
                        <div class="char-universe">${char.universe}</div>
                        <div class="char-stats">HP:${char.stats.hp} | Tốc:${char.stats.speed} | Sức:${(char.stats.atkMult*100).toFixed(0)}%</div>
                        <div class="skin-tabs">
                            ${char.skins.map((s, si) => 
                                `<span class="skin-tab" data-char="${index}" data-skin="${si}">${s.name}</span>`
                            ).join('')}
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', (e) => {
                    if (e.target.classList.contains('skin-tab')) {
                        const si = parseInt(e.target.dataset.skin);
                        selectSkin(index, si);
                        return;
                    }
                    selectCharacter(index);
                });
                
                list.appendChild(card);
            });
            
            // Random enemy
            pickRandomEnemy();
        }
        
        function selectCharacter(index) {
            selectedCharacter = index;
            selectedSkin = 0;
            document.getElementById('playerPick').textContent = characters[index].name;
            document.getElementById('fightBtn').disabled = false;
            
            // Update UI
            document.querySelectorAll('.character-card').forEach((card, i) => {
                card.classList.toggle('selected', i === index);
            });
            
            updateSkinTabs(index);
            pickRandomEnemy();
        }
        
        function selectSkin(charIndex, skinIndex) {
            if (selectedCharacter === charIndex) {
                selectedSkin = skinIndex;
            }
            updateSkinTabs(charIndex);
        }
        
        function updateSkinTabs(charIndex) {
            const cards = document.querySelectorAll('.character-card');
            if (cards[charIndex]) {
                const tabs = cards[charIndex].querySelectorAll('.skin-tab');
                tabs.forEach((tab, i) => {
                    tab.classList.toggle('active', charIndex === selectedCharacter && i === selectedSkin);
                });
            }
        }
        
        function pickRandomEnemy() {
            const available = characters.filter((_, i) => i !== selectedCharacter);
            if (available.length > 0) {
                const pick = available[Math.floor(Math.random() * available.length)];
                enemyCharacter = characters.indexOf(pick);
                enemySkin = Math.floor(Math.random() * pick.skins.length);
                document.getElementById('enemyPick').textContent = 
                    `${pick.name} (${pick.skins[enemySkin].name})`;
            }
        }
        
        function startFight() {
            if (selectedCharacter === null) return;
            if (enemyCharacter === null) pickRandomEnemy();
            
            document.getElementById('selectionScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('winScreen').classList.add('hidden');
            
            setupGame();
            resizeCanvas();
            gameActive = true;
            gameTimer = 60;
            roundNumber = 1;
            playerWins = 0;
            enemyWins = 0;
            updateHUD();
            gameLoop();
        }
        
        function setupGame() {
            const pChar = characters[selectedCharacter];
            const eChar = characters[enemyCharacter];
            
            player.hp = pChar.stats.hp;
            player.maxHp = pChar.stats.hp;
            player.energy = 0;
            player.x = 120;
            player.y = GROUND_Y - 70;
            player.vx = 0;
            player.vy = 0;
            player.facing = 1;
            player.onGround = true;
            player.attacking = false;
            player.attackTimer = 0;
            player.invincible = 0;
            player.comboCount = 0;
            
            enemy.hp = eChar.stats.hp;
            enemy.maxHp = eChar.stats.hp;
            enemy.energy = 0;
            enemy.x = canvas.width - 160;
            enemy.y = GROUND_Y - 70;
            enemy.vx = 0;
            enemy.vy = 0;
            enemy.facing = -1;
            enemy.onGround = true;
            enemy.attacking = false;
            enemy.attackTimer = 0;
            enemy.invincible = 0;
            enemy.aiTimer = 0;
            enemy.aiAction = 'idle';
            
            particles = [];
            hitEffects = [];
            screenShake = 0;
            
            document.getElementById('pName').textContent = pChar.name;
            document.getElementById('eName').textContent = eChar.name;
        }
        
        function resizeCanvas() {
            const wrapper = document.getElementById('gameWrapper');
            const width = Math.min(wrapper.clientWidth, 450);
            canvas.width = width;
            canvas.height = width * 0.65;
            
            // Adjust positions
            player.x = Math.min(player.x, canvas.width - 60);
            enemy.x = Math.max(enemy.x, 20);
        }
        
        // ==================== INPUT HANDLING ====================
        const keys = {};
        let btnStates = { left: false, right: false, up: false, down: false, punch: false, kick: false, special: false, ultimate: false };
        
        // Keyboard input
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            e.preventDefault();
        });

                if (type === 'player' && selectedPlayerIndex === charIdx && selectedPlayerSkin === skinIdx) {

    const canvas = document.getElementById('gc');

    // ==================== INIT SELECT ====================
    function buildGrid(containerId, type) {
        const grid = document.getElementById(containerId);
        grid.innerHTML = '';
        chars.forEach((c, i) => {
            const box = document.createElement('div');
            box.className = 'char-box';
            box.id = `${type}-${i}`;
            box.innerHTML = `

                <div class="name">${c.name}</div>

    function pickChar(type, idx) {
        if (type === 'player') {

        }

    }

    function pickSkin(type, ci, si) {
        if (type === 'player' && pIdx === ci) pSkin = si;
        if (type === 'enemy' && eIdx === ci) eSkin = si;

        // Update skin dots
        document.querySelectorAll('.skin-dot').forEach(d => d.classList.remove('active'));

            const dp = document.getElementById(`skin-player-${pIdx}-${pSkin}`);
            if (dp) dp.classList.add('active');
            document.getElementById(`skname-player-${pIdx}`).textContent = chars[pIdx].skins[pSkin].n;
        }
        if (eIdx !== null) {
            const de = document.getElementById(`skin-enemy-${eIdx}-${eSkin}`);
            if (de) de.classList.add('active');
            document.getElementById(`skname-enemy-${eIdx}`).textContent = chars[eIdx].skins[eSkin].n;
        }
        
        // Info panel
        document.getElementById('infoPlayer').textContent = pIdx !== null ? chars[pIdx].name : 'Chưa chọn';

        document.getElementById('infoEnemy').textContent = eIdx !== null ? chars[eIdx].name : 'Chưa chọn';
        document.getElementById('infoEnemySkin').textContent = eIdx !== null ? chars[eIdx].skins[eSkin].n : '-';
        
        document.getElementById('fightBtn').disabled = (pIdx === null || eIdx === null);
    }

    function pickRandomEnemy() {
        const avail = chars.map((_,i) => i).filter(i => i !== pIdx);
        if (avail.length > 0) {
            const pick = avail[Math.floor(Math.random() * avail.length)];
            eIdx = pick;
            eSkin = Math.floor(Math.random() * chars[pick].skins.length);
            refreshUI();
        }
    }

    // ==================== GAME ====================
    function startGame() {
        if (pIdx === null || eIdx === null) return;
        
        document.getElementById('selectScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        document.getElementById('winOverlay').classList.add('hidden');
        
        resizeCanvas();
        resetPlayers();
        active = true;
        timer = 60;
        round = 1;
        pWins = 0;
        eWins = 0;
        
        updateHUD();
        if (timerID) clearInterval(timerID);
        timerID = setInterval(tick, 1000);
        loop();
    }

    function resizeCanvas() {
        const w = Math.min(window.innerWidth, 420);
        canvas.width = w;
        canvas.height = w * 0.65;
    }

        const pc = chars[pIdx], ec = chars[eIdx];

        p2 = { x: canvas.width-105, y: GND-70, w: 35, h: 65, vx: 0, vy: 0, hp: ec.s.hp, maxHp: ec.s.hp, en: 0,
               face: -1, ground: true, atk: false, atkTimer: 0, atkType: '', inv: 0, aiT: 0, aiCD: 0 };

        texts = [];

        document.getElementById('hudP1').textContent = pc.name;

        document.getElementById('hudTimer').textContent = timer;
    }

    function updateHUD() {
        document.getElementById('hpP1').style.width = Math.max(0, p1.hp/p1.maxHp*100) + '%';
        document.getElementById('hpP2').style.width = Math.max(0, p2.hp/p2.maxHp*100) + '%';
        document.getElementById('enP1').style.width = Math.min(100, p1.en) + '%';
        document.getElementById('enP2').style.width = Math.min(100, p2.en) + '%';
    }

    function tick() {
        if (!active) return;
        timer--;
        document.getElementById('hudTimer').textContent = timer;
        if (timer <= 0) endRound('timeout');
    }

    function endRound(winner) {
        active = false;
        if (winner === 'player' || winner === 'p2dead') {
            pWins++;
        } else if (winner === 'enemy' || winner === 'p1dead') {
            eWins++;
        }
        
        document.getElementById('hudRound').textContent = `P1: ${pWins} - P2: ${eWins}`;
        
        if (pWins >= 2 || eWins >= 2) {
            // Match over
            const overlay = document.getElementById('winOverlay');
            overlay.classList.remove('hidden');
            const wt = document.getElementById('winText');
            const wm = document.getElementById('winMsg');
            
            if (pWins >= 2) {

            if (timerID) clearInterval(timerID);

            // Next round
            setTimeout(() => {
                timer = 60;
                resetPlayers();
                active = true;
                document.getElementById('hudRound').textContent = `Round ${round+1}`;

        }
    }

    function rematch() {

    function setupBtn(id, key) {
        const b = document.getElementById(id);

        b.addEventListener('touchstart', down, {passive: false});
        b.addEventListener('touchend', up, {passive: false});

    function checkHit(attacker, defender, type, who) {
        const dist = Math.abs(attacker.x - defender.x);
        const range = (type === 'special' || type === 'ultimate') ? 150 : 60;
        const correctDir = attacker.face === (defender.x > attacker.x ? 1 : -1);
        
        if (dist < range && correctDir && defender.inv <= 0) {
            const baseDmg = { punch: 15, kick: 22, special: 38, ultimate: 65 };
            const mult = who === 'p1' ? chars[pIdx].s.atk/100 : chars[eIdx].s.atk/100;

            defender.vy = -5;
            defender.vx = defender.face * -3;
            shake = type === 'ultimate' ? 14 : 6;
            
            for (let i=0; i<(type==='ultimate'?25:8); i++) {
                particles.push({
                    x: defender.x+defender.w/2, y: defender.y+defender.h/2,

                });
            }
            
            const moveNames = who === 'p1' ? chars[pIdx].m : chars[eIdx].m;
            const mn = { punch: moveNames.pu, kick: moveNames.ki, special: moveNames.sp, ultimate: moveNames.ul };
            texts.push({
                x: defender.x, y: defender.y-15,
                text: `${mn[type]}! -${dmg}`, life: 35,
                color: type==='ultimate'?'#ffd700':'#fff'
            });
            
            updateHUD();
            if (defender.hp <= 0) {
                defender.hp = 0;
                updateHUD();
                endRound(who === 'p1' ? 'player' : 'enemy');
            }
        }
    }
    
    // ==================== AI ====================
    function updateAI() {

                p2.vx = dist > 0 ? -3 : 3;

        }
        
        p2.aiCD = 15 + Math.random()*30;
    }

        <button class="btn btn-fight" id="fightBtn" disabled onclick="startFight()">⚡ CHIẾN ĐẤU ⚡</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="hidden">
        <div id="hud">
            <div class="sd"><div class="nm" id="n1">P1</div><div class="hp-bar"><div class="hp-fill g" id="hp1" style="width:100%"></div></div><div class="en-bar"><div class="en-fill" id="en1" style="width:0%"></div></div></div>
            <div class="mid"><div class="t" id="timer">60</div><div class="rd" id="round">Round 1</div></div>
            <div class="sd sdr"><div class="nm" id="n2">P2</div><div class="hp-bar"><div class="hp-fill r" id="hp2" style="width:100%"></div></div><div class="en-bar"><div class="en-fill" id="en2" style="width:0%"></div></div></div>
        </div>
        <canvas id="gc"></canvas>
        <div id="ctrl">
            <div class="dp"><div></div><button id="bu">▲</button><div></div><button id="bl">◄</button><div></div><button id="br">►</button></div>
            <div style="display:flex;flex-direction:column;gap:3px;"><button class="rb" id="bp">👊 Đấm</button><button class="rb" id="bk">🦶 Đá</button></div>
            <div style="display:flex;flex-direction:column;gap:3px;"><button class="gb" id="bs">💥 Chiêu</button><button class="gb" id="buu">⭐ Tuyệt</button></div>
        </div>
    </div>

    <!-- WIN -->
    <div id="win" class="hidden"><div class="big" id="wt"></div><div class="msg" id="wm"></div><div><button onclick="rematch()">🔄 Đấu lại</button><button onclick="goBack()">👥 Chọn lại</button></div></div>

</div>

<script>
// DATA
const chars = [
    { id:'rick', name:'Rick Sanchez', from:'Rick & Morty', emoji:'🧪',
      skins:[{n:'Blue Trắng',c:'#87CEEB',h:'#B0C4DE'},{n:'Pickle Rick',c:'#4CAF50',h:'#2E7D32'},{n:'Evil Rick',c:'#F44',h:'#800'}],
      s:{hp:100,spd:3.5,atk:1.1}, m:{pu:'Portal Punch',ki:'Gravity Kick',sp:'Portal Gun',ul:'MULTIVERSE'} },
    { id:'morty', name:'Morty Smith', from:'Rick & Morty', emoji:'😰',
      skins:[{n:'Classic',c:'#FFD700',h:'#8B4513'},{n:'Evil',c:'#F00',h:'#800'},{n:'Mecha',c:'#808080',h:'#C0C0C0'}],
      s:{hp:90,spd:3.8,atk:0.9}, m:{pu:'Nervous Punch',ki:'Panic Kick',sp:'Laser Gun',ul:'PURGE SUIT'} },
    { id:'naruto', name:'Naruto', from:'Naruto', emoji:'🍥',
      skins:[{n:'Classic',c:'#FF8C00',h:'#FFD700'},{n:'Sage',c:'#FF4500',h:'#FFD700'},{n:'Hokage',c:'#FFF',h:'#FFD700'}],
      s:{hp:110,spd:4,atk:1.05}, m:{pu:'Uppercut',ki:'Konoha Kick',sp:'RASENGAN!',ul:'RASENSHURIKEN'} },
    { id:'goku', name:'Goku', from:'Dragon Ball', emoji:'⚡',
      skins:[{n:'Classic',c:'#FF6600',h:'#000'},{n:'SSJ',c:'#FF6600',h:'#FFD700'},{n:'Ultra',c:'#FF6600',h:'#C0C0C0'}],
      s:{hp:120,spd:4.5,atk:1.2}, m:{pu:'Dragon Fist',ki:'Super Kick',sp:'KAMEHAMEHA!',ul:'ULTRA INSTINCT'} },
    { id:'tanjiro', name:'Tanjiro', from:'Demon Slayer', emoji:'⚔️',
      skins:[{n:'Slayer',c:'#2F4F4F',h:'#8B0000'},{n:'Hinokami',c:'#2F4F4F',h:'#FF4500'},{n:'Demon',c:'#4A0000',h:'#F00'}],
      s:{hp:100,spd:3.5,atk:1.0}, m:{pu:'Water Slash',ki:'Whirlpool',sp:'HINOKAMI',ul:'SUN BREATHING'} },
    { id:'saitama', name:'Saitama', from:'One Punch Man', emoji:'👊',
      skins:[{n:'Hero',c:'#FFD700',h:'#FFD700'},{n:'Casual',c:'#FFF',h:'#FFD700'},{n:'Serious',c:'#F00',h:'#FFD700'}],
      s:{hp:150,spd:5,atk:1.5}, m:{pu:'Normal Punch',ki:'Normal Kick',sp:'SERIOUS PUNCH',ul:'ONE PUNCH'} }
];

let pIdx = null, pSkin = 0, eIdx = null, eSkin = 0;
let p1, p2, active = false, timer = 60, round = 1, pw = 0, ew = 0;
let particles = [], texts = [], shake = 0, timerID = null;
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const GND = 340, GRV = 0.5;

// BUILD SELECTION SCREEN
function buildSelect() {
    const pg = document.getElementById('playerChars'), eg = document.getElementById('enemyChars');
    pg.innerHTML = ''; eg.innerHTML = '';
    chars.forEach((c, i) => {
        const card = (type) => {
            const d = document.createElement('div');
            d.className = 'char-card';
            d.id = `${type}-${i}`;
            d.innerHTML = `<div class="big">${c.emoji}</div><div class="nm">${c.name}</div><div class="fm">${c.from}</div>
                <div class="st"><span>❤${c.s.hp}</span><span>💨${c.s.spd}</span><span>⚔${Math.round(c.s.atk*100)}%</span></div>
                <div class="skin-row">${c.skins.map((s,si)=>`<div class="skin-dot" style="background:${s.c}" id="sk-${type}-${i}-${si}"></div>`).join('')}</div>
                <div class="sn" id="sn-${type}-${i}">${c.skins[0].n}</div>`;
            d.addEventListener('click', (e) => {
                if (e.target.classList.contains('skin-dot')) {
                    const si = parseInt(e.target.id.split('-')[3]);
                    if (type==='p' && pIdx===i) pSkin = si;
                    if (type==='e' && eIdx===i) eSkin = si;
                    refreshSelect(); return;
                }
                if (type==='p') { pIdx = i; pSkin = 0; }
                else { eIdx = i; eSkin = 0; }
                refreshSelect();
            });
            return d;
        };
        pg.appendChild(card('p'));
        eg.appendChild(card('e'));
    });
}

function refreshSelect() {
    document.querySelectorAll('.char-card').forEach(c => c.classList.remove('sel'));
    if (pIdx !== null) document.getElementById(`p-${pIdx}`).classList.add('sel');
    if (eIdx !== null) document.getElementById(`e-${eIdx}`).classList.add('sel');
    
    document.querySelectorAll('.skin-dot').forEach(d => d.classList.remove('act'));
    if (pIdx !== null) { const d = document.getElementById(`sk-p-${pIdx}-${pSkin}`); if(d) d.classList.add('act'); document.getElementById(`sn-p-${pIdx}`).textContent = chars[pIdx].skins[pSkin].n; }
    if (eIdx !== null) { const d = document.getElementById(`sk-e-${eIdx}-${eSkin}`); if(d) d.classList.add('act'); document.getElementById(`sn-e-${eIdx}`).textContent = chars[eIdx].skins[eSkin].n; }
    
    document.getElementById('ip').textContent = pIdx !== null ? chars[pIdx].name : '-';
    document.getElementById('ips').textContent = pIdx !== null ? chars[pIdx].skins[pSkin].n : '-';
    document.getElementById('ie').textContent = eIdx !== null ? chars[eIdx].name : '-';
    document.getElementById('ies').textContent = eIdx !== null ? chars[eIdx].skins[eSkin].n : '-';
    document.getElementById('fightBtn').disabled = (pIdx === null || eIdx === null);
}

function randomEnemy() {
    const avail = chars.map((_,i)=>i).filter(i => i !== pIdx);
    if (avail.length) { eIdx = avail[Math.floor(Math.random()*avail.length)]; eSkin = Math.floor(Math.random()*chars[eIdx].skins.length); refreshSelect(); }
}

// GAME LOGIC
function resizeCanvas() { const w = Math.min(window.innerWidth, 420); canvas.width = w; canvas.height = w * 0.65; }

function startFight() {
    if (pIdx === null || eIdx === null) return;
    document.getElementById('selectScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    document.getElementById('win').classList.add('hidden');
    resizeCanvas();
    resetPlayers();
    active = true; timer = 60; round = 1; pw = 0; ew = 0;
    updateHUD();
    if (timerID) clearInterval(timerID);
    timerID = setInterval(() => { if(active){timer--; document.getElementById('timer').textContent=timer; if(timer<=0) endRound('time');} }, 1000);
    loop();
}

function resetPlayers() {
    const pc = chars[pIdx], ec = chars[eIdx];
    p1 = { x:70, y:GND-65, w:35, h:60, vx:0, vy:0, hp:pc.s.hp, mhp:pc.s.hp, en:0, face:1, gnd:true, atk:false, atkT:0, atkType:'', inv:0 };
    p2 = { x:canvas.width-105, y:GND-65, w:35, h:60, vx:0, vy:0, hp:ec.s.hp, mhp:ec.s.hp, en:0, face:-1, gnd:true, atk:false, atkT:0, atkType:'', inv:0, aiT:0, aiCD:0 };
    particles = []; texts = []; shake = 0;
    document.getElementById('n1').textContent = pc.name;
    document.getElementById('n2').textContent = ec.name;
    document.getElementById('round').textContent = `Round ${round}`;
    document.getElementById('timer').textContent = timer;
}

function updateHUD() {
    document.getElementById('hp1').style.width = Math.max(0,p1.hp/p1.mhp*100)+'%';
    document.getElementById('hp2').style.width = Math.max(0,p2.hp/p2.mhp*100)+'%';
    document.getElementById('en1').style.width = Math.min(100,p1.en)+'%';
    document.getElementById('en2').style.width = Math.min(100,p2.en)+'%';
}

function endRound(winner) {
    active = false;
    if (winner === 'p1' || winner === 'p2dead') pw++;
    else if (winner === 'p2' || winner === 'p1dead') ew++;
    document.getElementById('round').textContent = `P1:${pw} - P2:${ew}`;
    if (pw >= 2 || ew >= 2) {
        const w = document.getElementById('win'); w.classList.remove('hidden');
        document.getElementById('wt').textContent = pw>=2 ? '🏆 CHIẾN THẮNG!' : '💀 THẤT BẠI';
        document.getElementById('wt').style.color = pw>=2 ? '#0f0' : '#f44';
        document.getElementById('wm').textContent = pw>=2 ? `${chars[pIdx].name} đánh bại ${chars[eIdx].name}!` : `${chars[eIdx].name} đã thắng!`;
        if(timerID) clearInterval(timerID);
    } else {
        setTimeout(() => { timer=60; resetPlayers(); active=true; round++; updateHUD(); document.getElementById('round').textContent=`Round ${round}`; document.getElementById('timer').textContent=timer; }, 1500);
    }
}

function rematch() {
    document.getElementById('win').classList.add('hidden');
    timer=60; round=1; pw=0; ew=0; resetPlayers(); active=true; updateHUD();
    document.getElementById('round').textContent='Round 1'; document.getElementById('timer').textContent=timer;
    if(timerID) clearInterval(timerID);
    timerID = setInterval(() => { if(active){timer--; document.getElementById('timer').textContent=timer; if(timer<=0) endRound('time');} }, 1000);
    loop();
}

function goBack() {
    document.getElementById('win').classList.add('hidden');
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('selectScreen').classList.remove('hidden');
    if(timerID) clearInterval(timerID); active = false;
}

// INPUT
const btns = {};
function sb(id, key, action) {
    const b = document.getElementById(id);
    if(!b) return;
    btns[key] = false;
    const d = (e) => { e.preventDefault(); btns[key]=true; if(action) action(); };
    const u = (e) => { e.preventDefault(); btns[key]=false; };
    b.addEventListener('touchstart',d,{passive:false}); b.addEventListener('touchend',u,{passive:false});
    b.addEventListener('touchcancel',u,{passive:false}); b.addEventListener('mousedown',d); b.addEventListener('mouseup',u); b.addEventListener('mouseleave',u);
}
sb('bl','left'); sb('br','right');
sb('bu','up',()=>{if(p1.gnd){p1.vy=-11;p1.gnd=false;}});
sb('bp','punch',()=>doAtk('punch'));
sb('bk','kick',()=>doAtk('kick'));
sb('bs','special',()=>doAtk('special'));
sb('buu','ultimate',()=>doAtk('ultimate'));

function doAtk(type) {
    if(!active||p1.atk) return;
    const costs={punch:0,kick:0,special:25,ultimate:100};
    if(p1.en<costs[type]) return;
    p1.en-=costs[type]; p1.atk=true; p1.atkType=type;
    const dur={punch:8,kick:12,special:18,ultimate:28}; p1.atkT=dur[type];
    setTimeout(()=>{if(active&&p1.atk&&p1.atkType===type) hit(p1,p2,type,'p1');}, type==='ultimate'?400:180);
}

function hit(a,d,type,who) {
    const dist=Math.abs(a.x-d.x), range=(type==='special'||type==='ultimate')?140:55;
    if(dist<range && a.face===(d.x>a.x?1:-1) && d.inv<=0) {
        const bd={punch:15,kick:22,special:38,ultimate:65};
        const mult=who==='p1'?chars[pIdx].s.atk:chars[eIdx].s.atk;
        const dmg=Math.floor(bd[type]*mult);
        d.hp-=dmg; d.inv=15; d.vy=-5; d.vx=d.face*-3;
        shake=type==='ultimate'?14:6;
        for(let i=0;i<(type==='ultimate'?25:8);i++) particles.push({x:d.x+d.w/2,y:d.y+d.h/2,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:15+Math.random()*20,color:type==='ultimate'?'#ffd700':'#f60'});
        const mn=who==='p1'?chars[pIdx].m:chars[eIdx].m;
        const mn2={punch:mn.pu,kick:mn.ki,special:mn.sp,ultimate:mn.ul};
        texts.push({x:d.x,y:d.y-15,text:`${mn2[type]}! -${dmg}`,life:35,color:type==='ultimate'?'#ffd700':'#fff'});
        updateHUD();
        if(d.hp<=0){d.hp=0;updateHUD();endRound(who==='p1'?'p1':'p2');}
    }
}

// AI
function updateAI() {
    if(!active||p2.atk) return;
    p2.aiT++; if(p2.aiCD>0){p2.aiCD--;return;}
    const dist=p1.x-p2.x, ad=Math.abs(dist);
    if(ad>180) p2.vx=dist>0?2.5:-2.5;
    else if(ad<55) {
        if(Math.random()<0.6){ const t=['punch','kick']; if(p2.en>=25)t.push('special'); if(p2.en>=100)t.push('ultimate'); doEAtk(t[Math.floor(Math.random()*t.length)]); }
        else p2.vx=dist>0?-3:3;
    } else { if(Math.random()<0.03&&p2.en>=20){ const t=['punch','kick','special']; if(p2.en>=100)t.push('ultimate'); doEAtk(t[Math.floor(Math.random()*t.length)]); } p2.vx*=0.9; }
    if(p1.y<p2.y-30&&p2.gnd&&Math.random()<0.02){p2.vy=-10;p2.gnd=false;}
    p2.aiCD=15+Math.random()*30;
}

function doEAtk(type) {
    if(p2.atk) return;
    const costs={punch:0,kick:0,special:25,ultimate:100};
    if(p2.en<costs[type]) return;
    p2.en-=costs[type]; p2.atk=true; p2.atkType=type;
    const dur={punch:8,kick:12,special:18,ultimate:28}; p2.atkT=dur[type];
    setTimeout(()=>{if(active&&p2.atk&&p2.atkType===type) hit(p2,p1,type,'p2');}, type==='ultimate'?400:180);
}

// GAME LOOP
function loop() {
    if(!active) { requestAnimationFrame(loop); return; }
    // Player movement
    const spd = chars[pIdx].s.spd;
    if(btns['left']) p1.vx = -spd;
    else if(btns['right']) p1.vx = spd;
    else p1.vx *= 0.8;
    
    // Physics
    [p1,p2].forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += GRV;
        if(p.y >= GND - p.h) { p.y = GND - p.h; p.vy = 0; p.gnd = true; }
        if(p.x < 0) p.x = 0; if(p.x > canvas.width - p.w) p.x = canvas.width - p.w;
        if(p.atk) { p.atkT--; if(p.atkT <= 0) { p.atk = false; p.atkType = ''; } }
        if(p.inv > 0) p.inv--;
        p.en = Math.min(100, p.en + 0.1);
    });
    
    // Face direction
    if(p1.x < p2.x) p1.face = 1; else p1.face = -1;
    if(p2.x < p1.x) p2.face = 1; else p2.face = -1;
    
    updateAI();
    updateHUD();
    
    // Particles
    particles = particles.filter(p => { p.x+=p.vx; p.y+=p.vy; p.life--; return p.life>0; });
    texts = texts.filter(t => { t.life--; return t.life>0; });
    if(shake>0) shake--;
    
    // Draw
    const sx = shake ? (Math.random()-0.5)*shake : 0;
    const sy = shake ? (Math.random()-0.5)*shake : 0;
    ctx.save(); ctx.translate(sx, sy);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Background
    ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#222'; ctx.fillRect(0, GND, canvas.width, canvas.height - GND);
    ctx.strokeStyle = '#444'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, GND); ctx.lineTo(canvas.width, GND); ctx.stroke();
    
    // Draw characters
    [ {p:p1, idx:pIdx, sk:pSkin}, {p:p2, idx:eIdx, sk:eSkin} ].forEach(({p, idx, sk}) => {
        const c = chars[idx], skin = c.skins[sk];
        // Body
        ctx.fillStyle = skin.c; ctx.fillRect(p.x, p.y, p.w, p.h);
        // Head
        ctx.fillStyle = skin.h; ctx.beginPath(); ctx.arc(p.x+p.w/2, p.y-12, 15, 0, Math.PI*2); ctx.fill();
        // Eyes
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x+p.w/2-5, p.y-15, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x+p.w/2+5, p.y-15, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(p.x+p.w/2-5+p.face*2, p.y-15, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x+p.w/2+5+p.face*2, p.y-15, 2, 0, Math.PI*2); ctx.fill();
        // Invincible flash
        if(p.inv > 0 && Math.floor(p.inv/3)%2===0) { ctx.globalAlpha = 0.5; }
        // Attack effect
        if(p.atk) {
            ctx.fillStyle = p.atkType==='ultimate'?'#ffd700':(p.atkType==='special'?'#ff6600':'#fff');
            ctx.fillRect(p.x+p.face*p.w, p.y+p.h/2-10, 25, 20);
        }
        ctx.globalAlpha = 1;
    });
    
    // Particles
    particles.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = p.life/35; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;
    
    // Hit texts
    texts.forEach(t => {
        ctx.fillStyle = t.color; ctx.globalAlpha = t.life/35;
        ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
        ctx.fillText(t.text, t.x + (p1.atk?p1.w/2:0), t.y);
    });
    ctx.globalAlpha = 1;
    
    ctx.restore();
    requestAnimationFrame(loop);
}

// INIT
buildSelect();
resizeCanvas();
loop();
</script>
</body>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: Arial; display: flex; justify-content: center; align-items: center; min-height: 100vh; touch-action: manipulation; }
        
        .container { width: 100%; max-width: 420px; height: 100vh; position: relative; overflow: hidden; background: #0a0a1a; }

        /* ===== SELECT SCREEN ===== */
        .select-screen { width: 100%; height: 100%; background: linear-gradient(180deg, #1a0030, #0a0030); overflow-y: auto; padding: 15px 10px; }
        .select-screen.hidden { display: none; }
        
        .game-logo { text-align: center; margin-bottom: 10px; }
        .game-logo h1 { color: #ff3366; font-size: 28px; text-shadow: 0 0 30px #ff3366; }
        .game-logo p { color: #999; font-size: 12px; }

        .section-title { 
            background: linear-gradient(90deg, transparent, #ff336633, transparent);
            color: #ffcc00; text-align: center; padding: 8px; font-size: 14px; font-weight: bold;
            margin: 15px 0 10px; letter-spacing: 2px;
        }

        .char-list { display: flex; flex-direction: column; gap: 8px; }
        
        .char-item {
            display: flex; align-items: center; gap: 12px;

            padding: 12px; cursor: pointer; transition: 0.2s;
        }
        .char-item:active { transform: scale(0.98); }
        .char-item.selected { border-color: #00ff88; background: #002211; box-shadow: 0 0 20px #00ff8844; }

        .char-avatar {
            width: 60px; height: 60px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; background: #00000033; flex-shrink: 0;
        }

        .char-details { flex: 1; color: #fff; }
        .char-details .name { font-weight: bold; font-size: 15px; }
        .char-details .universe { color: #888; font-size: 11px; }
        .char-details .stats { display: flex; gap: 8px; margin-top: 5px; }
        .char-details .stats span { background: #ffffff15; padding: 3px 8px; border-radius: 10px; font-size: 10px; }

        .skin-options { display: flex; gap: 5px; flex-direction: column; align-items: center; }
        .skin-circle {
            width: 25px; height: 25px; border-radius: 50%; border: 2px solid #555;
            cursor: pointer; transition: 0.2s;
        }
        .skin-circle:active { transform: scale(1.2); }
        .skin-circle.active { border-color: #fff; box-shadow: 0 0 10px #fff; }

        .selection-summary {
            background: #00000088; border: 1px solid #333; border-radius: 15px;
            padding: 15px; margin: 15px 0; color: #fff;
        }
        .selection-summary .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
        .highlight-green { color: #00ff88; font-weight: bold; }
        .highlight-red { color: #ff3366; font-weight: bold; }

        .random-btn {
            display: block; width: 100%; padding: 10px; background: transparent;
            border: 1px dashed #ff3366; color: #ff3366; border-radius: 20px;
            font-size: 13px; cursor: pointer; margin: 5px 0;
        }

        .fight-btn {
            display: block; width: 100%; padding: 16px;
            background: linear-gradient(135deg, #ff3366, #cc0044);
            color: #fff; border: none; border-radius: 30px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            letter-spacing: 3px; margin-top: 10px;
        }
        .fight-btn:disabled { background: #444; color: #888; letter-spacing: 0; }

        /* ===== GAME SCREEN ===== */
        .game-screen { width: 100%; height: 100%; display: flex; flex-direction: column; background: #000; }
        .game-screen.hidden { display: none; }

        .hud { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #000000cc; color: #fff; }
        .hud-player, .hud-enemy { flex: 1; }
        .hud-enemy { text-align: right; }
        .hud-name { font-size: 11px; font-weight: bold; margin-bottom: 3px; }
        .hp-bar { height: 14px; background: #333; border-radius: 7px; overflow: hidden; margin-bottom: 3px; border: 1px solid #555; }
        .hp-fill { height: 100%; transition: width 0.3s; }
        .hp-fill.green { background: linear-gradient(90deg, #00ff88, #00aa44); }
        .hp-fill.red { background: linear-gradient(90deg, #ff3366, #aa0033); }
        .energy-bar { height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
        .energy-fill { height: 100%; background: linear-gradient(90deg, #ffcc00, #ff8800); transition: width 0.3s; }
        
        .hud-center { text-align: center; min-width: 50px; }
        .timer { font-size: 20px; font-weight: bold; color: #ffcc00; }
        .round-info { font-size: 10px; color: #aaa; }

        canvas { flex: 1; width: 100%; display: block; }

        .controls { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 5px; padding: 8px; background: #0a0a0a; }
        .dpad { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 3px; }
        .controls button { padding: 12px 4px; border: 2px solid #333; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 12px; font-weight: bold; cursor: pointer; }
        .controls button:active { background: #333; border-color: #fff; transform: scale(0.95); }
        .btn-attack { border-color: #ff3366 !important; background: #330011 !important; }
        .btn-special { border-color: #ffcc00 !important; background: #332200 !important; }

        /* ===== WIN SCREEN ===== */
        .win-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000ee; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .win-overlay.hidden { display: none; }
        .result-text { font-size: 40px; font-weight: bold; margin-bottom: 10px; }
        .result-msg { color: #ccc; margin-bottom: 25px; text-align: center; font-size: 14px; }
        .win-overlay button { background: #667eea; color: #fff; border: none; padding: 12px 30px; border-radius: 25px; font-size: 15px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
<div class="container">
    
    <!-- ===== SELECTION SCREEN ===== -->
    <div class="select-screen" id="selectScreen">
        <div class="game-logo">
            <h1>⚔️ ANIME FIGHTER ⚔️</h1>
            <p>Rick & Morty + Anime Characters</p>
        </div>

        <div class="section-title">👤 CHỌN NHÂN VẬT CỦA BẠN</div>
        <div class="char-list" id="playerCharList"></div>

        <div class="section-title">🤖 CHỌN ĐỐI THỦ</div>
        <div class="char-list" id="enemyCharList"></div>
        <button class="random-btn" onclick="randomizeEnemy()">🎲 Đối thủ ngẫu nhiên</button>

        <div class="selection-summary">
            <div class="row"><span>👤 Bạn:</span><span class="highlight-green" id="summaryPlayer">Chưa chọn</span></div>
            <div class="row"><span>🎨 Skin:</span><span class="highlight-green" id="summaryPlayerSkin">-</span></div>
            <div class="row"><span>🤖 Đối thủ:</span><span class="highlight-red" id="summaryEnemy">Chưa chọn</span></div>
            <div class="row"><span>🎨 Skin:</span><span class="highlight-red" id="summaryEnemySkin">-</span></div>
        </div>

        <button class="fight-btn" id="fightButton" disabled onclick="startGame()">⚡ CHIẾN ĐẤU ⚡</button>
    </div>

    <!-- ===== GAME SCREEN ===== -->
    <div class="game-screen hidden" id="gameScreen">
        <div class="hud">
            <div class="hud-player">
                <div class="hud-name" id="hudPlayerName">Player</div>
                <div class="hp-bar"><div class="hp-fill green" id="playerHP" style="width:100%"></div></div>
                <div class="energy-bar"><div class="energy-fill" id="playerEnergy" style="width:0%"></div></div>
            </div>
            <div class="hud-center">
                <div class="timer" id="timerDisplay">60</div>
                <div class="round-info" id="roundDisplay">Round 1</div>
            </div>
            <div class="hud-enemy">
                <div class="hud-name" id="hudEnemyName">Enemy</div>
                <div class="hp-bar"><div class="hp-fill red" id="enemyHP" style="width:100%"></div></div>
                <div class="energy-bar"><div class="energy-fill" id="enemyEnergy" style="width:0%"></div></div>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <div class="dpad">
                <div></div><button id="btnUp">▲</button><div></div>
                <button id="btnLeft">◄</button><div></div><button id="btnRight">►</button>
                <div></div><button id="btnDown">▼</button><div></div>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
                <button class="btn-attack" id="btnPunch">👊 Đấm</button>
                <button class="btn-attack" id="btnKick">🦶 Đá</button>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
                <button class="btn-special" id="btnSpecial">💥 Chiêu</button>
                <button class="btn-special" id="btnUltimate">⭐ Tuyệt</button>
            </div>
        </div>
    </div>

    <!-- ===== WIN SCREEN ===== -->
    <div class="win-overlay hidden" id="winScreen">
        <div class="result-text" id="winText"></div>
        <div class="result-msg" id="winMessage"></div>
        <button onclick="playAgain()">🔄 Đấu lại</button>
        <button onclick="backToSelect()">👥 Chọn nhân vật khác</button>
    </div>

</div>

<script>
// ===== CHARACTER DATA =====
const characters = [
    {
        name: 'Rick Sanchez', universe: 'Rick & Morty', emoji: '🧪',
        skins: [
            { name: 'Blue Trắng', body: '#87CEEB', hair: '#B0C4DE' },
            { name: 'Pickle Rick', body: '#4CAF50', hair: '#2E7D32' },
            { name: 'Evil Rick', body: '#FF4444', hair: '#880000' }
        ],
        stats: { hp: 100, speed: 3.5, power: 110 }
    },
    {
        name: 'Morty Smith', universe: 'Rick & Morty', emoji: '😰',
        skins: [
            { name: 'Classic', body: '#FFD700', hair: '#8B4513' },
            { name: 'Evil Morty', body: '#FF0000', hair: '#8B0000' },
            { name: 'Robot Morty', body: '#808080', hair: '#C0C0C0' }
        ],
        stats: { hp: 90, speed: 3.8, power: 90 }
    },
    {
        name: 'Naruto Uzumaki', universe: 'Naruto', emoji: '🍥',
        skins: [
            { name: 'Classic', body: '#FF8C00', hair: '#FFD700' },
            { name: 'Sage Mode', body: '#FF4500', hair: '#FFD700' },
            { name: 'Hokage', body: '#FFFFFF', hair: '#FFD700' }
        ],
        stats: { hp: 110, speed: 4, power: 105 }
    },
    {
        name: 'Son Goku', universe: 'Dragon Ball', emoji: '⚡',
        skins: [
            { name: 'Classic', body: '#FF6600', hair: '#000000' },
            { name: 'Super Saiyan', body: '#FF6600', hair: '#FFD700' },
            { name: 'Ultra Instinct', body: '#FF6600', hair: '#C0C0C0' }
        ],
        stats: { hp: 120, speed: 4.5, power: 120 }
    },
    {
        name: 'Tanjiro', universe: 'Demon Slayer', emoji: '⚔️',
        skins: [
            { name: 'Slayer', body: '#2F4F4F', hair: '#8B0000' },
            { name: 'Hinokami', body: '#2F4F4F', hair: '#FF4500' },
            { name: 'Demon King', body: '#4A0000', hair: '#FF0000' }
        ],
        stats: { hp: 100, speed: 3.5, power: 100 }
    },
    {
        name: 'Saitama', universe: 'One Punch Man', emoji: '👊',
        skins: [
            { name: 'Hero', body: '#FFD700', hair: '#FFD700' },
            { name: 'Casual', body: '#FFFFFF', hair: '#FFD700' },
            { name: 'Serious', body: '#FF0000', hair: '#FFD700' }
        ],
        stats: { hp: 150, speed: 5, power: 150 }
    }
];

// ===== GAME STATE =====
let selectedPlayer = null, playerSkinIndex = 0;
let selectedEnemy = null, enemySkinIndex = 0;

let player = {}, enemy = {};
let gameRunning = false, gameTimer = 60, round = 1, playerWins = 0, enemyWins = 0;
let particles = [], hitEffects = [], screenShake = 0;
let timerInterval = null;
let buttonStates = {};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GROUND = 340, GRAVITY = 0.5;

// ===== BUILD SELECTION SCREEN =====
function buildSelectionScreen() {
    const playerList = document.getElementById('playerCharList');
    const enemyList = document.getElementById('enemyCharList');
    
    playerList.innerHTML = '';
    enemyList.innerHTML = '';
    
    characters.forEach((char, index) => {
        // Player card
        const playerCard = createCharCard(char, index, 'player');
        playerList.appendChild(playerCard);
        
        // Enemy card
        const enemyCard = createCharCard(char, index, 'enemy');
        enemyList.appendChild(enemyCard);
    });
}

function createCharCard(char, index, type) {
    const card = document.createElement('div');
    card.className = 'char-item';
    card.id = `${type}-card-${index}`;
    
    card.innerHTML = `
        <div class="char-avatar">${char.emoji}</div>
        <div class="char-details">
            <div class="name">${char.name}</div>
            <div class="universe">${char.universe}</div>
            <div class="stats">
                <span>❤️ ${char.stats.hp}</span>
                <span>💨 ${char.stats.speed}</span>
                <span>⚔️ ${char.stats.power}%</span>
            </div>
        </div>
        <div class="skin-options">
            ${char.skins.map((skin, si) => `
                <div class="skin-circle" 
                     style="background:${skin.body};" 
                     id="skin-${type}-${index}-${si}"
                     title="${skin.name}"></div>
            `).join('')}
            <div class="skin-label" id="skin-label-${type}-${index}">${char.skins[0].name}</div>
        </div>
    `;
    
    card.addEventListener('click', (e) => {
        // Check if clicking on skin
        const skinCircle = e.target.closest('.skin-circle');
        if (skinCircle) {
            e.stopPropagation();
            const si = parseInt(skinCircle.id.split('-')[3]);
            selectSkin(type, index, si);
            return;
        }
        selectCharacter(type, index);
    });
    
    return card;
}

function selectCharacter(type, index) {
    if (type === 'player') {
        selectedPlayer = index;
        playerSkinIndex = 0;
    } else {
        selectedEnemy = index;
        enemySkinIndex = 0;
    }
    updateSelectionUI();
}

function selectSkin(type, charIndex, skinIndex) {
    if (type === 'player' && selectedPlayer === charIndex) {
        playerSkinIndex = skinIndex;
    } else if (type === 'enemy' && selectedEnemy === charIndex) {
        enemySkinIndex = skinIndex;
    }
    updateSelectionUI();
}

function updateSelectionUI() {
    // Update card highlights
    document.querySelectorAll('#playerCharList .char-item').forEach((card, i) => {
        card.classList.toggle('selected', i === selectedPlayer);
    });
    document.querySelectorAll('#enemyCharList .char-item').forEach((card, i) => {
        card.classList.toggle('selected', i === selectedEnemy);
    });
    
    // Update skin dots
    document.querySelectorAll('.skin-circle').forEach(dot => dot.classList.remove('active'));
    
    if (selectedPlayer !== null) {
        const playerDot = document.getElementById(`skin-player-${selectedPlayer}-${playerSkinIndex}`);
        if (playerDot) playerDot.classList.add('active');
        const playerLabel = document.getElementById(`skin-label-player-${selectedPlayer}`);
        if (playerLabel) playerLabel.textContent = characters[selectedPlayer].skins[playerSkinIndex].name;
    }
    
    if (selectedEnemy !== null) {
        const enemyDot = document.getElementById(`skin-enemy-${selectedEnemy}-${enemySkinIndex}`);
        if (enemyDot) enemyDot.classList.add('active');
        const enemyLabel = document.getElementById(`skin-label-enemy-${selectedEnemy}`);
        if (enemyLabel) enemyLabel.textContent = characters[selectedEnemy].skins[enemySkinIndex].name;
    }
    
    // Update summary
    document.getElementById('summaryPlayer').textContent = selectedPlayer !== null ? characters[selectedPlayer].name : 'Chưa chọn';
    document.getElementById('summaryPlayerSkin').textContent = selectedPlayer !== null ? characters[selectedPlayer].skins[playerSkinIndex].name : '-';
    document.getElementById('summaryEnemy').textContent = selectedEnemy !== null ? characters[selectedEnemy].name : 'Chưa chọn';
    document.getElementById('summaryEnemySkin').textContent = selectedEnemy !== null ? characters[selectedEnemy].skins[enemySkinIndex].name : '-';
    
    // Enable/disable fight button
    document.getElementById('fightButton').disabled = (selectedPlayer === null || selectedEnemy === null);
}

function randomizeEnemy() {
    const available = characters.map((_, i) => i).filter(i => i !== selectedPlayer);
    if (available.length > 0) {
        const pick = available[Math.floor(Math.random() * available.length)];
        selectedEnemy = pick;
        enemySkinIndex = Math.floor(Math.random() * characters[pick].skins.length);
        updateSelectionUI();
    }
}

// ===== GAME FUNCTIONS =====
function resizeCanvas() {
    const width = Math.min(window.innerWidth, 420);
    canvas.width = width;
    canvas.height = width * 0.7;
}

function startGame() {
    if (selectedPlayer === null || selectedEnemy === null) return;
    
    document.getElementById('selectScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    document.getElementById('winScreen').classList.add('hidden');
    
    resizeCanvas();
    resetPlayers();
    
    gameRunning = true;
    gameTimer = 60;
    round = 1;
    playerWins = 0;
    enemyWins = 0;
    
    updateHUD();
    
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (gameRunning) {
            gameTimer--;
            document.getElementById('timerDisplay').textContent = gameTimer;
            if (gameTimer <= 0) endRound('timeout');
        }
    }, 1000);
    
    gameLoop();
}

function resetPlayers() {
    const pChar = characters[selectedPlayer];
    const eChar = characters[selectedEnemy];
    
    player = {
        x: 80, y: GROUND - 60, w: 35, h: 55,
        vx: 0, vy: 0, hp: pChar.stats.hp, maxHp: pChar.stats.hp,
        energy: 0, facing: 1, onGround: true,
        attacking: false, attackTimer: 0, attackType: '',
        invincible: 0
    };
    
    enemy = {
        x: canvas.width - 115, y: GROUND - 60, w: 35, h: 55,
        vx: 0, vy: 0, hp: eChar.stats.hp, maxHp: eChar.stats.hp,
        energy: 0, facing: -1, onGround: true,
        attacking: false, attackTimer: 0, attackType: '',
        invincible: 0, aiTimer: 0, aiCooldown: 0, aiAction: 'idle'
    };
    
    particles = [];
    hitEffects = [];
    screenShake = 0;
    
    document.getElementById('hudPlayerName').textContent = pChar.name;
    document.getElementById('hudEnemyName').textContent = eChar.name;
    document.getElementById('roundDisplay').textContent = `Round ${round}`;
    document.getElementById('timerDisplay').textContent = gameTimer;
}

function updateHUD() {
    document.getElementById('playerHP').style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
    document.getElementById('enemyHP').style.width = Math.max(0, enemy.hp / enemy.maxHp * 100) + '%';
    document.getElementById('playerEnergy').style.width = Math.min(100, player.energy) + '%';
    document.getElementById('enemyEnergy').style.width = Math.min(100, enemy.energy) + '%';
}

function endRound(result) {
    gameRunning = false;
    
    if (result === 'player_win' || result === 'enemy_dead') {
        playerWins++;
    } else if (result === 'enemy_win' || result === 'player_dead') {
        enemyWins++;
    }
    
    if (playerWins >= 2 || enemyWins >= 2) {
        // Match over
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('winScreen').classList.remove('hidden');
        
        if (playerWins >= 2) {
            document.getElementById('winText').textContent = '🏆 CHIẾN THẮNG!';
            document.getElementById('winText').style.color = '#00ff88';
            document.getElementById('winMessage').textContent = `${characters[selectedPlayer].name} đã đánh bại ${characters[selectedEnemy].name}!`;
        } else {
            document.getElementById('winText').textContent = '💀 THẤT BẠI';
            document.getElementById('winText').style.color = '#ff3366';
            document.getElementById('winMessage').textContent = `${characters[selectedEnemy].name} đã chiến thắng!`;
        }
    } else {
        // Next round
        setTimeout(() => {
            gameTimer = 60;
            resetPlayers();
            gameRunning = true;
            round++;
            updateHUD();
            document.getElementById('roundDisplay').textContent = `Round ${round}`;
            document.getElementById('timerDisplay').textContent = gameTimer;
        }, 1500);
    }
}

function playAgain() {
    document.getElementById('winScreen').classList.add('hidden');
    gameTimer = 60;
    round = 1;
    playerWins = 0;
    enemyWins = 0;
    resetPlayers();
    gameRunning = true;
    updateHUD();
    document.getElementById('roundDisplay').textContent = 'Round 1';
    document.getElementById('timerDisplay').textContent = gameTimer;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (gameRunning) {
            gameTimer--;
            document.getElementById('timerDisplay').textContent = gameTimer;
            if (gameTimer <= 0) endRound('timeout');
        }
    }, 1000);
    gameLoop();
}

function backToSelect() {
    document.getElementById('winScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('selectScreen').classList.remove('hidden');
    if (timerInterval) clearInterval(timerInterval);
    gameRunning = false;
}

// ===== INPUT HANDLING =====
function setupButton(id, key, action) {
    const btn = document.getElementById(id);
    if (!btn) return;
    
    buttonStates[key] = false;
    
    const press = (e) => {
        e.preventDefault();
        buttonStates[key] = true;
        if (action) action();
    };
    const release = (e) => {
        e.preventDefault();
        buttonStates[key] = false;
    };
    
    btn.addEventListener('touchstart', press, {passive: false});
    btn.addEventListener('touchend', release, {passive: false});
    btn.addEventListener('touchcancel', release, {passive: false});
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
}

setupButton('btnLeft', 'left');
setupButton('btnRight', 'right');
setupButton('btnUp', 'up', () => { if (player.onGround) { player.vy = -11; player.onGround = false; } });
setupButton('btnDown', 'down');
setupButton('btnPunch', 'punch', () => playerAttack('punch'));
setupButton('btnKick', 'kick', () => playerAttack('kick'));
setupButton('btnSpecial', 'special', () => playerAttack('special'));
setupButton('btnUltimate', 'ultimate', () => playerAttack('ultimate'));

function playerAttack(type) {
    if (!gameRunning || player.attacking) return;
    
    const costs = { punch: 0, kick: 0, special: 25, ultimate: 100 };
    if (player.energy < costs[type]) return;
    
    player.energy -= costs[type];
    player.attacking = true;
    player.attackType = type;
    player.attackTimer = { punch: 10, kick: 14, special: 20, ultimate: 30 }[type];
    
    setTimeout(() => {
        if (gameRunning && player.attacking && player.attackType === type) {
            checkHit(player, enemy, type, true);
        }
    }, type === 'ultimate' ? 400 : 200);
}

function checkHit(attacker, defender, type, isPlayer) {
    const dist = Math.abs(attacker.x - defender.x);
    const range = (type === 'special' || type === 'ultimate') ? 150 : 60;
    const correctDirection = attacker.facing === (defender.x > attacker.x ? 1 : -1);
    
    if (dist < range && correctDirection && defender.invincible <= 0) {
        const baseDamage = { punch: 15, kick: 22, special: 38, ultimate: 65 };
        const powerMult = isPlayer ? characters[selectedPlayer].stats.power / 100 : characters[selectedEnemy].stats.power / 100;
        const damage = Math.floor(baseDamage[type] * powerMult);
        
        defender.hp -= damage;
        defender.invincible = 15;
        defender.vy = -5;
        defender.vx = defender.facing * -3;
        screenShake = type === 'ultimate' ? 15 : 6;
        
        // Particles
        for (let i = 0; i < (type === 'ultimate' ? 25 : 10); i++) {
            particles.push({
                x: defender.x + defender.w / 2,
                y: defender.y + defender.h / 2,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 20 + Math.random() * 20,
                color: type === 'ultimate' ? '#ffd700' : '#ff6600'
            });
        }
        
        // Hit text
        const moveNames = ['punch', 'kick', 'special', 'ultimate'];
        hitEffects.push({
            x: defender.x,
            y: defender.y - 20,
            text: `-${damage}`,
            life: 35,
            color: type === 'ultimate' ? '#ffd700' : '#ffffff'
        });
        
        updateHUD();
        
        if (defender.hp <= 0) {
            defender.hp = 0;
            updateHUD();
            endRound(isPlayer ? 'player_win' : 'enemy_win');
        }
    }
}

// ===== AI =====
function updateAI() {
    if (!gameRunning || enemy.attacking) return;
    
    enemy.aiTimer++;
    if (enemy.aiCooldown > 0) {
        enemy.aiCooldown--;
        return;
    }
    
    const dist = player.x - enemy.x;
    const absDist = Math.abs(dist);
    
    if (absDist > 200) {
        enemy.vx = dist > 0 ? 2.5 : -2.5;
    } else if (absDist < 55) {
        if (Math.random() < 0.6) {
            const attacks = ['punch', 'kick'];
            if (enemy.energy >= 25) attacks.push('special');
            if (enemy.energy >= 100) attacks.push('ultimate');
            enemyAttack(attacks[Math.floor(Math.random() * attacks.length)]);
        } else {
            enemy.vx = dist > 0 ? -3 : 3;
        }
    } else {
        if (Math.random() < 0.03 && enemy.energy >= 20) {
            const attacks = ['punch', 'kick', 'special'];
            if (enemy.energy >= 100) attacks.push('ultimate');
            enemyAttack(attacks[Math.floor(Math.random() * attacks.length)]);
        }
        enemy.vx *= 0.9;
    }
    
    if (player.y < enemy.y - 30 && enemy.onGround && Math.random() < 0.02) {
        enemy.vy = -10;
        enemy.onGround = false;
    }
    
    enemy.aiCooldown = 20 + Math.random() * 30;
}

function enemyAttack(type) {
    if (enemy.attacking) return;
    
    const costs = { punch: 0, kick: 0, special: 25, ultimate: 100 };
    if (enemy.energy < costs[type]) return;
    
    enemy.energy -= costs[type];
    enemy.attacking = true;
    enemy.attackType = type;
    enemy.attackTimer = { punch: 10, kick: 14, special: 20, ultimate: 30 }[type];
    
    setTimeout(() => {
        if (gameRunning && enemy.attacking && enemy.attackType === type) {
            checkHit(enemy, player, type, false);
        }
    }, type === 'ultimate' ? 400 : 200);
}

// ===== GAME LOOP =====
function gameLoop() {
    if (!gameRunning) {
        requestAnimationFrame(gameLoop);
        return;
    }

    const speed = characters[selectedPlayer].stats.speed;
    if (buttonStates['left']) player.vx = -speed;
    else if (buttonStates['right']) player.vx = speed;

            p.onGround = true;
