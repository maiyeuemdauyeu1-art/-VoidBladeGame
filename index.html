<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Android Cloud</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#111;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#phone{
    width:min(100vw,430px);
    height:min(100vh,850px);
    position:relative;
    overflow:hidden;
    color:#fff;
    background:
        radial-gradient(circle at 15% 15%,#527d7d 0%,transparent 30%),
        radial-gradient(circle at 85% 40%,#27675f 0%,transparent 35%),
        linear-gradient(145deg,#203f3f,#102e2e 45%,#071818);
}

/* THANH TRẠNG THÁI */

#status{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:32px;
    padding:0 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;
    font-size:11px;
    font-weight:bold;
}

#camera{
    position:absolute;
    top:7px;
    left:50%;
    transform:translateX(-50%);
    width:85px;
    height:22px;
    background:#080808;
    border-radius:20px;
    z-index:1100;
}

/* MÀN HÌNH CHÍNH */

#home{
    position:absolute;
    inset:0;
    padding:48px 17px 145px;
    overflow-y:auto;
    scrollbar-width:none;
}

#home::-webkit-scrollbar{
    display:none;
}

/* TÌM KIẾM */

.search{
    height:47px;
    border-radius:25px;
    background:rgba(255,255,255,.93);
    display:flex;
    align-items:center;
    padding:0 15px;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.google{
    font-size:25px;
    font-weight:bold;
    background:linear-gradient(
        90deg,
        #4285f4,
        #34a853,
        #fbbc05,
        #ea4335
    );
    -webkit-background-clip:text;
    color:transparent;
}

.searchText{
    margin-left:10px;
    color:#777;
    font-size:14px;
}

.mic{
    margin-left:auto;
}

/* ỨNG DỤNG */

#apps{
    margin-top:27px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:22px 8px;
}

.app{
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:.12s;
}

.app:active{
    transform:scale(.84);
}

.icon{
    width:51px;
    height:51px;
    margin:auto;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    box-shadow:0 3px 8px rgba(0,0,0,.35);
    overflow:hidden;
}

.icon svg{
    width:100%;
    height:100%;
}

.name{
    margin-top:5px;
    font-size:9px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:0 1px 4px #000;
}

/* THANH CLOUD */

#cloud{
    position:absolute;
    left:12px;
    right:12px;
    bottom:68px;
    height:58px;
    z-index:700;
    border-radius:18px;
    background:rgba(10,15,20,.72);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 10px;
}

.cloudLeft{
    display:flex;
    align-items:center;
    gap:9px;
}

.cloudIcon{
    width:40px;
    height:40px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#16a8ff,#5552ff);
    font-size:20px;
}

.cloudTitle{
    font-size:11px;
    font-weight:bold;
}

.cloudState{
    margin-top:3px;
    font-size:9px;
    color:#55ff92;
}

#afk{
    border:0;
    padding:10px 13px;
    border-radius:20px;
    background:linear-gradient(135deg,#1687ff,#664cff);
    color:#fff;
    font-size:10px;
    font-weight:bold;
}

/* THANH ĐIỀU HƯỚNG */

#nav{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:58px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:60px;
    background:rgba(0,0,0,.25);
    z-index:800;
}

.navButton{
    border:0;
    background:none;
    color:#fff;
    font-size:27px;
    width:40px;
    height:40px;
}

.homeCircle{
    width:23px;
    height:23px;
    border:2px solid white;
    border-radius:50%;
}

/* CỬA SỔ ỨNG DỤNG */

#application{
    position:absolute;
    inset:0;
    z-index:900;
    display:none;
    background:#10202a;
    overflow:hidden;
}

.appHeader{
    height:60px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
    background:rgba(0,0,0,.35);
    border-bottom:1px solid rgba(255,255,255,.1);
}

.back{
    border:0;
    background:none;
    color:white;
    font-size:30px;
}

.appHeaderIcon{
    width:35px;
    height:35px;
    border-radius:10px;
}

.appHeaderTitle{
    font-size:17px;
    font-weight:bold;
}

.content{
    padding:18px;
}

.card{
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.12);
    margin-bottom:14px;
}

/* TRÌNH DUYỆT */

.browser{
    position:absolute;
    inset:0;
    background:#eef4fc;
    color:#333;
    overflow:hidden;
}

/* TAB */

.browserTabs{
    height:57px;
    background:#dce1e8;
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 9px;
}

.browserTab{
    height:48px;
    width:220px;
    max-width:70%;
    background:#fff;
    border-radius:17px 17px 0 0;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    font-size:13px;
    box-shadow:0 -1px 4px rgba(0,0,0,.08);
}

.browserTabTitle{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.browserNewTab{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:transparent;
    font-size:28px;
    color:#555;
}

/* THANH ĐỊA CHỈ */

.browserToolbar{
    height:65px;
    background:#fff;
    display:flex;
    align-items:center;
    gap:3px;
    padding:7px;
    border-bottom:1px solid #d7d7d7;
}

.browserTool{
    width:34px;
    height:45px;
    border:0;
    background:transparent;
    color:#666;
    font-size:25px;
    flex-shrink:0;
}

.browserAddress{
    flex:1;
    height:45px;
    border-radius:24px;
    background:#edf2f8;
    display:flex;
    align-items:center;
    padding:0 12px;
    gap:7px;
    min-width:0;
}

.browserAddress input{
    width:100%;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    font-size:12px;
    color:#333;
}

/* TRANG CHỦ TRÌNH DUYỆT */

.browserHome{
    position:absolute;
    top:122px;
    left:0;
    right:0;
    bottom:0;
    overflow-y:auto;
    padding:18px 18px 50px;
}

.browserTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.editButton{
    width:44px;
    height:44px;
    border:0;
    border-radius:14px;
    background:#fff;
    color:#1683ff;
    font-size:21px;
}

.browserAccount{
    width:43px;
    height:43px;
    border-radius:50%;
    background:#078bd1;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* LOGO */

.googleLogo{
    text-align:center;
    margin-top:55px;
    margin-bottom:28px;
    font-size:55px;
    font-weight:bold;
    letter-spacing:-4px;
}

.gBlue{color:#4285f4}
.gRed{color:#ea4335}
.gYellow{color:#fbbc05}
.gGreen{color:#34a853}

/* Ô TÌM KIẾM */

.googleSearch{
    width:min(100%,650px);
    height:58px;
    margin:auto;
    padding:0 18px;
    border-radius:30px;
    background:#d9e4f7;
    display:flex;
    align-items:center;
    gap:11px;
}

.googleSearch input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    font-size:15px;
    color:#333;
}

.googleSearchIcon{
    font-size:20px;
}

/* LỐI TẮT */

.browserShortcuts{
    width:min(100%,680px);
    margin:30px auto 18px;
    padding:17px;
    border-radius:23px;
    background:rgba(255,255,255,.96);
    display:flex;
    gap:19px;
    overflow-x:auto;
    scrollbar-width:none;
}

.browserShortcuts::-webkit-scrollbar{
    display:none;
}

.browserShortcut{
    min-width:70px;
    text-align:center;
    color:#666;
    font-size:11px;
}

.shortcutIcon{
    width:50px;
    height:50px;
    margin:auto auto 8px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:bold;
}

.sGray{
    background:#888;
    color:#fff;
}

.sGreen{
    background:#eafff2;
    color:#21a861;
}

.sRed{
    background:#ffeaea;
    color:#e33;
}

.sBlue{
    background:#326af4;
    color:#fff;
}

.sAdd{
    background:#e4efff;
    color:#087ff5;
    font-size:29px;
}

/* KHU VỰC LỐI TẮT */

.browserSection{
    width:min(100%,680px);
    margin:18px auto;
    padding:20px;
    border-radius:23px;
    background:#fff;
}

.browserSection h3{
    margin:0 0 18px;
    font-size:16px;
}

.quickGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.quickItem{
    text-align:center;
    color:#666;
    font-size:11px;
}

.quickIcon{
    width:54px;
    height:54px;
    margin:auto auto 8px;
    border-radius:16px;
    background:#e5efff;
    color:#087ff5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
}

/* THÔNG BÁO */

#toast{
    display:none;
    position:absolute;
    left:50%;
    bottom:145px;
    transform:translateX(-50%);
    padding:11px 18px;
    border-radius:25px;
    background:rgba(0,0,0,.86);
    font-size:12px;
    z-index:2000;
    white-space:nowrap;
}

/* MÀN HÌNH NHỎ */

@media(max-width:600px){

    .browserTool{
        width:29px;
        font-size:22px;
    }

    .browserToolbar{
        padding:5px;
    }

    .browserAddress{
        padding:0 8px;
    }

    .browserAddress input{
        font-size:11px;
    }

    .googleLogo{
        font-size:51px;
        margin-top:55px;
    }

    .quickGrid{
        gap:8px;
    }
}
</style>
</head>

<script>

/* =========================

   ========================= */

let currentApp=false;
let afk=false;


/* =========================

   ========================= */

function updateTime(){

    const now=new Date();

    const h=String(
        now.getHours()
    ).padStart(2,"0");

    const m=String(
        now.getMinutes()
    ).padStart(2,"0");

    document.getElementById(
        "time"
    ).textContent=h+":"+m;
}

updateTime();

setInterval(
    updateTime,
    1000
);


/* =========================
   MỞ ỨNG DỤNG THƯỜNG
   ========================= */

function openApp(name,color){

    currentApp=true;

    const application=
        document.getElementById(
            "application"
        );

    application.style.display="block";

    application.innerHTML=`

        <div class="appHeader">

                style="background:${color}">

}


/* =========================
   MỞ TRÌNH DUYỆT
   ========================= */

function openBrowser(){

    currentApp=true;

    const application=
        document.getElementById(
            "application"
        );

    application.style.display="block";

    application.innerHTML=`

        <div class="browser">

            <!-- TAB -->

            <div class="browserTabs">

                <div class="browserTab">

                    <span>🌐</span>

                    <span
                        class="browserTabTitle">
                        Thẻ mới
                    </span>

                    <span>×</span>

                </div>

                <button
                    class="browserNewTab">
                    +
                </button>

            </div>


            <!-- THANH CÔNG CỤ -->

            <div class="browserToolbar">

                <button
                    class="browserTool"
                    onclick="browserBack()">
                    ‹
                </button>

                <button
                    class="browserTool"
                    onclick="browserForward()">
                    ›
                </button>

                <button
                    class="browserTool"
                    onclick="browserReload()">
                    ↻
                </button>


                <div class="browserAddress">

                    <span>🔒</span>

                    <input
                        id="addressInput"
                        placeholder="Tìm trên Google hoặc nhập URL"
                        onkeydown="browserSearch(event)"
                    >

                </div>


                <button
                    class="browserTool">
                    ⇧
                </button>

                <button
                    class="browserTool">
                    ▢
                </button>

                <button
                    class="browserTool">
                    •••
                </button>

            </div>


            <!-- TRANG MỚI -->

            <div class="browserHome">

                <div class="browserTop">

                    <button
                        class="editButton">
                        ✎
                    </button>

                    <div
                        class="browserAccount">
                        L
                    </div>

                </div>


                <!-- GOOGLE -->

                <div class="googleLogo">

                    <span class="gBlue">
                        G
                    </span>

                    <span class="gRed">
                        o
                    </span>

                    <span class="gYellow">
                        o
                    </span>

                    <span class="gBlue">
                        g
                    </span>

                    <span class="gGreen">
                        l
                    </span>

                    <span class="gRed">
                        e
                    </span>

                </div>


                <!-- Ô TÌM KIẾM -->

                <div class="googleSearch">

                    <span class="googleSearchIcon">
                        🔍
                    </span>

                    <input
                        id="googleInput"
                        placeholder="Tìm trên Google hoặc nhập URL"
                        onkeydown="browserSearch(event)"
                    >

                    <span>
                        🎙
                    </span>

                </div>


                <!-- LỐI TẮT -->

                <div class="browserShortcuts">


                    <div class="browserShortcut">

                        <div class="shortcutIcon sGray">
                            U
                        </div>

                        FF Beta

                    </div>


                    <div class="browserShortcut">

                        Đăng nhập

                    </div>

                </div>


                <!-- KHÁM PHÁ -->

                <div class="browserSection">

                    <h3>
                        Khám phá

                    <p>
                        Nội dung đề xuất
                        sẽ xuất hiện ở đây.
                    </p>

                </div>

            </div>

        </div>
    `;
}


/* =========================
   TÌM KIẾM TRÌNH DUYỆT
   ========================= */

function browserSearch(event){

    if(event.key!=="Enter"){
        return;
    }

    const value=
        event.target.value.trim();

    if(!value){
        return;
    }

    let url;

    if(
        value.startsWith("http://") ||
        value.startsWith("https://")
    ){

        url=value;

    }else if(
        value.includes(".") &&
        !value.includes(" ")
    ){

        url="https://"+value;

    }else{

        url=
        "https://www.google.com/search?q="+
        encodeURIComponent(value);

    }

    window.open(
        url,
        "_blank"
    );
}


/* =========================
   NÚT TRÌNH DUYỆT
   ========================= */

function browserBack(){

    showToast(
        "Quay lại"
    );
}

function browserForward(){

    showToast(
        "Tiến tới"
    );
}

function browserReload(){

    showToast(
        "Đã làm mới"
    );
}


/* =========================
   QUAY LẠI
   ========================= */

function goBack(){

    if(currentApp){

        document.getElementById(
            "application"
        ).style.display="none";

        document.getElementById(
            "application"
        ).innerHTML="";

        currentApp=false;

    }else{

        showToast(
            "Đang ở màn hình chính"
        );
    }
}


/* =========================
   TRANG CHỦ
   ========================= */

function goHome(){

    document.getElementById(
        "application"
    ).style.display="none";

    document.getElementById(
        "application"
    ).innerHTML="";

    currentApp=false;
}


/* =========================
   CHẾ ĐỘ TREO
   ========================= */

function toggleAFK(){

    afk=!afk;

    const button=
        document.getElementById(
            "afk"
        );

    const state=
        document.getElementById(
            "cloudState"
        );


    if(afk){

        button.textContent=
            "TẮT TREO";

        state.textContent=
            "● Đang treo";

        state.style.color=
            "#00e5ff";

        showToast(
            "Đã bật chế độ treo"
        );

    }else{

        button.textContent=
            "BẬT TREO";

        state.textContent=
            "● Đang hoạt động";

        state.style.color=
            "#55ff92";

        showToast(
            "Đã tắt chế độ treo"
        );
    }
}


/* =========================
   THÔNG BÁO
   ========================= */

function showToast(text){

    const toast=
        document.getElementById(
            "toast"
        );

    toast.textContent=text;

    toast.style.display="block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer=
        setTimeout(
            function(){

                toast.style.display=
                    "none";

            },
            1800
        );
}

</script>
