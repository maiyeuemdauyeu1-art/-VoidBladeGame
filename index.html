<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DDTH Đám Mây</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  color:#fff;
}

#phone{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 15%,#24395f 0,#16243b 25%,transparent 50%),
    linear-gradient(145deg,#101827,#050912 70%,#111a2b);
}

/* Thanh trạng thái */
#status{
  position:absolute;
  z-index:100;
  top:0;
  left:0;
  right:0;
  height:34px;
  padding:0 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:13px;
}

/* Màn hình chính */
#home{
  position:absolute;
  top:34px;
  left:0;
  right:0;
  bottom:68px;
  overflow:hidden;
}

.page{
  width:100%;
  height:100%;
  padding:22px 18px;
  overflow-y:auto;
}

.brand{
  text-align:center;
  font-size:29px;
  font-weight:bold;
  margin:12px 0 5px;
}

.subtitle{
  text-align:center;
  color:#aebbd0;
  font-size:12px;
  margin-bottom:28px;
}

/* Tất cả ứng dụng */
.apps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:27px 12px;
}

.app{
  text-align:center;
  cursor:pointer;
}

.icon{
  width:64px;
  height:64px;
  margin:auto;
  border-radius:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
  background:rgba(35,47,66,.95);
  box-shadow:
    0 8px 18px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.12);
  transition:transform .12s;
}

.app:active .icon{
  transform:scale(.88);
}

.app-name{
  display:block;
  margin-top:7px;
  font-size:12px;
  color:#f0f2f5;
}

/* Thanh điều hướng */
#navigation{
  position:absolute;
  z-index:110;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:70px;
  background:rgba(10,14,22,.9);
  backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.05);
}

.nav-btn{
  width:45px;
  height:45px;
  border:0;
  background:transparent;
  color:white;
  font-size:25px;
  border-radius:50%;
}

.home-button{
  width:43px;
  height:43px;
  border:2px solid #bfc5cf;
  border-radius:50%;
}

/* Thông báo */
#notificationShade{
  position:absolute;
  z-index:200;
  top:0;
  left:0;
  right:0;
  height:0;
  overflow:hidden;
  background:rgba(15,20,30,.96);
  backdrop-filter:blur(25px);
  transition:height .25s;
}

#notificationShade.open{
  height:75%;
}

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:25px 16px;
}

.quick button{
  height:58px;
  border:0;
  border-radius:18px;
  background:#26354b;
  color:#fff;
  font-size:12px;
}

/* Cửa sổ ứng dụng */
#appWindow{
  position:absolute;
  z-index:150;
  inset:0;
  display:none;
  background:#080c13;
}

#appWindow.show{
  display:block;
}

.appbar{
  height:58px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 13px;
  background:#171e2a;
  border-bottom:1px solid #303846;
}

.back{
  border:0;
  background:transparent;
  color:#fff;
  font-size:31px;
}

.app-content{
  height:calc(100% - 58px);
  overflow:auto;
  padding:20px;
}

.card{
  background:#1b2432;
  border-radius:17px;
  padding:18px;
  margin-bottom:12px;
}

.card button{
  border:0;
  border-radius:10px;
  background:#4285f4;
  color:#fff;
  padding:10px 15px;
}

/* Hiệu ứng chuyển */
#home,
#appWindow{
  transition:transform .2s,opacity .2s;
}
</style>
</head>

<body>

<div id="phone">

<!-- Thanh trạng thái -->
<div id="status">
  <span id="time">00:00</span>
  <span>▰　▰　100%</span>
</div>

<!-- Màn hình DDTH Đám Mây -->
<div id="home">

  <div class="page">

    <div class="brand">☁ DDTH Đám Mây</div>

    <div class="subtitle">
      Điện thoại mô phỏng
    </div>

    <div class="apps">

      <div class="app" onclick="openApp('Google','🔎')">
        <div class="icon">🔎</div>
        <span class="app-name">Google</span>
      </div>

      <div class="app" onclick="openApp('Trình duyệt','🌐')">
        <div class="icon">🌐</div>
        <span class="app-name">Trình duyệt</span>
      </div>

      <div class="app" onclick="openApp('Game','🎮')">
        <div class="icon">🎮</div>
        <span class="app-name">Game</span>
      </div>

      <div class="app" onclick="openApp('Tệp','📁')">
        <div class="icon">📁</div>
        <span class="app-name">Tệp</span>
      </div>

      <div class="app" onclick="openApp('Máy tính','🧮')">
        <div class="icon">🧮</div>
        <span class="app-name">Máy tính</span>
      </div>

      <div class="app" onclick="openApp('Ghi chú','📝')">
        <div class="icon">📝</div>
        <span class="app-name">Ghi chú</span>
      </div>

      <div class="app" onclick="openApp('Cửa hàng','🛍️')">
        <div class="icon">🛍️</div>
        <span class="app-name">Cửa hàng</span>
      </div>

      <div class="app" onclick="openApp('Cài đặt','⚙️')">
        <div class="icon">⚙️</div>
        <span class="app-name">Cài đặt</span>
      </div>

      <div class="app" onclick="openApp('Ảnh','🖼️')">
        <div class="icon">🖼️</div>
        <span class="app-name">Ảnh</span>
      </div>

      <div class="app" onclick="openApp('Camera','📷')">
        <div class="icon">📷</div>
        <span class="app-name">Camera</span>
      </div>

      <div class="app" onclick="openApp('Tin nhắn','💬')">
        <div class="icon">💬</div>
        <span class="app-name">Tin nhắn</span>
      </div>

      <div class="app" onclick="openApp('Điện thoại','☎️')">
        <div class="icon">☎️</div>
        <span class="app-name">Điện thoại</span>
      </div>

    </div>

  </div>

</div>

<!-- Màn hình thông báo -->
<div id="notificationShade">
  <div class="quick">
    <button onclick="toggleQuick()">Wi-Fi<br>Đang bật</button>
    <button onclick="toggleQuick()">Bluetooth<br>Đang bật</button>
    <button onclick="toggleQuick()">Âm thanh<br>Đang bật</button>
    <button onclick="toggleQuick()">Xoay màn hình<br>Tự động</button>
  </div>
</div>

<!-- Cửa sổ ứng dụng -->
<div id="appWindow">

  <div class="appbar">
    <button class="back" onclick="closeApp()">‹</button>
    <span id="appIcon" style="font-size:25px">☁</span>
    <strong id="appTitle">Ứng dụng</strong>
  </div>

  <div class="app-content" id="appContent"></div>

</div>

<!-- Thanh điều hướng -->
<div id="navigation">

  <button class="nav-btn" onclick="showRecent()">▢</button>

  <button class="nav-btn home-button" onclick="closeApp()"></button>

  <button class="nav-btn" onclick="closeApp()">‹</button>

</div>

</div>

<script>

/* Đồng hồ */
function updateTime(){

  const now=new Date();

  document.getElementById("time").textContent=
    now.toLocaleTimeString("vi-VN",{
      hour:"2-digit",
      minute:"2-digit"
    });
}

setInterval(updateTime,1000);
updateTime();


/* Mở ứng dụng */
function openApp(name,icon){

  document.getElementById("appTitle").textContent=name;
  document.getElementById("appIcon").textContent=icon;

  const content=document.getElementById("appContent");

  content.innerHTML=`
    <div class="card">
      <h2>${name}</h2>
      <p>Ứng dụng đang chạy trong DDTH Đám Mây.</p>
    </div>
  `;

  document.getElementById("appWindow")
    .classList.add("show");
}


/* Đóng ứng dụng */
function closeApp(){

  document.getElementById("appWindow")
    .classList.remove("show");
}


/* Nút ứng dụng gần đây */
function showRecent(){

  const content=document.getElementById("appContent");

  document.getElementById("appTitle").textContent=
    "Ứng dụng gần đây";

  document.getElementById("appIcon").textContent="▢";

  content.innerHTML=`
    <div class="card">
      <h3>DDTH Đám Mây</h3>
      <p>Các ứng dụng gần đây sẽ xuất hiện tại đây.</p>
    </div>
  `;

  document.getElementById("appWindow")
    .classList.add("show");
}


/* Thanh thông báo */
let quickOpen=false;

function toggleQuick(){

  quickOpen=!quickOpen;

  document.getElementById("notificationShade")
    .classList.toggle("open",quickOpen);
}


/* Vuốt từ phía trên xuống để mở bảng nhanh */
let startY=0;

document.addEventListener("touchstart",e=>{
  if(e.touches.length===1)
    startY=e.touches[0].clientY;
},{passive:true});

document.addEventListener("touchend",e=>{

  if(!e.changedTouches.length)return;

  const endY=e.changedTouches[0].clientY;

  if(endY-startY>90 && startY<70){
    toggleQuick();
  }

  if(startY<70 && startY-endY>90){
    quickOpen=false;
    document.getElementById("notificationShade")
      .classList.remove("open");
  }

},{passive:true});


/* Vuốt ngang màn hình chính */
let sx=0;
let sy=0;

document.getElementById("home").addEventListener("touchstart",e=>{
  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;
},{passive:true});

document.getElementById("home").addEventListener("touchend",e=>{

  const dx=e.changedTouches[0].clientX-sx;
  const dy=e.changedTouches[0].clientY-sy;

  if(Math.abs(dx)>90 && Math.abs(dx)>Math.abs(dy)){

    if(dx<0){
      document.querySelector(".brand").textContent=
        "☁ Ứng dụng";
    }else{
      document.querySelector(".brand").textContent=
        "☁ DDTH Đám Mây";
    }
  }

},{passive:true});


/* Lưu vị trí màn hình */
localStorage.setItem(
  "DDTH_DAM_MAY",
  "đang hoạt động"
);

</script>

</body>
</html>
