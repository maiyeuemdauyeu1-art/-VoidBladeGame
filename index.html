<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MUGEN FIGHTER</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;font-family:Arial;overflow:hidden;touch-action:manipulation;user-select:none}
        
        #selectScreen{width:100vw;height:100vh;background:linear-gradient(180deg,#0a0a1a,#1a0a2e,#0a0a1a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
        #selectScreen.hidden{display:none}
        
        .title{font-size:2em;color:#ffcc00;font-weight:bold;text-shadow:0 0 30px #ffcc00;text-align:center}
        
        .section{width:95%;max-width:500px}
        .section-label{color:#00ff88;font-weight:bold;font-size:1em;margin-bottom:5px;text-align:center}
        .section-label.enemy{color:#ff4444}
        
        .char-row{display:flex;gap:6px;overflow-x:auto;padding:5px}
        .char-box{min-width:85px;background:#1a1a35;border:3px solid #333;border-radius:10px;padding:8px;text-align:center;cursor:pointer;transition:0.3s;flex-shrink:0}
        .char-box.sel-p{border-color:#00ff88!important;background:#003322!important;box-shadow:0 0 15px #00ff88}
        .char-box.sel-e{border-color:#ff4444!important;background:#330000!important;box-shadow:0 0 15px #ff4444}
        
        .char-portrait{width:65px;height:65px;border-radius:10px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:2.2em;background:#0003;border:2px solid #444}
        .char-name{color:#fff;font-weight:bold;font-size:0.7em}
        
        .skin-area{display:flex;gap:3px;justify-content:center;margin-top:4px;flex-wrap:wrap}
        .skin-btn{width:18px;height:18px;border-radius:4px;border:2px solid #555;cursor:pointer}
        .skin-btn.active{border-color:#fff!important;box-shadow:0 0 6px #fff}
        .skin-label{font-size:0.5em;color:#aaa;text-align:center;margin-top:2px}
        
        .vs-display{display:flex;align-items:center;gap:15px;color:#fff;font-size:1em}
        .vs-display .p{color:#00ff88;font-weight:bold}
        .vs-display .e{color:#ff4444;font-weight:bold}
        .vs-display .vs{font-size:1.5em;color:#ffcc00;font-weight:bold}
        
        .fight-btn{padding:12px 40px;background:linear-gradient(135deg,#ff4400,#ffaa00);color:#fff;border:none;border-radius:25px;font-size:1.2em;font-weight:bold;cursor:pointer;letter-spacing:2px}
        .fight-btn:disabled{background:#444;color:#888}
        .fight-btn:active:not(:disabled){transform:scale(0.95)}
        
        #gameScreen{width:100vw;height:100vh;position:relative;display:none}
        #gameScreen.active{display:block}
        
        #hud{position:absolute;top:5px;left:5px;right:5px;display:flex;justify-content:space-between;z-index:10;pointer-events:none;background:rgba(0,0,0,0.5);border-radius:10px;padding:5px}
        .hud-side{width:38%}
        .hud-right{text-align:right}
        .hud-name{color:#fff;font-size:0.7em;font-weight:bold}
        .hp-bar{height:15px;background:#333;border-radius:7px;overflow:hidden;margin:2px 0;border:1px solid #555}
        .hp-fill{height:100%;transition:0.3s}
        .hp-p1{background:linear-gradient(90deg,#00ff88,#008844)}
        .hp-p2{background:linear-gradient(90deg,#ff4444,#880000)}
        .en-bar{height:7px;background:#222;border-radius:3px;overflow:hidden}
        .en-fill{height:100%;background:linear-gradient(90deg,#ffcc00,#ff8800);transition:0.3s}
        .hud-center{text-align:center;color:#fff}
        .hud-timer{font-size:1.5em;font-weight:bold;color:#ffcc00}
        
        canvas{display:block;width:100%;height:100%}
        
        #controls{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
        #controls button{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);background:rgba(0,0,0,0.7);color:#fff;font-size:1em;cursor:pointer;display:flex;align-items:center;justify-content:center}
        #controls button:active{background:rgba(255,255,255,0.3)}
        #controls .atk{border-color:#ff4444;background:rgba(255,0,0,0.3)}
        #controls .sp{border-color:#ffcc00;background:rgba(255,170,0,0.3)}
    </style>
</head>
<body>

<div id="selectScreen">
    <div class="title">⚔️ ANIME MUGEN ⚔️</div>
    
    <div class="section">
        <div class="section-label">👤 CHỌN NHÂN VẬT</div>
        <div class="char-row" id="playerRow"></div>
    </div>
    
    <div class="section">
        <div class="section-label enemy">🤖 ĐỐI THỦ</div>
        <div class="char-row" id="enemyRow"></div>
    </div>
    
    <div class="vs-display">
        <span class="p" id="pName">-</span>
        <span class="vs">VS</span>
        <span class="e" id="eName">-</span>
    </div>
    
    <button class="fight-btn" id="fightBtn" disabled onclick="startGame()">⚡ CHIẾN ĐẤU ⚡</button>
</div>

<div id="gameScreen">
    <div id="hud">
        <div class="hud-side">
            <div class="hud-name" id="hudP1">P1</div>
            <div class="hp-bar"><div class="hp-fill hp-p1" id="hp1" style="width:100%"></div></div>
            <div class="en-bar"><div class="en-fill" id="en1" style="width:0%"></div></div>
        </div>
        <div class="hud-center">
            <div class="hud-timer" id="timer">99</div>
            <div id="round" style="font-size:0.6em;color:#aaa">Round 1</div>
        </div>
        <div class="hud-side hud-right">
            <div class="hud-name" id="hudP2">P2</div>
            <div class="hp-bar"><div class="hp-fill hp-p2" id="hp2" style="width:100%"></div></div>
            <div class="en-bar"><div class="en-fill" id="en2" style="width:0%"></div></div>
        </div>
    </div>
    <canvas id="gc"></canvas>
    <div id="controls">
        <button id="bL">◄</button>
        <button id="bU">▲</button>
        <button id="bR">►</button>
        <button class="atk" id="bP">👊</button>
        <button class="atk" id="bK">🦶</button>
        <button class="sp" id="bS1">💥</button>
        <button class="sp" id="bS2">⚡</button>
        <button class="sp" id="bUL">🌀</button>
    </div>
</div>

<script>
const R=[
    {n:'Rick Sanchez',u:'Rick & Morty',e:'🧪',sk:[{n:'Blue Trắng',b:'#87CEEB',h:'#B0C4DE',ef:'#4488ff'},{n:'Pickle Rick',b:'#4CAF50',h:'#2E7D32',ef:'#44ff44'},{n:'Evil Rick',b:'#FF4444',h:'#880000',ef:'#ff4444'}],st:{hp:1000,sp:5,jp:12},mv:{p:{n:'Portal Punch',d:80},k:{n:'Gravity Kick',d:120},s1:{n:'PORTAL GUN',d:200,c:30},s2:{n:'LASER CANNON',d:280,c:50},ul:{n:'MULTIVERSE',d:500,c:100}}},
    {n:'Morty Smith',u:'Rick & Morty',e:'😰',sk:[{n:'Classic',b:'#FFD700',h:'#8B4513',ef:'#ffaa00'},{n:'Evil Morty',b:'#FF0000',h:'#8B0000',ef:'#ff0000'},{n:'Robot',b:'#808080',h:'#C0C0C0',ef:'#cccccc'}],st:{hp:900,sp:5.5,jp:13},mv:{p:{n:'Nervous Punch',d:60},k:{n:'Panic Kick',d:100},s1:{n:'LASER PISTOL',d:180,c:25},s2:{n:'ARMOTHY',d:250,c:45},ul:{n:'PURGE SUIT',d:450,c:100}}},
    {n:'Naruto',u:'Naruto',e:'🍥',sk:[{n:'Classic',b:'#FF8C00',h:'#FFD700',ef:'#ff8800'},{n:'Sage Mode',b:'#FF4500',h:'#FFD700',ef:'#ff4400'},{n:'Hokage',b:'#FFFFFF',h:'#FFD700',ef:'#ffffff'}],st:{hp:1100,sp:6,jp:13},mv:{p:{n:'Uppercut',d:90},k:{n:'Konoha Kick',d:130},s1:{n:'RASENGAN',d:220,c:30},s2:{n:'CLONE STORM',d:300,c:50},ul:{n:'RASENSHURIKEN',d:550,c:100}}},
    {n:'Goku',u:'Dragon Ball',e:'⚡',sk:[{n:'Classic',b:'#FF6600',h:'#000',ef:'#ff6600'},{n:'Super Saiyan',b:'#FF6600',h:'#FFD700',ef:'#ffdd00'},{n:'Ultra Instinct',b:'#FF6600',h:'#CCC',ef:'#fff'}],st:{hp:1200,sp:6.5,jp:15},mv:{p:{n:'Dragon Fist',d:100},k:{n:'Super Kick',d:140},s1:{n:'KAMEHAMEHA',d:250,c:30},s2:{n:'SPIRIT BOMB',d:350,c:55},ul:{n:'ULTRA INSTINCT',d:600,c:100}}},
    {n:'Saitama',u:'One Punch Man',e:'👊',sk:[{n:'Hero',b:'#FFD700',h:'#FFD700',ef:'#ffdd00'},{n:'Casual',b:'#FFF',h:'#FFD700',ef:'#fff'},{n:'Serious',b:'#F00',h:'#FFD700',ef:'#ff0000'}],st:{hp:1500,sp:7,jp:14},mv:{p:{n:'Normal Punch',d:120},k:{n:'Normal Kick',d:160},s1:{n:'CONSECUTIVE',d:280,c:30},s2:{n:'SERIOUS PUNCH',d:400,c:55},ul:{n:'ONE PUNCH!',d:999,c:100}}}
];

let pI=null,pS=0,eI=null,eS=0,p1,p2,on=false,t=99,r=1,pw=0,ew=0,pEn=0,eEn=0,pts=[],fx=[],sh=0,keys={},tid=null;
const cv=document.getElementById('gc'),cx=cv.getContext('2d');
const GROUND_RATIO=0.8;

function build(){
    const pr=document.getElementById('playerRow'),er=document.getElementById('enemyRow');
    R.forEach((c,i)=>{
        const box=(s)=>{
            const d=document.createElement('div');d.className='char-box';d.id=s+'-'+i;
            d.innerHTML=`<div class="char-portrait">${c.e}</div><div class="char-name">${c.n}</div><div class="skin-area">${c.sk.map((k,si)=>`<div class="skin-btn" style="background:${k.b}" id="sk-${s}-${i}-${si}" title="${k.n}"></div>`).join('')}</div><div class="skin-label" id="sn-${s}-${i}">${c.sk[0].n}</div>`;
            d.onclick=e=>{
                if(e.target.classList.contains('skin-btn')){e.stopPropagation();const si=+e.target.id.split('-')[3];if(s==='p'&&pI===i)pS=si;if(s==='e'&&eI===i)eS=si;upd();return}
                if(s==='p'){pI=i;pS=0}else{eI=i;eS=0}upd();
            };
            return d;
        };
        pr.appendChild(box('p'));er.appendChild(box('e'));
    });
}

function upd(){
    document.querySelectorAll('.char-box').forEach(b=>{b.classList.remove('sel-p','sel-e')});
    if(pI!=null){document.getElementById('p-'+pI).classList.add('sel-p');document.getElementById('sn-p-'+pI).textContent=R[pI].sk[pS].n}
    if(eI!=null){document.getElementById('e-'+eI).classList.add('sel-e');document.getElementById('sn-e-'+eI).textContent=R[eI].sk[eS].n}
    document.querySelectorAll('.skin-btn').forEach(b=>b.classList.remove('active'));
    if(pI!=null)document.getElementById('sk-p-'+pI+'-'+pS).classList.add('active');
    if(eI!=null)document.getElementById('sk-e-'+eI+'-'+eS).classList.add('active');
    document.getElementById('pName').textContent=pI!=null?R[pI].n+' ['+R[pI].sk[pS].n+']':'Chưa chọn';
    document.getElementById('eName').textContent=eI!=null?R[eI].n+' ['+R[eI].sk[eS].n+']':'Chưa chọn';
    document.getElementById('fightBtn').disabled=(pI==null||eI==null);
}

function rsz(){cv.width=window.innerWidth;cv.height=window.innerHeight}

function startGame(){
    if(pI==null||eI==null)return;
    document.getElementById('selectScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.add('active');
    rsz();newRound();on=true;t=99;r=1;pw=0;ew=0;updHUD();
    document.getElementById('hudP1').textContent=R[pI].n;document.getElementById('hudP2').textContent=R[eI].n;
    document.getElementById('timer').textContent=t;document.getElementById('round').textContent='Round '+r;
    if(tid)clearInterval(tid);
    tid=setInterval(()=>{if(on){t--;document.getElementById('timer').textContent=t;if(t<=0)end('time')}},1000);
    loop();
}

function newRound(){
    const pc=R[pI],ec=R[eI];
    const gy=cv.height*GROUND_RATIO;
    pEn=0;eEn=0;
    p1={x:cv.width*0.12,y:gy-85,w:55,h:85,vx:0,vy:0,hp:pc.st.hp,mhp:pc.st.hp,b:pc.sk[pS].b,h:pc.sk[pS].h,ef:pc.sk[pS].ef,sp:pc.st.sp,jp:pc.st.jp,face:1,atk:false,cd:0,mv:pc.mv};
    p2={x:cv.width*0.75,y:gy-85,w:55,h:85,vx:0,vy:0,hp:ec.st.hp,mhp:ec.st.hp,b:ec.sk[eS].b,h:ec.sk[eS].h,ef:ec.sk[eS].ef,sp:ec.st.sp,jp:ec.st.jp,face:-1,atk:false,cd:0,mv:ec.mv};
    pts=[];fx=[];sh=0;
}

function updHUD(){
    document.getElementById('hp1').style.width=Math.max(0,p1.hp/p1.mhp*100)+'%';
    document.getElementById('hp2').style.width=Math.max(0,p2.hp/p2.mhp*100)+'%';
    document.getElementById('en1').style.width=pEn+'%';
    document.getElementById('en2').style.width=eEn+'%';
}

['bL','bU','bR','bP','bK','bS1','bS2','bUL'].forEach(id=>{
    const b=document.getElementById(id);if(!b)return;
    b.addEventListener('touchstart',e=>{e.preventDefault();keys[id]=true});
    b.addEventListener('touchend',e=>{keys[id]=false});
    b.addEventListener('mousedown',e=>{keys[id]=true});
    b.addEventListener('mouseup',e=>{keys[id]=false});
});

function sk(a,d,k,pl){
    if(a.atk||a.cd>0)return;const mv=a.mv[k],en=pl?pEn:eEn;
    if(en<(mv.c||0))return;const dist=Math.abs(a.x-d.x),rng=(k==='s2'||k==='ul')?300:120;
    if(dist>rng||a.face!==(d.x>a.x?1:-1))return;
    if(pl)pEn-=mv.c||0;else eEn-=mv.c||0;
    d.hp-=mv.d;d.vy=-(k==='ul'?22:14);d.vx=d.face*-(k==='ul'?14:8);
    a.atk=true;a.cd=(k==='ul'?50:25);sh=(k==='ul'?30:k==='s2'?15:6);
    fx.push({x:d.x+27,y:d.y-30,t:mv.n,t2:'-'+mv.d,l:50,c:k==='ul'?'#ff0':'#fff'});
    const n=k==='ul'?60:k==='s2'?30:12;
    for(let i=0;i<n;i++)pts.push({x:d.x+27,y:d.y+42,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14,l:30+Math.random()*30,c:a.ef});
    updHUD();if(d.hp<=0){d.hp=0;updHUD();end(pl?'p1':'p2')}
}

function end(w){
    on=false;if(w==='p1')pw++;else if(w==='p2')ew++;
    if(pw>=2||ew>=2){if(tid)clearInterval(tid);setTimeout(()=>{alert((pw>=2?R[pI].n:R[eI].n)+' chiến thắng!');location.reload()},500)}
    else{setTimeout(()=>{t=99;newRound();on=true;r++;updHUD();document.getElementById('timer').textContent=t;document.getElementById('round').textContent='Round '+r},2000)}
}

function ai(){
    if(!on||p2.atk||p2.cd>0)return;const dx=p1.x-p2.x,ad=Math.abs(dx),gy=cv.height*GROUND_RATIO;
    if(ad>250)p2.vx=dx>0?p2.sp*0.4:-p2.sp*0.4;
    else if(ad<90){p2.vx=dx>0?-p2.sp*0.4:p2.sp*0.4;if(Math.random()<0.03){if(eEn>=100)sk(p2,p1,'ul',false);else if(eEn>=50)sk(p2,p1,'s2',false);else if(eEn>=30)sk(p2,p1,'s1',false);else sk(p2,p1,Math.random()<0.5?'p':'k',false)}}
    else{p2.vx*=0.9;if(Math.random()<0.02){if(eEn>=30)sk(p2,p1,'s1',false);else sk(p2,p1,Math.random()<0.5?'p':'k',false)}}
    if(p1.y<p2.y-50&&p2.y>=gy-p2.h&&Math.random()<0.03)p2.vy=-p2.jp;
}

function loop(){
    if(!on){requestAnimationFrame(loop);return}
    const gy=cv.height*GROUND_RATIO;
    p1.vx=0;if(keys['bL'])p1.vx=-p1.sp;if(keys['bR'])p1.vx=p1.sp;if(keys['bU']&&p1.y>=gy-p1.h)p1.vy=-p1.jp;
    if(keys['bP'])sk(p1,p2,'p',true);if(keys['bK'])sk(p1,p2,'k',true);
    if(keys['bS1'])sk(p1,p2,'s1',true);if(keys['bS2'])sk(p1,p2,'s2',true);if(keys['bUL'])sk(p1,p2,'ul',true);
    [p1,p2].forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.9;if(p.y>=gy-p.h){p.y=gy-p.h;p.vy=0}p.x=Math.max(0,Math.min(cv.width-p.w,p.x));if(p.cd>0)p.cd--;if(p.cd===0)p.atk=false});
    pEn=Math.min(100,pEn+0.1);eEn=Math.min(100,eEn+0.1);
    p1.face=p1.x<p2.x?1:-1;p2.face=p2.x<p1.x?1:-1;ai();
    pts=pts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.l--;return p.l>0});
    fx=fx.filter(f=>{f.l--;return f.l>0});if(sh>0)sh--;
    
    const sx=sh?(Math.random()-.5)*sh:0,sy=sh?(Math.random()-.5)*sh:0;
    cx.save();cx.translate(sx,sy);
    const bg=cx.createLinearGradient(0,0,0,cv.height);
    bg.addColorStop(0,'#0a0a2e');bg.addColorStop(0.7,'#1a1a4e');bg.addColorStop(1,'#0a0a1a');
    cx.fillStyle=bg;cx.fillRect(0,0,cv.width,cv.height);
    for(let i=0;i<cv.width;i+=100){cx.fillStyle='#111';cx.fillRect(i,gy-120,50,120);cx.fillStyle='#ff0';cx.fillRect(i+10,gy-110,10,10);cx.fillRect(i+30,gy-100,10,10)}
    cx.fillStyle='#2a2a2a';cx.fillRect(0,gy,cv.width,cv.height-gy);
    cx.strokeStyle='#ff0';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,gy);cx.lineTo(cv.width,gy);cx.stroke();
    
    [{p:p1},{p:p2}].forEach(({p})=>{
        cx.fillStyle=p.b;cx.fillRect(p.x,p.y,p.w,p.h);
        cx.fillStyle=p.h;cx.beginPath();cx.arc(p.x+p.w/2,p.y-18,18,0,Math.PI*2);cx.fill();
        cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x+p.w/2-6,p.y-22,5,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(p.x+p.w/2+6,p.y-22,5,0,Math.PI*2);cx.fill();
        cx.fillStyle='#000';cx.beginPath();cx.arc(p.x+p.w/2-6+p.face*2,p.y-22,2.5,0,Math.PI*2);cx.fill();cx.beginPath();ctx.arc(p.x+p.w/2+6+p.face*2,p.y-22,2.5,0,Math.PI*2);cx.fill();
        if(p.atk){cx.fillStyle='#ff0';cx.fillRect(p.x+p.face*p.w,p.y+p.h/2-10,35,18)}
    });
    pts.forEach(p=>{cx.fillStyle=p.c;cx.globalAlpha=p.l/50;cx.beginPath();cx.arc(p.x,p.y,4,0,Math.PI*2);cx.fill()});cx.globalAlpha=1;
    fx.forEach(f=>{cx.fillStyle=f.c;cx.globalAlpha=f.l/50;cx.font='bold 16px Arial';cx.textAlign='center';cx.fillText(f.t,f.x,f.y);cx.fillText(f.t2,f.x,f.y+18);cx.textAlign='start'});cx.globalAlpha=1;
    cx.restore();
    updHUD();requestAnimationFrame(loop);
}

build();rsz();loop();
</script>
</body>
</html>
