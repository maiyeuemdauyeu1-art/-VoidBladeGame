<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rick & Morty Multiverse Battle</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🌀 Rick & Morty: Multiverse Battle</h1>

<div id="select">

<h2>Chọn nhân vật</h2>

<button onclick="pickPlayer('rick')">
🧪 Rick
</button>

<button onclick="pickPlayer('morty')">
👦 Morty
</button>

<h2>Chọn Skin</h2>

<select id="skin">
<option value="normal">Skin thường</option>
<option value="battle">Skin chiến đấu</option>
<option value="prime">Skin thức tỉnh</option>
</select>

</div>


<div id="arena">

<div class="team">

<h2 id="playerName">Rick</h2>

<img id="playerImg" src="assets/rick/normal.png">

<div class="bar">
<div id="hp"></div>
</div>

<div class="rage">
<div id="rage"></div>
</div>

</div>



<h1>VS</h1>



<div class="enemy">

<h2>🔥 Gojo</h2>

<img src="assets/enemies/gojo.png">

<div class="bar">
<div id="enemyHp"></div>
</div>

</div>


</div>



<div id="buttons">

<button onclick="attack()">⚔️</button>

<button onclick="skill1()">🔵</button>

<button onclick="skill2()">🟣</button>

<button onclick="ultimate()">🔥</button>

</div>


<h2>
🟡 Vàng: <span id="gold">0</span>
</h2>


<script src="game.js"></script>

</body>
</html>
