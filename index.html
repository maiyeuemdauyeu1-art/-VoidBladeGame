<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Android Cloud</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#111;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#phone{
    width:min(100vw,430px);
    height:min(100vh,850px);
    position:relative;
    overflow:hidden;
    color:white;

    background:
    radial-gradient(circle at 15% 15%,#4d7777 0%,transparent 30%),
    radial-gradient(circle at 85% 40%,#245f58 0%,transparent 35%),
    linear-gradient(145deg,#203c3c,#102d2d 45%,#071818);
}

#status{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:32px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 15px;
    z-index:500;

    font-size:11px;
    font-weight:bold;
}

#camera{
    position:absolute;
    top:7px;
    left:50%;
    transform:translateX(-50%);

    width:85px;
    height:22px;

    background:#080808;
    border-radius:20px;

    z-index:600;
}

#home{
    position:absolute;
    inset:0;

    padding:48px 17px 145px;

    overflow-y:auto;
    scrollbar-width:none;
}

#home::-webkit-scrollbar{
    display:none;
}

.search{
    height:47px;

    border-radius:25px;

    background:rgba(255,255,255,.9);

    display:flex;
    align-items:center;

    padding:0 15px;

    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.google{
    font-size:25px;
    font-weight:bold;

    background:linear-gradient(
        90deg,
        #4285f4,
        #34a853,
        #fbbc05,
        #ea4335
    );

    -webkit-background-clip:text;
    color:transparent;
}

.searchText{
    margin-left:10px;
    color:#777;
    font-size:14px;
}

.mic{
    margin-left:auto;
}

#apps{
    margin-top:27px;

    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:22px 8px;
}

.app{
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:.12s;
}

.app:active{
    transform:scale(.84);
}

.icon{
    width:51px;
    height:51px;

    margin:auto;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:white;

    box-shadow:0 3px 8px rgba(0,0,0,.35);

    overflow:hidden;
}

.icon svg{
    width:100%;
    height:100%;
}

.name{
    margin-top:5px;

    font-size:9px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    text-shadow:0 1px 4px #000;
}

#cloud{
    position:absolute;

    left:12px;
    right:12px;
    bottom:68px;

    height:58px;

    z-index:400;

    border-radius:18px;

    background:rgba(10,15,20,.72);

    border:1px solid rgba(255,255,255,.15);

    backdrop-filter:blur(15px);

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:8px 10px;
}

.cloudLeft{
    display:flex;
    align-items:center;
    gap:9px;
}

.cloudIcon{
    width:40px;
    height:40px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        135deg,
        #16a8ff,
        #5552ff
    );

    font-size:20px;
}

.cloudTitle{
    font-size:11px;
    font-weight:bold;
}

.cloudState{
    margin-top:3px;
    font-size:9px;
    color:#55ff92;
}

#afk{
    border:0;

    padding:10px 13px;

    border-radius:20px;

    background:linear-gradient(
        135deg,
        #1687ff,
        #664cff
    );

    color:white;

    font-size:10px;
    font-weight:bold;
}

#nav{
    position:absolute;

    bottom:0;
    left:0;
    right:0;

    height:58px;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:60px;

    background:rgba(0,0,0,.25);

    z-index:450;
}

.navButton{
    border:0;
    background:none;
    color:white;

    font-size:27px;

    width:40px;
    height:40px;
}

.homeCircle{
    width:23px;
    height:23px;

    border:2px solid white;
    border-radius:50%;
}

#application{
    position:absolute;

    inset:0;

    z-index:1000;

    display:none;

    background:#10202a;
}

.appHeader{
    height:60px;

    display:flex;
    align-items:center;

    gap:10px;

    padding:0 12px;

    background:rgba(0,0,0,.35);

    border-bottom:1px solid rgba(255,255,255,.1);
}

.back{
    border:0;
    background:none;

    color:white;

    font-size:30px;
}

.appHeaderIcon{
    width:35px;
    height:35px;

    border-radius:10px;
}

.appHeaderTitle{
    font-size:17px;
    font-weight:bold;
}

.content{
    padding:18px;
}

.card{
    padding:20px;

    border-radius:20px;

    background:rgba(255,255,255,.09);

    border:1px solid rgba(255,255,255,.12);

    margin-bottom:14px;
}

.bigIcon{
    text-align:center;
    margin:10px;
}

#toast{
    display:none;

    position:absolute;

    left:50%;
    bottom:145px;

    transform:translateX(-50%);

    padding:11px 18px;

    border-radius:25px;

    background:rgba(0,0,0,.85);

    font-size:12px;

    z-index:2000;

    white-space:nowrap;
}


/* =========================
   TRÌNH DUYỆT
   ========================= */

.browser{
    position:absolute;
    inset:0;

    background:#edf4ff;

    color:#333;

    overflow:hidden;

    font-family:Arial,sans-serif;
}

.browserTabs{
    height:58px;

    background:#dfe2e7;

    display:flex;

    align-items:center;

    gap:8px;

    padding:7px 10px;
}

.browserTab{
    height:48px;

    min-width:210px;

    background:white;

    border-radius:17px 17px 0 0;

    display:flex;

    align-items:center;

    gap:10px;

    padding:0 14px;

    font-size:14px;
}

.browserTab span:nth-child(2){
    flex:1;
}

.browserNewTab{
    width:45px;
    height:45px;

    border:0;

    border-radius:50%;

    background:white;

    font-size:30px;

    color:#666;
}

.browserToolbar{
    height:68px;

    background:white;

    display:flex;

    align-items:center;

    gap:5px;

    padding:7px 10px;

    border-bottom:1px solid #ddd;
}

.browserTool{
    width:38px;
    height:45px;

    border:0;

    background:transparent;

    color:#777;

    font-size:28px;
}

.browserAddress{
    flex:1;

    height:46px;

    border-radius:25px;

    background:#edf2f8;

    display:flex;

    align-items:center;

    padding:0 14px;

    gap:9px;

    color:#555;

    overflow:hidden;
}

.browserAddress input{
    width:100%;

    border:0;

    outline:0;

    background:transparent;

    font-size:14px;

    color:#333;
}

.browserHome{
    position:absolute;

    top:126px;
    left:0;
    right:0;
    bottom:0;

    overflow:auto;

    padding:20px;
}

.browserTop{
    display:flex;

    justify-content:space-between;

    align-items:center;
}

.editButton{
    width:46px;
    height:46px;

    border:0;

    border-radius:14px;

    background:white;

    color:#1683ff;

    font-size:22px;
}

.browserAccount{
    width:43px;
    height:43px;

    border-radius:50%;

    background:#078bd1;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:bold;
}

.googleLogo{
    text-align:center;

    margin-top:80px;
    margin-bottom:30px;

    font-size:62px;

    font-weight:bold;

    letter-spacing:-5px;
}

.gBlue{
    color:#4285f4;
}

.gRed{
    color:#ea4335;
}

.gYellow{
    color:#fbbc05;
}

.gGreen{
    color:#34a853;
}

.googleSearch{
    width:min(100%,580px);

    height:62px;

    margin:auto;

    padding:0 20px;

    border-radius:32px;

    background:#d9e4f7;

    display:flex;

    align-items:center;

    gap:12px;
}

.googleSearch input{
    flex:1;

    border:0;

    outline:0;

    background:transparent;

    font-size:17px;

    color:#333;
}

.googleSearch span{
    font-size:20px;
}

.browserShortcuts{
    width:min(100%,680px);

    margin:45px auto 20px;

    padding:22px;

    border-radius:25px;

    background:rgba(255,255,255,.95);

    display:flex;

    gap:24px;

    overflow-x:auto;
}

.browserShortcut{
    min-width:78px;

    text-align:center;

    color:#666;

    font-size:12px;
}

.shortcutIcon{
    width:52px;
    height:52px;

    margin:auto auto 9px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;

    font-weight:bold;
}

.sGray{
    background:#888;
    color:white;
}

.sGreen{
    background:#eafff2;
    color:#21a861;
}

.sRed{
    background:#ffeaea;
    color:#e33;
}

.sBlue{
    background:#326af4;
    color:white;
}

.sAdd{
    background:#e4efff;
    color:#087ff5;
    font-size:30px;
}

.browserSection{
    width:min(100%,680px);

    margin:20px auto;

    padding:22px;

    border-radius:25px;

    background:white;
}

.browserSection h3{
    margin:0 0 20px;

    font-size:17px;
}

.quickGrid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:15px;
}

.quickItem{
    text-align:center;

    color:#666;

    font-size:12px;
}

.quickIcon{
    width:58px;
    height:58px;

    margin:auto auto 10px;

    border-radius:17px;

    background:#e5efff;

    color:#087ff5;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;
}

@media(max-width:600px){

    .browserToolbar{
        gap:2px;
        padding:5px;
    }

    .browserTool{
        width:30px;
        font-size:23px;
    }

    .browserAddress{
        padding:0 8px;
    }

    .browserAddress input{
        font-size:11px;
    }

    .googleLogo{
        font-size:52px;
        margin-top:65px;
    }
}
</style>
</head>

<!-- ĐIỀU KHIỂN ĐÁM MÂY -->

<div class="cloudLeft">

<div>

</div>

</div>

<button id="afk" onclick="toggleAFK()">
BẬT TREO
</button>

</div>


<!-- ĐIỀU HƯỚNG -->

<button class="navButton" onclick="goHome()">

</button>

<!-- CỬA SỔ ỨNG DỤNG -->

<div id="application"></div>

<div id="toast"></div>

</div>


<script>

let currentApp=false;
let afk=false;


/* Đồng hồ */

function updateTime(){

    const now=new Date();

    const h=String(now.getHours()).padStart(2,"0");
    const m=String(now.getMinutes()).padStart(2,"0");

    document.getElementById("time").textContent=h+":"+m;
}

updateTime();

setInterval(updateTime,1000);


/* MỞ ỨNG DỤNG */

function openApp(name,color){

    currentApp=true;

    const application=
        document.getElementById("application");

    application.style.display="block";


    /* TRÌNH DUYỆT */

    if(name==="Trình duyệt"){

        application.innerHTML=`

        <div class="browser">

            <div class="browserTabs">

                <div class="browserTab">

                    <span>🌐</span>

                    <span>Thẻ mới</span>

                    <span>×</span>

                </div>

                <button class="browserNewTab">
                    +
                </button>

            </div>


            <div class="browserToolbar">

                <button class="browserTool"
                    onclick="browserBack()">
                    ‹
                </button>

                <button class="browserTool"
                    onclick="browserForward()">
                    ›
                </button>

                <button class="browserTool"
                    onclick="browserReload()">
                    ↻
                </button>


                <div class="browserAddress">

                    <span>🔒</span>

                    <input
                        id="addressInput"
                        placeholder="Tìm trên Google hoặc nhập URL"
                        onkeydown="browserSearch(event)"
                    >

                </div>


                <button class="browserTool">
                    ⇧
                </button>

                <button class="browserTool">
                    ▢
                </button>

                <button class="browserTool">
                    •••
                </button>

            </div>


            <div class="browserHome">


                <div class="browserTop">

                    <button class="editButton">
                        ✎
                    </button>

                    <div class="browserAccount">
                        L
                    </div>

                </div>


                <div class="googleLogo">

                    <span class="gBlue">G</span>
                    <span class="gRed">o</span>
                    <span class="gYellow">o</span>
                    <span class="gBlue">g</span>
                    <span class="gGreen">l</span>
                    <span class="gRed">e</span>

                </div>


                <div class="googleSearch">

                    <span class="gBlue">
                        G
                    </span>

                    <input
                        id="googleInput"
                        placeholder="Tìm trên Google hoặc nhập URL"
                        onkeydown="browserSearch(event)"
                    >

                    <span>
                        🎙
                    </span>

                </div>


                <div class="browserShortcuts">


                    <div class="browserShortcut">

                        <div class="shortcutIcon sGray">
                            U
                        </div>

                        FF Beta

                    </div>


                    <div class="browserShortcut">

                        <div class="shortcutIcon sGreen">
                            ✤
                        </div>

                        Đăng nhập

                    </div>


                    <div class="browserShortcut">

                        <div class="shortcutIcon sRed">
                            ◉
                        </div>

                        RoEarn

                    </div>


                    <div class="browserShortcut">

                        <div class="shortcutIcon sBlue">
                            ◇
                        </div>

                        Đăng nhập<br>
                        vào Roblox

                    </div>


                    <div class="browserShortcut">

                        <div class="shortcutIcon sAdd">
                            +
                        </div>

                        Thêm trang

                    </div>


                </div>


                <div class="browserSection">

                    <h3>Lối tắt</h3>

                    <div class="quickGrid">


                        <div class="quickItem">

                            <div class="quickIcon">
                                ☆
                            </div>

                            Dấu trang

                        </div>


                        <div class="quickItem">

                            <div class="quickIcon">
                                ▤
                            </div>

                            Danh sách

                        </div>


                        <div class="quickItem">

                            <div class="quickIcon">
                                ▣
                            </div>

                            Thẻ gần đây

                        </div>


                        <div class="quickItem">

                            <div class="quickIcon">
                                ◴
                            </div>

                            Nhật ký

                        </div>


                    </div>

                </div>


                <div class="browserSection">

                    <h3>Khám phá</h3>

                    <p>
                        Nội dung đề xuất sẽ xuất hiện ở đây.
                    </p>

                </div>


            </div>

        </div>

        `;

        return;
    }


    /* CÁC ỨNG DỤNG KHÁC */

    application.innerHTML=`

        <div class="appHeader">

            <button
                class="back"
                onclick="goBack()">
                ‹
            </button>

            <div
                class="appHeaderIcon"
                style="background:${color}">
            </div>

            <div class="appHeaderTitle">
                ${name}
            </div>

        </div>


        <div class="content">

            <div class="card">

                <div
                    class="bigIcon"
                    style="font-size:60px">
                    ▣
                </div>

                <h2>
                    ${name}
                </h2>

                <p>
                    Ứng dụng đang chạy trên Android Cloud.
                </p>

            </div>


            <div class="card">

                <b>
                    Trạng thái máy
                </b>

                <p style="color:#4cff87">
                    ● Đang hoạt động
                </p>

            </div>

        </div>

    `;
}


/* TÌM KIẾM TRÌNH DUYỆT */

function browserSearch(event){

    if(event.key!=="Enter"){
        return;
    }

    const value=event.target.value.trim();

    if(!value){
        return;
    }

    let url=value;

    if(
        !value.startsWith("http://") &&
        !value.startsWith("https://")
    ){

        if(
            value.includes(".") &&
            !value.includes(" ")
        ){

            url="https://"+value;

        }else{

            url=
            "https://www.google.com/search?q="+
            encodeURIComponent(value);

        }

    }

    /*
       Mở trang thật trong trình duyệt của thiết bị.
       Trình mô phỏng web không thể tạo Android Cloud
       thật chỉ bằng HTML.
    */

    window.open(url,"_blank");

}


/* Nút quay lại của trình duyệt */

function browserBack(){

    showToast("Quay lại");
}


/* Nút tiến */

function browserForward(){

    showToast("Tiến tới");
}


/* Làm mới */

function browserReload(){

    showToast("Đang làm mới");

    setTimeout(function(){

        location.reload();

    },300);

}


/* QUAY LẠI */

function goBack(){

    if(currentApp){

        document.getElementById(
            "application"
        ).style.display="none";

        document.getElementById(
            "application"
        ).innerHTML="";

        currentApp=false;

    }else{

        showToast(
            "Đang ở màn hình chính"
        );

    }

}


/* TRANG CHỦ */

function goHome(){

    document.getElementById(
        "application"
    ).style.display="none";

    document.getElementById(
        "application"
    ).innerHTML="";

    currentApp=false;

}


/* CHẾ ĐỘ TREO */

function toggleAFK(){

    afk=!afk;

    const button=
        document.getElementById("afk");

    const state=
        document.getElementById("cloudState");


    if(afk){

        button.textContent="TẮT TREO";

        state.textContent="● Đang treo";

        state.style.color="#00e5ff";

        showToast(
            "Đã bật chế độ treo"
        );

    }else{

        button.textContent="BẬT TREO";

        state.textContent="● Đang hoạt động";

        state.style.color="#55ff92";

        showToast(
            "Đã tắt chế độ treo"
        );

    }

}


/* THÔNG BÁO */

function showToast(text){

    const toast=
        document.getElementById("toast");

    toast.textContent=text;

    toast.style.display="block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer=setTimeout(
        function(){

            toast.style.display="none";

        },
        1800
    );

}

</script>

</body>
</html>
