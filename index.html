<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MUGEN Fighter - Rick & Morty x Anime</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:Arial;touch-action:manipulation}
        
        #selectScreen{
            position:fixed;top:0;left:0;width:100%;height:100%;
            background:linear-gradient(135deg,#0a0015,#1a0030,#0a0015);
            z-index:10;overflow-y:auto;padding:20px;
        }
        #selectScreen.hidden{display:none}
        
        .title{
            text-align:center;color:#ffcc00;font-size:2em;font-weight:bold;
            text-shadow:0 0 30px #ffcc00,0 0 60px #ff6600;
            margin-bottom:5px;letter-spacing:3px;
        }
        .subtitle{text-align:center;color:#aaa;font-size:0.9em;margin-bottom:15px}
        
        .section-title{
            color:#00ff88;text-align:center;font-size:1.1em;font-weight:bold;
            padding:8px;border:2px solid #00ff8833;border-radius:10px;margin:15px 0 10px;
            background:#00ff8811;
        }
        
        .roster{
            display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
            gap:8px;padding:5px;
        }
        
        .char-slot{
            background:#111133;border:2px solid #333366;border-radius:12px;
            padding:10px;text-align:center;cursor:pointer;transition:all 0.3s;
            position:relative;overflow:hidden;
        }
        .char-slot:hover{transform:translateY(-3px);border-color:#ffcc00;box-shadow:0 5px 20px #ffcc0044}
        .char-slot.selected{border-color:#00ff88!important;background:#003322!important;box-shadow:0 0 20px #00ff8888!important;animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{box-shadow:0 0 20px #00ff8888}50%{box-shadow:0 0 40px #00ff88ff}}
        
        .char-slot .portrait{
            width:80px;height:80px;border-radius:10px;margin:0 auto 8px;
            display:flex;align-items:center;justify-content:center;
            font-size:3em;background:#00000044;border:2px solid #444;
        }
        .char-slot .cname{color:#fff;font-weight:bold;font-size:0.85em}
        .char-slot .cfrom{color:#888;font-size:0.7em}
        
        .skin-selector{display:flex;gap:3px;justify-content:center;margin-top:5px}
        .skin-btn{width:15px;height:15px;border-radius:50%;border:2px solid #555;cursor:pointer;transition:0.3s}
        .skin-btn.active{border-color:#fff;box-shadow:0 0 10px #fff;transform:scale(1.4)}
        
        .vs-section{
            display:flex;align-items:center;justify-content:center;gap:20px;
            margin:20px 0;color:#fff;font-size:1.2em;
        }
        .vs-box{
            background:#00000088;border:2px solid #333;border-radius:15px;
            padding:15px;text-align:center;min-width:150px;
        }
        .vs-box .label{color:#888;font-size:0.8em}
        .vs-box .value{font-weight:bold;font-size:1em;margin-top:5px}
        .vs-box.player .value{color:#00ff88}
        .vs-box.enemy .value{color:#ff4444}
        .vs-text{font-size:3em;color:#ffcc00;font-weight:bold;text-shadow:0 0 20px #ffcc00}
        
        .fight-btn{
            display:block;width:100%;max-width:400px;margin:15px auto;
            padding:18px;background:linear-gradient(135deg,#ff4400,#ffaa00);
            color:#fff;border:none;border-radius:30px;font-size:1.4em;
            font-weight:bold;cursor:pointer;letter-spacing:2px;
            box-shadow:0 5px 30px #ff440066;transition:0.3s;
        }
        .fight-btn:active{transform:scale(0.95)}
        .fight-btn:disabled{background:#444;box-shadow:none;color:#888}
        
        /* GAME SCREEN */
        #gameScreen{
            position:fixed;top:0;left:0;width:100%;height:100%;
            background:#000;z-index:5;
        }
        #gameScreen.hidden{display:none}
        
        #gameHUD{
            position:absolute;top:10px;left:10px;right:10px;
            display:flex;justify-content:space-between;z-index:6;
            pointer-events:none;
        }
        .hud-side{width:35%}
        .hud-side.right{text-align:right}
        .hud-name{color:#fff;font-weight:bold;font-size:0.9em;margin-bottom:3px}
        .hp-bar{height:20px;background:#333;border-radius:10px;overflow:hidden;border:2px solid #555;margin-bottom:3px}
        .hp-fill{height:100%;transition:0.3s}
        .hp-fill.p1{background:linear-gradient(90deg,#00ff88,#00aa44)}
        .hp-fill.p2{background:linear-gradient(90deg,#ff4444,#aa0000)}
        .power-bar{height:10px;background:#222;border-radius:5px;overflow:hidden;border:1px solid #444}
        .power-fill{height:100%;background:linear-gradient(90deg,#ffcc00,#ff8800);transition:0.3s}
        
        .hud-center{text-align:center;color:#fff}
        .hud-timer{font-size:2em;font-weight:bold;color:#ffcc00}
        .hud-round{font-size:0.8em;color:#aaa}
        
        canvas{display:block;width:100%;height:100%}
        
        #touchControls{
            position:absolute;bottom:10px;left:10px;right:10px;
            display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;
            gap:5px;z-index:6;
        }
        #touchControls button{
            padding:12px 4px;border:2px solid #ffffff44;border-radius:10px;
            background:#000000aa;color:#fff;font-size:0.75em;font-weight:bold;
            cursor:pointer;backdrop-filter:blur(5px);
        }
        #touchControls button:active{background:#ffffff44;transform:scale(0.95)}
        #touchControls .move-btn{border-color:#ffffff88}
        #touchControls .atk-btn{border-color:#ff4444;background:#44000088}
        #touchControls .sp-btn{border-color:#ffcc00;background:#44330088}
        
        /* WIN SCREEN */
        #winOverlay{
            position:fixed;top:0;left:0;width:100%;height:100%;
            background:#000000dd;z-index:20;display:flex;
            flex-direction:column;align-items:center;justify-content:center;
        }
        #winOverlay.hidden{display:none}
        .win-text{font-size:3em;font-weight:bold;margin-bottom:15px}
        .win-message{color:#ccc;font-size:1em;margin-bottom:20px;text-align:center}
        .win-buttons{display:flex;gap:10px}
        .win-buttons button{
            background:#667eea;color:#fff;border:none;
            padding:12px 25px;border-radius:25px;cursor:pointer;font-size:1em;
        }
    </style>
</head>
<body>

<!-- SELECT SCREEN -->
<div id="selectScreen">
    <div class="title">⚔️ ANIME MUGEN ⚔️</div>
    <div class="subtitle">Rick & Morty × Anime Universe</div>
    
    <div class="section-title">👤 CHỌN CHIẾN BINH CỦA BẠN</div>
    <div class="roster" id="playerRoster"></div>
    
    <div class="section-title">🤖 CHỌN ĐỐI THỦ</div>
    <div class="roster" id="enemyRoster"></div>
    
    <div class="vs-section">
        <div class="vs-box player">
            <div class="label">BẠN</div>
            <div class="value" id="pName">-</div>
            <div style="font-size:0.7em;color:#aaa" id="pSkin">-</div>
        </div>
        <div class="vs-text">VS</div>
        <div class="vs-box enemy">
            <div class="label">ĐỐI THỦ</div>
            <div class="value" id="eName">-</div>
            <div style="font-size:0.7em;color:#aaa" id="eSkin">-</div>
        </div>
    </div>
    
    <button class="fight-btn" id="fightBtn" disabled onclick="startFight()">⚡ CHIẾN ĐẤU ⚡</button>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="hidden">
    <div id="gameHUD">
        <div class="hud-side">
            <div class="hud-name" id="hudP1">P1</div>
            <div class="hp-bar"><div class="hp-fill p1" id="hp1" style="width:100%"></div></div>
            <div class="power-bar"><div class="power-fill" id="pw1" style="width:0%"></div></div>
        </div>
        <div class="hud-center">
            <div class="hud-timer" id="timer">60</div>
            <div class="hud-round" id="round">Round 1</div>
        </div>
        <div class="hud-side right">
            <div class="hud-name" id="hudP2">P2</div>
            <div class="hp-bar"><div class="hp-fill p2" id="hp2" style="width:100%"></div></div>
            <div class="power-bar"><div class="power-fill" id="pw2" style="width:0%"></div></div>
        </div>
    </div>
    <canvas id="gc"></canvas>
    <div id="touchControls">
        <button class="move-btn" id="bL">◄</button>
        <button class="move-btn" id="bU">▲</button>
        <button class="move-btn" id="bR">►</button>
        <button class="atk-btn" id="bP">👊</button>
        <button class="atk-btn" id="bK">🦶</button>
        <button class="sp-btn" id="bS1">💥</button>
        <button class="sp-btn" id="bS2">⚡</button>
        <button class="sp-btn" id="bUL" style="grid-column:span 3;">🌀 ULTIMATE</button>
    </div>
</div>

<!-- WIN SCREEN -->
<div id="winOverlay" class="hidden">
    <div class="win-text" id="winText"></div>
    <div class="win-message" id="winMsg"></div>
    <div class="win-buttons">
        <button onclick="rematch()">🔄 TÁI ĐẤU</button>
        <button onclick="backToSelect()">👥 CHỌN LẠI</button>
    </div>
</div>

<script>
// ===== ROSTER DATA =====
const ROSTER = [
    {
        id:'rick',name:'Rick Sanchez',universe:'Rick & Morty',emoji:'🧪',
        skins:[
            {name:'Áo Blue',body:'#87CEEB',hair:'#B0C4DE',effect:'#4488ff'},
            {name:'Pickle Rick',body:'#4CAF50',hair:'#2E7D32',effect:'#44ff44'},
            {name:'Evil Rick',body:'#FF4444',hair:'#880000',effect:'#ff4444'}
        ],
        stats:{hp:1000,speed:6,jump:13},
        moves:{
            punch:{name:'Portal Punch',dmg:80,cost:0},
            kick:{name:'Gravity Kick',dmg:120,cost:0},
            special1:{name:'PORTAL GUN',dmg:200,cost:30},
            special2:{name:'LASER CANNON',dmg:280,cost:50},
            ultimate:{name:'MULTIVERSE COLLAPSE',dmg:500,cost:100}
        }
    },
    {
        id:'morty',name:'Morty Smith',universe:'Rick & Morty',emoji:'😰',
        skins:[
            {name:'Classic',body:'#FFD700',hair:'#8B4513',effect:'#ffaa00'},
            {name:'Evil Morty',body:'#FF0000',hair:'#8B0000',effect:'#ff0000'},
            {name:'Robot Morty',body:'#808080',hair:'#C0C0C0',effect:'#cccccc'}
        ],
        stats:{hp:900,speed:6.5,jump:14},
        moves:{
            punch:{name:'Nervous Punch',dmg:60,cost:0},
            kick:{name:'Panic Kick',dmg:100,cost:0},
            special1:{name:'LASER PISTOL',dmg:180,cost:25},
            special2:{name:'ARMOTHY STRIKE',dmg:250,cost:45},
            ultimate:{name:'PURGE SUIT ACTIVATE',dmg:450,cost:100}
        }
    },
    {
        id:'naruto',name:'Naruto Uzumaki',universe:'Naruto',emoji:'🍥',
        skins:[
            {name:'Classic',body:'#FF8C00',hair:'#FFD700',effect:'#ff8800'},
            {name:'Sage Mode',body:'#FF4500',hair:'#FFD700',effect:'#ff4400'},
            {name:'Hokage',body:'#FFFFFF',hair:'#FFD700',effect:'#ffffff'}
        ],
        stats:{hp:1100,speed:7,jump:14},
        moves:{
            punch:{name:'Uzumaki Punch',dmg:90,cost:0},
            kick:{name:'Konoha Kick',dmg:130,cost:0},
            special1:{name:'RASENGAN!',dmg:220,cost:30},
            special2:{name:'SHADOW CLONE STORM',dmg:300,cost:50},
            ultimate:{name:'SAGE RASENSHURIKEN',dmg:550,cost:100}
        }
    },
    {
        id:'goku',name:'Son Goku',universe:'Dragon Ball',emoji:'⚡',
        skins:[
            {name:'Classic',body:'#FF6600',hair:'#000000',effect:'#ff6600'},
            {name:'Super Saiyan',body:'#FF6600',hair:'#FFD700',effect:'#ffdd00'},
            {name:'Ultra Instinct',body:'#FF6600',hair:'#C0C0C0',effect:'#ffffff'}
        ],
        stats:{hp:1200,speed:7.5,jump:16},
        moves:{
            punch:{name:'Dragon Fist',dmg:100,cost:0},
            kick:{name:'Meteor Kick',dmg:140,cost:0},
            special1:{name:'KAMEHAMEHA!!!',dmg:250,cost:30},
            special2:{name:'SPIRIT BOMB',dmg:350,cost:55},
            ultimate:{name:'ULTRA INSTINCT',dmg:600,cost:100}
        }
    },
    {
        id:'saitama',name:'Saitama',universe:'One Punch Man',emoji:'👊',
        skins:[
            {name:'Hero',body:'#FFD700',hair:'#FFD700',effect:'#ffdd00'},
            {name:'Casual',body:'#FFFFFF',hair:'#FFD700',effect:'#ffffff'},
            {name:'Serious',body:'#FF0000',hair:'#FFD700',effect:'#ff0000'}
        ],
        stats:{hp:1500,speed:8,jump:15},
        moves:{
            punch:{name:'Normal Punch',dmg:120,cost:0},
            kick:{name:'Normal Kick',dmg:160,cost:0},
            special1:{name:'CONSECUTIVE PUNCHES',dmg:280,cost:30},
            special2:{name:'SERIOUS PUNCH',dmg:400,cost:55},
            ultimate:{name:'ONE PUUUUNCH!!!',dmg:999,cost:100}
        }
    },
    {
        id:'tanjiro',name:'Tanjiro Kamado',universe:'Demon Slayer',emoji:'⚔️',
        skins:[
            {name:'Demon Slayer',body:'#2F4F4F',hair:'#8B0000',effect:'#2F4F4F'},
            {name:'Hinokami',body:'#2F4F4F',hair:'#FF4500',effect:'#ff4500'},
            {name:'Demon King',body:'#4A0000',hair:'#FF0000',effect:'#ff0000'}
        ],
        stats:{hp:1000,speed:6.5,jump:13},
        moves:{
            punch:{name:'Water Slash',dmg:85,cost:0},
            kick:{name:'Whirlpool Kick',dmg:115,cost:0},
            special1:{name:'HINOKAMI KAGURA',dmg:210,cost:30},
            special2:{name:'SUN BREATHING',dmg:290,cost:50},
            ultimate:{name:'13TH FORM: SUN FLOW',dmg:520,cost:100}
        }
    }
];

// ===== STATE =====
let selectedPlayer=null, playerSkinIdx=0;
let selectedEnemy=null, enemySkinIdx=0;
let p1,p2,gameActive=false,gameTimer=99,roundNum=1,pWins=0,eWins=0;
let pPower=0,ePower=0,particles=[],effects=[],screenShake=0;
let keys={},timerID=null;
const canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');
const GROUND=0.78;

// ===== BUILD SELECT =====
function buildSelectScreen(){
    const pRoster=document.getElementById('playerRoster');
    const eRoster=document.getElementById('enemyRoster');
    pRoster.innerHTML='';eRoster.innerHTML='';
    
    ROSTER.forEach((char,idx)=>{
        const slot=(type)=>{
            const d=document.createElement('div');
            d.className='char-slot';d.id=`${type}-${idx}`;
            d.innerHTML=`
                <div class="portrait">${char.emoji}</div>
                <div class="cname">${char.name}</div>
                <div class="cfrom">${char.universe}</div>
                <div class="skin-selector">
                    ${char.skins.map((s,si)=>`<div class="skin-btn" style="background:${s.body}" id="sk-${type}-${idx}-${si}" title="${s.name}"></div>`).join('')}
                </div>`;
            d.addEventListener('click',(e)=>{
                if(e.target.classList.contains('skin-btn')){
                    e.stopPropagation();
                    const si=parseInt(e.target.id.split('-')[3]);
                    if(type==='p'&&selectedPlayer===idx)playerSkinIdx=si;
                    if(type==='e'&&selectedEnemy===idx)enemySkinIdx=si;
                    updateSelectUI();return;
                }
                if(type==='p'){selectedPlayer=idx;playerSkinIdx=0;}
                else{selectedEnemy=idx;enemySkinIdx=0;}
                updateSelectUI();
            });
            return d;
        };
        pRoster.appendChild(slot('p'));
        eRoster.appendChild(slot('e'));
    });
}

function updateSelectUI(){
    document.querySelectorAll('.char-slot').forEach(s=>s.classList.remove('selected'));
    if(selectedPlayer!==null)document.getElementById('p-'+selectedPlayer).classList.add('selected');
    if(selectedEnemy!==null)document.getElementById('e-'+selectedEnemy).classList.add('selected');
    
    document.querySelectorAll('.skin-btn').forEach(s=>s.classList.remove('active'));
    if(selectedPlayer!==null)document.getElementById('sk-p-'+selectedPlayer+'-'+playerSkinIdx).classList.add('active');
    if(selectedEnemy!==null)document.getElementById('sk-e-'+selectedEnemy+'-'+enemySkinIdx).classList.add('active');
    
    document.getElementById('pName').textContent=selectedPlayer!==null?ROSTER[selectedPlayer].name:'-';
    document.getElementById('pSkin').textContent=selectedPlayer!==null?ROSTER[selectedPlayer].skins[playerSkinIdx].name:'-';
    document.getElementById('eName').textContent=selectedEnemy!==null?ROSTER[selectedEnemy].name:'-';
    document.getElementById('eSkin').textContent=selectedEnemy!==null?ROSTER[selectedEnemy].skins[enemySkinIdx].name:'-';
    
    document.getElementById('fightBtn').disabled=(selectedPlayer===null||selectedEnemy===null);
}

// ===== GAME =====
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}

function startFight(){
    if(selectedPlayer===null||selectedEnemy===null)return;
    document.getElementById('selectScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    document.getElementById('winOverlay').classList.add('hidden');
    resizeCanvas();
    initRound();
    gameActive=true;gameTimer=99;roundNum=1;pWins=0;eWins=0;
    updateHUD();
    if(timerID)clearInterval(timerID);
    timerID=setInterval(()=>{if(gameActive){gameTimer--;document.getElementById('timer').textContent=gameTimer;if(gameTimer<=0)endRound('timeout')}},1000);
    gameLoop();
}

function initRound(){
    const pc=ROSTER[selectedPlayer],ec=ROSTER[selectedEnemy];
    const ps=pc.skins[playerSkinIdx],es=ec.skins[enemySkinIdx];
    pPower=0;ePower=0;
    const groundY=canvas.height*GROUND;
    p1={x:canvas.width*0.2,y:groundY-90,w:50,h:80,vx:0,vy:0,hp:pc.stats.hp,mhp:pc.stats.hp,body:ps.body,hair:ps.hair,effect:ps.effect,speed:pc.stats.speed,jump:pc.stats.jump,face:1,atk:false,cd:0,moves:pc.moves};
    p2={x:canvas.width*0.7,y:groundY-90,w:50,h:80,vx:0,vy:0,hp:ec.stats.hp,mhp:ec.stats.hp,body:es.body,hair:es.hair,effect:es.effect,speed:ec.stats.speed,jump:ec.stats.jump,face:-1,atk:false,cd:0,moves:ec.moves};
    particles=[];effects=[];screenShake=0;
    document.getElementById('hudP1').textContent=pc.name;
    document.getElementById('hudP2').textContent=ec.name;
    document.getElementById('round').textContent='Round '+roundNum;
    document.getElementById('timer').textContent=gameTimer;
}

function updateHUD(){
    document.getElementById('hp1').style.width=Math.max(0,p1.hp/p1.mhp*100)+'%';
    document.getElementById('hp2').style.width=Math.max(0,p2.hp/p2.mhp*100)+'%';
    document.getElementById('pw1').style.width=pPower+'%';
    document.getElementById('pw2').style.width=ePower+'%';
}

// ===== INPUT =====
['bL','bU','bR','bP','bK','bS1','bS2','bUL'].forEach(id=>{
    const btn=document.getElementById(id);if(!btn)return;
    btn.addEventListener('touchstart',e=>{e.preventDefault();keys[id]=true});
    btn.addEventListener('touchend',e=>{keys[id]=false});
    btn.addEventListener('mousedown',e=>{keys[id]=true});
    btn.addEventListener('mouseup',e=>{keys[id]=false});
});
document.addEventListener('keydown',e=>{
    if(e.key==='a')keys['bL']=true;if(e.key==='d')keys['bR']=true;if(e.key==='w')keys['bU']=true;
    if(e.key==='j')keys['bP']=true;if(e.key==='k')keys['bK']=true;
    if(e.key==='u')keys['bS1']=true;if(e.key==='i')keys['bS2']=true;if(e.key==='o')keys['bUL']=true;
});
document.addEventListener('keyup',e=>{
    if(e.key==='a')keys['bL']=false;if(e.key==='d')keys['bR']=false;if(e.key==='w')keys['bU']=false;
    if(e.key==='j')keys['bP']=false;if(e.key==='k')keys['bK']=false;
    if(e.key==='u')keys['bS1']=false;if(e.key==='i')keys['bS2']=false;if(e.key==='o')keys['bUL']=false;
});

// ===== COMBAT =====
function executeMove(attacker,defender,moveKey,isPlayer){
    if(attacker.atk||attacker.cd>0)return;
    const move=attacker.moves[moveKey];
    const power=isPlayer?pPower:ePower;
    if(power<move.cost)return;
    
    const dist=Math.abs(attacker.x-defender.x);
    const range=(moveKey==='special2'||moveKey==='ultimate')?250:90;
    if(dist>range||attacker.face!==(defender.x>attacker.x?1:-1))return;
    
    if(isPlayer)pPower-=move.cost;else ePower-=move.cost;
    defender.hp-=move.dmg;
    defender.vy=-(moveKey==='ultimate'?18:10);
    defender.vx=defender.face*-(moveKey==='ultimate'?10:6);
    attacker.atk=true;attacker.cd=(moveKey==='ultimate'?45:20);
    screenShake=(moveKey==='ultimate'?20:moveKey==='special2'?10:4);
    
    effects.push({x:defender.x+25,y:defender.y-20,text:move.name+'! -'+move.dmg,life:40,color:moveKey==='ultimate'?'#ffdd00':'#ffffff',size:moveKey==='ultimate'?'bold 16px':'12px'});
    
    const pCount=moveKey==='ultimate'?40:moveKey==='special2'?20:8;
    for(let i=0;i<pCount;i++){
        particles.push({x:defender.x+25,y:defender.y+40,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:25+Math.random()*20,color:attacker.effect,size:moveKey==='ultimate'?6:3});
    }
    
    updateHUD();
    if(defender.hp<=0){defender.hp=0;updateHUD();endRound(isPlayer?'p1win':'p2win')}
}

// ===== AI =====
function updateAI(){
    if(!gameActive||p2.atk||p2.cd>0)return;
    const dx=p1.x-p2.x,adx=Math.abs(dx);
    const groundY=canvas.height*GROUND;
    
    if(adx>200)p2.vx=dx>0?p2.speed*0.5:-p2.speed*0.5;
    else if(adx<70){
        p2.vx=dx>0?-p2.speed*0.5:p2.speed*0.5;
        if(Math.random()<0.03){
            if(ePower>=100)executeMove(p2,p1,'ultimate',false);
            else if(ePower>=50)executeMove(p2,p1,'special2',false);
            else if(ePower>=30)executeMove(p2,p1,'special1',false);
            else if(Math.random()<0.5)executeMove(p2,p1,'punch',false);
            else executeMove(p2,p1,'kick',false);
        }
    }else{p2.vx*=0.9;if(Math.random()<0.02){if(ePower>=30)executeMove(p2,p1,'special1',false);else executeMove(p2,p1,Math.random()<0.5?'punch':'kick',false)}}
    
    if(p1.y<p2.y-40&&p2.y>=groundY-p2.h&&Math.random()<0.03){p2.vy=-p2.jump}
}

// ===== END ROUND =====
function endRound(winner){
    gameActive=false;
    if(winner==='p1win')pWins++;else if(winner==='p2win')eWins++;
    if(pWins>=2||eWins>=2){
        if(timerID)clearInterval(timerID);
        document.getElementById('winOverlay').classList.remove('hidden');
        document.getElementById('winText').textContent=pWins>=2?'🏆 CHIẾN THẮNG!':'💀 THẤT BẠI';
        document.getElementById('winText').style.color=pWins>=2?'#00ff88':'#ff4444';
        document.getElementById('winMsg').textContent=pWins>=2?ROSTER[selectedPlayer].name+' đánh bại '+ROSTER[selectedEnemy].name+'!':ROSTER[selectedEnemy].name+' đã chiến thắng!';
    }else{
        setTimeout(()=>{gameTimer=99;initRound();gameActive=true;roundNum++;updateHUD();document.getElementById('round').textContent='Round '+roundNum},2000);
    }
}

function rematch(){
    document.getElementById('winOverlay').classList.add('hidden');
    gameTimer=99;roundNum=1;pWins=0;eWins=0;initRound();gameActive=true;updateHUD();
    document.getElementById('round').textContent='Round 1';document.getElementById('timer').textContent=gameTimer;
    if(timerID)clearInterval(timerID);
    timerID=setInterval(()=>{if(gameActive){gameTimer--;document.getElementById('timer').textContent=gameTimer;if(gameTimer<=0)endRound('timeout')}},1000);
    gameLoop();
}

function backToSelect(){
    document.getElementById('winOverlay').classList.add('hidden');
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('selectScreen').classList.remove('hidden');
    if(timerID)clearInterval(timerID);gameActive=false;
}

// ===== GAME LOOP =====
function gameLoop(){
    if(!gameActive){requestAnimationFrame(gameLoop);return}
    const groundY=canvas.height*GROUND;
    
    p1.vx=0;
    if(keys['bL'])p1.vx=-p1.speed;
    if(keys['bR'])p1.vx=p1.speed;
    if(keys['bU']&&p1.y>=groundY-p1.h){p1.vy=-p1.jump}
    if(keys['bP'])executeMove(p1,p2,'punch',true);
    if(keys['bK'])executeMove(p1,p2,'kick',true);
    if(keys['bS1'])executeMove(p1,p2,'special1',true);
    if(keys['bS2'])executeMove(p1,p2,'special2',true);
    if(keys['bUL'])executeMove(p1,p2,'ultimate',true);
    
    [p1,p2].forEach(p=>{
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.7;
        if(p.y>=groundY-p.h){p.y=groundY-p.h;p.vy=0}
        if(p.x<0)p.x=0;if(p.x>canvas.width-p.w)p.x=canvas.width-p.w;
        if(p.cd>0)p.cd--;
        if(p.cd===0&&p.atk)p.atk=false;
    });
    
    pPower=Math.min(100,pPower+0.1);ePower=Math.min(100,ePower+0.1);
    p1.face=p1.x<p2.x?1:-1;p2.face=p2.x<p1.x?1:-1;
    updateAI();
    
    particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});
    effects=effects.filter(e=>{e.life--;return e.life>0});
    if(screenShake>0)screenShake--;
    
    // DRAW
    const sx=screenShake?(Math.random()-0.5)*screenShake:0;
    const sy=screenShake?(Math.random()-0.5)*screenShake:0;
    ctx.save();ctx.translate(sx,sy);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    
    // Stage background
    const grad=ctx.createLinearGradient(0,0,0,canvas.height);
    grad.addColorStop(0,'#0a0a2e');grad
